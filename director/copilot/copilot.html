<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Director Co-Pilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Co-Pilot Studio: you approve the important decisions; the Co-Pilot does the work in between.
   One screen at a time, one main decision per screen, iPhone first, Arabic first. */
:root{
  --bg:#0f1114; --panel:#16191e; --raise:#1c2026; --sunk:#0b0d10; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
  --accent:#8fb4e3; --accent-ink:#0f1114; --accent-soft:#1d2a3a;
  --ok:#6cc79a; --ok-soft:#14301f; --wait:#e8b65a; --wait-soft:#362a10; --bad:#f08c80; --bad-soft:#3a1c19;
  --ai:#b9a3f0; --ai-soft:#271f3d; --unk:#9aa1ab; --unk-soft:#22272e;
  --f:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#fff; --raise:#f7f8fa; --sunk:#e8ebef; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#fff; --accent-soft:#e2ebf4; --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6;
  --bad:#b0362b; --bad-soft:#f8e1de; --ai:#5b3fb0; --ai-soft:#ece6fb; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#fff; --raise:#f7f8fa; --sunk:#e8ebef; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#fff; --accent-soft:#e2ebf4; --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6;
  --bad:#b0362b; --bad-soft:#f8e1de; --ai:#5b3fb0; --ai-soft:#ece6fb; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);margin:0;overflow-wrap:anywhere}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{min-height:54px;width:100%;font-size:1.05rem}
button.ok{border-color:var(--ok);color:var(--ok)} button.bad{border-color:var(--bad);color:var(--bad)}
button.link{background:none;border:none;color:var(--accent);padding:4px 6px;min-height:36px}
button:disabled{opacity:.45;cursor:not-allowed}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input,textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;flex:none}
body.busy button{pointer-events:none;opacity:.6}
h1{font-size:1.05rem;margin:0} h2{font-size:1.25rem;margin:0} h3{font-size:1rem;margin:0} p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
header.bar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:8px}
header.bar a.home{color:var(--ink);text-decoration:none;font-weight:700;margin-inline-end:auto;display:flex;gap:8px;align-items:center}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:none}
main{padding:12px 16px 120px;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;border-radius:99px;padding:2px 9px;line-height:1.5}
.st-owner_approved,.st-completed{background:var(--ok-soft);color:var(--ok)}
.st-needs_owner,.st-changes_requested{background:var(--wait-soft);color:var(--wait)}
.st-blocked{background:var(--bad-soft);color:var(--bad)}
.st-working,.st-ai_review,.st-ai_reviewed{background:var(--ai-soft);color:var(--ai)}
.st-outdated,.st-not_started{background:var(--unk-soft);color:var(--unk)}
.sev-critical{background:var(--bad-soft);color:var(--bad)} .sev-major{background:var(--wait-soft);color:var(--wait)}
.sev-minor{background:var(--accent-soft);color:var(--accent)} .sev-info,.sev-none{background:var(--unk-soft);color:var(--unk)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.86rem}
.crumbs b{font-weight:600} .crumbs .sep{color:var(--muted)}
.next{background:var(--wait-soft);border:1px solid var(--wait);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.next.calm{background:var(--ai-soft);border-color:var(--ai)}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stages button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 8px;min-height:44px;text-align:start;font-size:.76rem;line-height:1.3}
.stages button .pill{font-size:.68rem;padding:0 7px}
.stages button.cur{outline:2px solid var(--accent)}
.lockline{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.timeline{display:flex;gap:3px;width:100%}
.timeline button{flex:1 1 0;min-width:0;min-height:30px;padding:0;border-radius:6px;font-size:.6rem;border-width:2px;white-space:nowrap;overflow:hidden;direction:ltr}
.timeline button.on{outline:2px solid var(--ink)}
.tl-ai_reviewed{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)} .tl-needs_owner{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.tl-outdated{background:repeating-linear-gradient(45deg,var(--unk-soft) 0 5px,transparent 5px 10px);border-color:var(--unk)} .tl-not_started{border-style:dashed}
.tl-working{background:var(--ai-soft);border-color:var(--ai);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.line.sel{border-color:var(--accent)}
.line .txt{font-size:1.05rem;line-height:1.8}
.hooks{display:grid;grid-template-columns:1fr;gap:8px}
.hook{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.hook.sel{border-color:var(--ok);border-width:2px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.frames img,.board img{width:100%;border-radius:8px;display:block;background:var(--sunk)}
.board{border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.board.sel{border-color:var(--accent);border-width:2px}
video,audio{width:100%;border-radius:12px;background:#000;display:block}
audio{background:none}
.words{line-height:2.1;font-size:1.08rem}
.w{border-radius:6px;padding:1px 2px;cursor:pointer}
.w.now{background:var(--accent);color:var(--accent-ink)} .w.est{text-decoration:underline dotted var(--wait)}
.w.heard{color:var(--ok)}
.seg{border-inline-start:3px solid var(--line);padding-inline-start:8px;margin:6px 0}
.seg.need{border-color:var(--wait)} .seg.ok{border-color:var(--ok)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden} .meter i{display:block;height:100%;background:var(--ok)}
.sheet{border:1px solid var(--accent);border-radius:14px;padding:12px;background:var(--raise);display:flex;flex-direction:column;gap:8px}
.finding{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.finding img{width:120px;border-radius:8px}
.label-ai{background:var(--ai-soft);color:var(--ai);border-radius:10px;padding:6px 10px;font-size:.8rem;font-weight:600}
.label-draft{background:var(--wait-soft);color:var(--wait);border-radius:10px;padding:6px 10px;font-size:.84rem;font-weight:600}
.label-lock{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:.84rem;font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:18px;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;max-width:588px;margin:0 auto}
.toast.bad{background:var(--bad);color:#fff}
.inbox li{margin:4px 0} ul{padding-inline-start:20px;margin:0}
.claims li{margin:6px 0}
.ft{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.mode{display:grid;grid-template-columns:1fr;gap:8px}
.mode label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px}
.mode label.dis{opacity:.5}
.mode input{width:22px;height:22px;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;font-size:.88rem}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.vers button{min-height:34px;font-size:.8rem;padding:2px 10px}
</style>
</head>

    heard:'سمعت', of:'من', listen_need:'استمع إلى الأسطر المتغيرة كاملة قبل الموافقة', fixword:'صحّح النطق', respell:'كيف تُقرأ (بالتشكيل)',
    speed:'السرعة', pbefore:'وقفة قبل', pafter:'وقفة بعد', compare:'قارن النسخ', apply:'طبّق', pron:'قاموس النطق', proposed:'مقترح', approved:'معتمد', rejected:'مرفوض',
    qa:'فحوص الصوت', style:'الأسلوب', choose:'اختر هذا', notready:'غير جاهز', pictures:'الصور', upload:'رفع صورة', slot:'لأي مشهد / عنصر',

    paid:'التعليق المدفوع', authorize:'تفويض', blockers:'ما يمنع', locked:'مقفل', ex:'يحتاج قرارك', ai_rev:'راجعه الذكاء', owner_ok:'وافقتَ',
    accept_best:'اقبل أفضل نسخة', retry_with_change:'جرّب بتعديل', remove_banner:'احذف العنوان', keep_fallback:'أبقِ البديل', edit_myself:'سأعدّلها بنفسي',
    dismiss_comment:'تجاهل التعليق', why:'السبب', scene:'مشهد', clip:'المقطع', rounds:'جولات التصحيح', issues:'ملاحظات', none:'لا شيء',
    budget:'ميزانية الذكاء', spent:'المصروف', worker:'العامل', calls:'الاستدعاءات', mock:'ذكاء تجريبي (بلا نموذج)', back:'رجوع', lang:'EN',
    interrupted:'توقف أثناء العمل (سيُستأنف)', ai_label:'نتائج تجريبية', draftvoice:'صوت تجريبي', target:'الهدف', s:'ث'},
  en: {app:'Video Director', projects:'Your projects', newvid:'New video', title:'Title', idea:'Idea', brand:'Brand', mode:'How to work',
    copilot:'Co-Pilot', copilot_d:'You approve the important decisions; the Co-Pilot does the work in between', manual:'Manual', manual_d:'The classic Studio, step by step',
    auto:'Auto', auto_d:'Not yet implemented', duration:'Length (seconds)', start:'Start', stage:'Stage', task:'Task', next:'Your next decision',
    approve:'Approve', changes:'Request changes', reject:'Reject', note:'Note', pause:'Pause', resume:'Resume', stop:'Stop', to_manual:'Switch to Manual',
    retry:'Retry', working:'Co-Pilot is working', waiting:'Waiting for you', paused:'Paused', stopped:'Stopped', idle:'Nothing running',
    processing:'Working time', waittime:'Waiting time', open:'Open', scenes:'Scenes', inbox:'Decisions', history:'History', advanced:'Advanced',
    classic:'Classic Studio', dashboard:'Reports dashboard', ai_usage:'AI usage', cost:'Cost', angle:'Angle', audience:'Audience', format:'Format',
    claims:'Claims and sources', toverify:'To verify', verified:'verified', attributed:'attributed', avoid:'avoid', disputed:'disputed', sources:'sources',
    script:'Script', hooks:'Hooks', usehook:'Use this one', recommended:'recommended', chosen:'chosen', edit:'Edit', save:'Save', cancel:'Cancel',
    whyline:'Why', override:'Override with evidence (a claim id like c4, or a link)', ack:'I read the warning', versions:'Versions', playall:'Play all',
    heard:'heard', of:'of', listen_need:'Listen to every changed line before approving', fixword:'Fix the pronunciation', respell:'How it should be read (with tashkeel)',
    speed:'Speed', pbefore:'Pause before', pafter:'Pause after', compare:'Compare versions', apply:'Apply', pron:'Pronunciation dictionary', proposed:'proposed', approved:'approved', rejected:'rejected',
    qa:'Voice checks', style:'Style', choose:'Choose this', notready:'not ready', pictures:'Pictures', upload:'Upload a picture', slot:'For which scene / item',
    use_ev:'Genuine record (evidence)', use_il:'Illustration', licence:'Licence', evidence:'Link to the licence evidence', declare:'I own this picture or its rights',
    own:'mine', licensed:'licensed', pd:'public domain', cc:'Creative Commons', addlic:'Add licence', missing:'missing', film:'Film', comment:'Comment at',
    send:'Send', findings:'Review findings', explain:'Explain why it stays', ackall:'I acknowledge the minor issues that remain', watch_need:'Watch the whole film before approving',
    paid:'Paid narration', authorize:'Authorize', blockers:'What blocks it', locked:'locked', ex:'Needs your decision', ai_rev:'AI reviewed', owner_ok:'approved by you',
    accept_best:'Accept the best version', retry_with_change:'Try with a change', remove_banner:'Remove the banner', keep_fallback:'Keep the fallback', edit_myself:'I will edit it myself',
    dismiss_comment:'Dismiss the comment', why:'Why', scene:'Scene', clip:'Clip', rounds:'correction rounds', issues:'issues', none:'none',
    budget:'AI budget', spent:'spent', worker:'worker', calls:'calls', mock:'MOCK AI (no model)', back:'Back', lang:'ع',
    interrupted:'stopped mid-way (will be resumed)', ai_label:'mock results', draftvoice:'Draft voice', target:'target', s:'s'}
};
let LANG = 'ar';
try { LANG = localStorage.getItem('cp_lang') || 'ar'; } catch (e) {}
const t = k => (T[LANG][k] ?? T.en[k] ?? k);
const AR = () => LANG === 'ar';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : 'r' + Math.random().toString(36).slice(2) + Date.now());
const fmt = s => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60); return m ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s} ${t('s')}`; };
const S = { pid: null, v: null, panel: null, sig: '', cov: {}, sel: {}, editing: null, ex: null, list: null };

function applyLang() {
  document.documentElement.lang = LANG; document.documentElement.dir = AR() ? 'rtl' : 'ltr';
  $('#lang').textContent = t('lang');
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
}
$('#lang').onclick = () => { LANG = AR() ? 'en' : 'ar'; try { localStorage.setItem('cp_lang', LANG); } catch (e) {} applyLang(); S.sig = ''; render(true); };

function toast(msg, bad) { const e = $('#toast'); e.textContent = msg; e.className = 'toast' + (bad ? ' bad' : ''); e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, bad ? 6000 : 2600); }
async function get(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }
async function post(action, args, project) {
  document.body.classList.add('busy');
  try {
    const r = await fetch('/api/copilot', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: project ?? S.pid, action, args: args || {}, request_id: rid() }) });
    const j = await r.json();
    if (j.status === 'refused' || j.status === 'failed') { toast(j.reason || 'refused', true); return null; }
    return j;
  } catch (e) { toast(String(e), true); return null; }
  finally { document.body.classList.remove('busy'); }
}

// ------------------------------------------------------------------ playback coverage: the parts actually heard
const LAST = {};
function tick(id, el) {
  const p = S.cov[id] ||= {};
  const tt = el.currentTime, l = LAST[id];
  if (l != null && !el.paused && !el.muted && el.volume > 0 && el.playbackRate <= 2.01) {
    const dt = tt - l; if (dt > 0 && dt < 1.0) for (let k = Math.floor(l * 10); k < Math.ceil(tt * 10); k++) p[k] = 1;
  }
  LAST[id] = tt;
}
function covered(id) { const ks = Object.keys(S.cov[id] || {}).map(Number).sort((a, b) => a - b), out = [];
  for (const k of ks) { const l = out[out.length - 1]; if (l && Math.abs(l[1] - k / 10) < 1e-6) l[1] = (k + 1) / 10; else out.push([k / 10, (k + 1) / 10]); }
  return out.map(([a, b]) => [+a.toFixed(1), +b.toFixed(1)]); }
function heardIn(id, a, b) { let n = 0; for (const k in (S.cov[id] || {})) { const x = k / 10; if (x >= a - 0.05 && x < b) n++; } return n / 10; }
function bindMedia(el, id, onT) {
  el.addEventListener('timeupdate', () => { tick(id, el); onT && onT(el.currentTime); });
  el.addEventListener('seeking', () => { LAST[id] = null; });
  el.addEventListener('pause', () => { LAST[id] = null; });
  el.addEventListener('play', () => { LAST[id] = el.currentTime; });
}
const playing = () => [...document.querySelectorAll('audio,video')].some(m => !m.paused);

// ------------------------------------------------------------------ routing
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'new') return { page: 'new' };
  if (h[0] === 'p' && h[1]) return { page: 'project', pid: decodeURIComponent(h[1]), panel: h.slice(2).join('/') || null };
  return { page: 'home' };
}
window.addEventListener('hashchange', () => { S.sig = ''; S.editing = null; render(true); });

async function render(force) {
  applyLang();
  const r = route();
  if (r.page === 'home') return home();
  if (r.page === 'new') return newForm();
  if (S.pid !== r.pid) { S.pid = r.pid; S.v = null; S.cov = {}; }
  S.panel = r.panel;

// ------------------------------------------------------------------ project
const STN = s => AR() ? s.state_name_ar : s.state_name;
function sig(v) { return JSON.stringify([v.current, v.run, v.mode, v.waiting, v.exceptions.map(x => x.id + x.status), v.blocked.map(b => b.key),
  (v.scenes || []).map(s => s.id + s.state + (s.pick && s.pick.n)), v.g5 && v.g5.films, v.g3 && v.g3.mix_current, v.g3 && v.g3.adjust.length,
  v.g3 && v.g3.pron.map(p => p.status), v.assets.library.map(a => a.status), v.g2 && v.g2.check ? 1 : 0, v.g4 && v.g4.n, v.g6 && v.g6.plan && v.g6.plan.hash,
  (v.g5 && v.g5.findings || []).map(f => f.decision), v.gates, (v.g5 && v.g5.comments || []).length, LANG]); }
function defaultPanel(v) {
  const n = v.top.next;
  if (n && n.kind === 'exception') return 'ex/' + n.id;
  if (n && n.kind === 'gate') return n.gate.toLowerCase();
  const s = v.stages.find(x => x.id === v.top.stage_id);
  return ({ direction: 'g1', script: 'g2', voice: 'g3', style: 'g4', assets: 'assets', scenes: 'scenes', film: 'g5', paid: 'g6', export: 'g6' })[s ? s.id : 'direction'];
}
function project(force) {
  const v = S.v;
  const top = topHtml(v);
  const s = sig(v) + '|' + (S.panel || '');
  const typing = document.activeElement && ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName) && $('#main').contains(document.activeElement);
  if (!force && s === S.sig && $('#topbox')) { $('#topbox').innerHTML = top; return; }
  if (!force && (typing || playing()) && $('#topbox')) { $('#topbox').innerHTML = top; return; }
  S.sig = s;
  const panel = S.panel || defaultPanel(v);
  const keep = {};                              // a refresh never moves a player you paused part-way
  document.querySelectorAll('#main audio[id], #main video[id]').forEach(m => { if (m.currentTime > 0 && !m.ended) keep[m.id] = [m.currentSrc, m.currentTime]; });
  $('#main').innerHTML = `<div id="topbox">${top}</div><div id="panel" class="stack">${panelHtml(v, panel)}</div>${footHtml(v)}`;
  wire(v, panel);
  document.querySelectorAll('#main audio[id], #main video[id]').forEach(m => {
    const restore = () => { const k = keep[m.id]; if (k && k[0] === m.currentSrc) m.currentTime = k[1]; };
    if (m.readyState >= 1) restore(); else m.addEventListener('loadedmetadata', restore, { once: true }); });
  $('#main').dataset.view = location.hash;        // which screen is on display (tests and assistive tools can wait for it)
}
function topHtml(v) {
  const n = v.top.next;
  const runTxt = v.task ? t('working') : v.run === 'paused' ? t('paused') : v.run === 'stopped' ? t('stopped') : n ? t('waiting') : t('idle');
  const tk = v.task;
  return `<div class="card">
    <div class="crumbs"><b>${esc(v.title)}</b><span class="sep">›</span><span>${esc(AR() ? v.top.stage_ar : v.top.stage)}</span><span class="sep">›</span>
      <span class="muted">${esc(tk ? tk.what : runTxt)}</span></div>
    ${n ? `<a class="next" href="#/p/${encodeURIComponent(v.id)}/${n.kind === 'gate' ? n.gate.toLowerCase() : 'ex/' + n.id}" style="color:inherit;text-decoration:none">
        <span class="grow"><span class="tiny muted">${t('next')}</span><br><b>${esc(n.kind === 'gate' ? (AR() ? n.title_ar : n.title) : n.title)}</b></span><span>${AR() ? '‹' : '›'}</span></a>`
      : `<div class="next calm"><span class="grow"><b>${runTxt}</b>${tk ? `<br><span class="small">${esc(tk.what)}${tk.units_total ? ` · ${tk.units_done}/${tk.units_total}` : ''} · ${fmt(tk.elapsed_s)}${tk.eta_s != null ? ` · ~${fmt(tk.eta_s)}` : ''}</span>` : ''}</span></div>`}
    ${v.interrupted.length && !v.task ? `<div class="tiny muted">${t('interrupted')}</div>` : ''}
    <div class="stages">${v.stages.map(s => `<button data-go="${({ direction: 'g1', script: 'g2', voice: 'g3', style: 'g4', assets: 'assets', scenes: 'scenes', film: 'g5', paid: 'g6', export: 'g6' })[s.id]}"
        class="${s.id === v.top.stage_id ? 'cur' : ''}"><span>${esc(AR() ? s.name_ar : s.name)}</span><span class="pill st-${s.state}">${esc(STN(s))}</span></button>`).join('')}</div>
    <div class="row between small">
      <span class="muted">${t('processing')} ${fmt(v.timing.processing_s)} · ${t('waittime')} ${fmt(v.timing.waiting_s)}</span>
      <span class="row">${v.mode === 'copilot' ? (v.run === 'running' ? `<button data-ctl="pause">${t('pause')}</button>` : `<button class="primary" data-ctl="resume">${t('resume')}</button>`)
        + (v.run !== 'stopped' ? `<button class="bad" data-ctl="stop">${t('stop')}</button>` : '') : ''}</span></div>
    ${v.blocked.length ? v.blocked.map(b => `<div class="label-lock">${esc(b.what)}: ${esc(b.error).slice(0, 160)} <button data-retry="${esc(b.key)}">${t('retry')}</button></div>`).join('') : ''}
    ${timelineHtml(v)}
    <div class="lockline"><span class="dot" style="background:var(--bad)"></span>${esc(AR() ? v.cost_lock.text_ar : v.cost_lock.text)}
      · ${t('ai_usage')}: ${v.ai.worker === 'mock' ? t('mock') : esc(v.ai.label)} · $${(v.ai.spent_usd || 0).toFixed(3)} / $${(v.ai.budget_usd || 0).toFixed(2)}</div>
  </div>`;
}
function timelineHtml(v) {
  if (!v.scenes || !v.scenes.length) return '';
  return `<div class="stack"><div class="row between tiny muted"><span>${t('scenes')}</span><span><span class="pill st-ai_reviewed">${t('ai_rev')}</span> ≠ <span class="pill st-owner_approved">${t('owner_ok')}</span></span></div>

function decisionButtons(g, opts) {
  opts = opts || {};

    <button class="primary big" data-gate="${g}" data-d="approved" ${opts.disabled ? 'disabled' : ''}>${t('approve')}</button>

const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;
function gateState(v, g) { const s = v.stages.find(x => x.gate === g); return s ? pill('st-' + s.state, STN(s)) + (s.why ? ` <span class="tiny muted">${esc(s.why)}</span>` : '') : ''; }
function working(v, stage) { return v.task && v.task.stage === stage ? `<div class="label-ai">${t('working')}: ${esc(v.task.what)}</div>` : ''; }

function panelHtml(v, p) {
  if (p === 'g1') return g1(v);

    ${d.status === 'approved' ? `<p class="tiny muted">${AR() ? 'تغيير الافتتاحية الآن يصنع نسخة جديدة؛ يُعاد تسجيل سطر الافتتاحية ومشهدها فقط' : 'Changing the hook now makes a new version; only the hook line and its scene are redone'}</p>` : ''}

// ------------------------------------------------------------------ wiring
function gateArgs(v, g, d) {
  const a = { gate: g, decision: d, content_hash: v.current[g] && v.current[g].hash, note: ($('#note-' + g) || {}).value || '' };
  if (g === 'G2') { a.ack = [...document.querySelectorAll('[data-ack]:checked')].map(e => e.dataset.ack);
    a.overrides = Object.fromEntries([...document.querySelectorAll('[data-ov]')].filter(e => e.value.trim()).map(e => [e.dataset.ov, e.value.trim()])); }
  if (g === 'G3') { a.playback = { covered: covered(S.mixId) }; a.ack = ($('#ackqa') || {}).checked ? v.g3.qa.flags.filter(f => f.status === 'open').map(f => f.id) : []; }
  if (g === 'G4') a.choice = S.sel.style;
  if (g === 'G5') { a.playback = { covered: covered(S.filmId) }; a.ack = ($('#ackminor') || {}).checked ? v.g5.findings.filter(f => !f.decision && f.severity === 'minor').map(f => f.id) : []; }
  return a;
}
async function act(action, args) { const j = await post(action, args); if (j) { toast('✓'); S.sig = ''; await render(true); } return j; }
function wire(v, panel) {
  const P = encodeURIComponent(v.id);
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => location.hash = `#/p/${P}/${b.dataset.go}`);
  document.querySelectorAll('[data-ctl]').forEach(b => b.onclick = () => act('cp_control', { op: b.dataset.ctl }));
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => act('cp_control', { op: 'retry', key: b.dataset.retry }));
  document.querySelectorAll('[data-manual]').forEach(b => b.onclick = () => { if (confirm(AR() ? 'التحويل إلى اليدوي؟ لا تُمحى أي موافقة.' : 'Switch to Manual? No approval is erased.')) act('cp_mode', { mode: 'manual' }); });
  document.querySelectorAll('[data-gate]').forEach(b => b.onclick = () => act('cp_gate', gateArgs(v, b.dataset.gate, b.dataset.d)));
  document.querySelectorAll('[data-hook]').forEach(b => b.onclick = () => act('cp_hook', { hook: b.dataset.hook }));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editing = b.dataset.edit; S.sig = ''; project(true); });
  document.querySelectorAll('[data-canceledit]').forEach(b => b.onclick = () => { S.editing = null; S.sig = ''; project(true); });
  document.querySelectorAll('[data-saveline]').forEach(b => b.onclick = async () => { const l = b.dataset.saveline; const j = await act('cp_line_edit', { line: l, text: $('#ed-' + l).value }); if (j) S.editing = null; });
  document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => { S.sel.style = b.dataset.style; S.sig = ''; project(true); });
  document.querySelectorAll('[data-exd]').forEach(b => b.onclick = () => act('cp_exception_decision', { id: panel.slice(3), decision: b.dataset.exd, note: ($('#exnote') || {}).value || '',
    changes: Object.fromEntries(Object.keys(S.sel.chips || {}).filter(k => S.sel.chips[k]).map(c => c.split(':'))) }));
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { S.sel.chips ||= {}; S.sel.chips[b.dataset.chip] = !S.sel.chips[b.dataset.chip]; b.setAttribute('aria-pressed', S.sel.chips[b.dataset.chip]); });
  document.querySelectorAll('[data-fdis]').forEach(b => b.onclick = () => act('cp_finding', { finding: b.dataset.fdis, note: (document.querySelector(`[data-fexp="${b.dataset.fdis}"]`) || {}).value || '' }));
  document.querySelectorAll('[data-lic]').forEach(b => b.onclick = () => { const id = b.dataset.lic;
    act('cp_asset', { op: 'licence', id, licence: document.querySelector(`[data-lickind="${id}"]`).value, evidence: document.querySelector(`[data-licev="${id}"]`).value,
      declare: document.querySelector(`[data-licdec="${id}"]`).checked }); });
  const up = document.querySelector('[data-upload]');
  if (up) up.onclick = async () => { const f = $('#up-file').files[0]; if (!f) return toast(AR() ? 'اختر صورة' : 'Choose a picture', true);
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    const [slot, scene] = $('#up-slot').value.split('|');
    act('upload', { data, name: f.name, ext: f.name.split('.').pop(), slot, scene, use: document.querySelector('input[name=use]:checked').value, credit: $('#up-credit').value }); };
  const g6b = document.querySelector('[data-g6]');
  if (g6b) g6b.onclick = () => act('cp_gate', { gate: 'G6', decision: 'approved', content_hash: v.current.G6 && v.current.G6.hash, confirm_text: $('#g6c').value });
  // voice
  const mix = $('#mix');
  if (mix) {
    let stopAt = null;
    bindMedia(mix, S.mixId, tt => {
      document.querySelectorAll('.w.now').forEach(e => e.classList.remove('now'));
      const w = [...document.querySelectorAll('.w')].find(e => tt >= +e.dataset.ws && tt < +e.dataset.we); if (w) w.classList.add('now');
      v.g3.mix.segments.forEach(s => { const e = document.querySelector(`[data-h="${s.line}"]`); if (e) e.textContent = Math.min(100, Math.round(100 * heardIn(S.mixId, s.start, s.end) / (s.end - s.start))) + '%'; });
      if (stopAt != null && tt >= stopAt) { mix.pause(); stopAt = null; }
    });
    document.querySelectorAll('.w').forEach(e => e.onclick = () => { S.sel.word = { line: e.dataset.line, word: e.dataset.word, s: +e.dataset.ws, e: +e.dataset.we };
      mix.currentTime = Math.max(0, +e.dataset.ws - 0.05); S.sig = ''; project(true); });
    document.querySelectorAll('[data-seekmix]').forEach(e => e.onclick = () => { mix.currentTime = Math.max(0, +e.dataset.seekmix - 0.3); stopAt = +e.dataset.seekmix + 1.2; mix.play(); });
    const pw = document.querySelector('[data-playword]');
    if (pw) pw.onclick = () => { const w = S.sel.word; const m = $('#mix'); m.currentTime = Math.max(0, w.s - 0.08); stopAt = w.e + 0.08; m.play(); };
  }
  const cw = document.querySelector('[data-closeword]'); if (cw) cw.onclick = () => { S.sel.word = null; S.sig = ''; project(true); };
  document.querySelectorAll('[data-pronrej]').forEach(b => b.onclick = () => act('cp_pron', { op: 'decide', id: b.dataset.pronrej, decision: 'rejected' }));
  const pr = document.querySelector('[data-pron]'); if (pr) pr.onclick = () => act('cp_pron', { word: S.sel.word.word, respell: $('#respell').value, lines: [S.sel.word.line] });
  const ad = document.querySelector('[data-adjust]'); if (ad) ad.onclick = () => act('cp_voice_adjust', { line: S.sel.word.line, speed: +$('#sp').value, pause_before: +$('#pb').value, pause_after: +$('#pa').value });
  // film
  const fv = $('#film');
  if (fv) {
    bindMedia(fv, S.filmId, tt => { const e = $('#fheard'); if (e) e.textContent = fmt(heardIn(S.filmId, 0, v.g5.seconds));
      document.querySelectorAll('#ftl button').forEach(b => b.classList.toggle('on', tt >= +b.dataset.seek && tt < (+b.dataset.seek + (+b.style.flexGrow || 0)))); });
    document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { fv.currentTime = +b.dataset.seek; fv.play(); });
    const cm = document.querySelector('[data-comment]');
    if (cm) cm.onclick = () => act('cp_comment', { film: v.g5.n, t: +fv.currentTime.toFixed(2), text: $('#cm').value });
  }
}

// ------------------------------------------------------------------ polling
async function poll() {
  if (route().page === 'project' && S.pid) {
    try { S.v = await get('/api/copilot/' + encodeURIComponent(S.pid)); project(false); } catch (e) {}
  }
  setTimeout(poll, S.v && (S.v.task || S.v.runner_alive) ? 2000 : 6000);
}
render(true).then(() => setTimeout(poll, 2000));
</script>
