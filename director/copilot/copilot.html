<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Co-Pilot Studio: you approve the important decisions; the Co-Pilot does the work in between.
   One screen at a time, one main decision per screen, iPhone first, Arabic first. */
:root{
  --bg:#0f1114; --panel:#16191e; --raise:#1c2026; --sunk:#0b0d10; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
  --accent:#8fb4e3; --accent-ink:#0f1114; --accent-soft:#1d2a3a;
  --ok:#6cc79a; --ok-soft:#14301f; --wait:#e8b65a; --wait-soft:#362a10; --bad:#f08c80; --bad-soft:#3a1c19;
  --ai:#b9a3f0; --ai-soft:#271f3d; --unk:#9aa1ab; --unk-soft:#22272e;
  --f:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#fff; --raise:#f7f8fa; --sunk:#e8ebef; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#fff; --accent-soft:#e2ebf4; --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6;
  --bad:#b0362b; --bad-soft:#f8e1de; --ai:#5b3fb0; --ai-soft:#ece6fb; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#fff; --raise:#f7f8fa; --sunk:#e8ebef; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#fff; --accent-soft:#e2ebf4; --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6;
  --bad:#b0362b; --bad-soft:#f8e1de; --ai:#5b3fb0; --ai-soft:#ece6fb; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}   /* clip, not hidden: hidden turns body into a scroll box and the sticky bars stop sticking */
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);margin:0;overflow-wrap:anywhere}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{min-height:54px;width:100%;font-size:1.05rem}
button.ok{border-color:var(--ok);color:var(--ok)} button.bad{border-color:var(--bad);color:var(--bad)}
button.link{background:none;border:none;color:var(--accent);padding:4px 6px;min-height:36px}
button:disabled{opacity:.45;cursor:not-allowed}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input,textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;flex:none}
body.busy button{pointer-events:none;opacity:.6}
h1{font-size:1.05rem;margin:0} h2{font-size:1.25rem;margin:0} h3{font-size:1rem;margin:0} p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.8125rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
header.bar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:8px}
header.bar a.home{color:var(--ink);text-decoration:none;font-weight:700;margin-inline-end:auto;display:flex;gap:8px;align-items:center}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:none}
main{padding:12px 16px 120px;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:.8125rem;font-weight:600;border-radius:99px;padding:2px 9px;line-height:1.5}
.st-owner_approved,.st-completed{background:var(--ok-soft);color:var(--ok)}
.st-needs_owner,.st-changes_requested{background:var(--wait-soft);color:var(--wait)}
.st-blocked{background:var(--bad-soft);color:var(--bad)}
.st-working,.st-ai_review,.st-ai_reviewed{background:var(--ai-soft);color:var(--ai)}
.st-outdated,.st-not_started{background:var(--unk-soft);color:var(--unk)}
.sev-critical{background:var(--bad-soft);color:var(--bad)} .sev-major{background:var(--wait-soft);color:var(--wait)}
.sev-minor{background:var(--accent-soft);color:var(--accent)} .sev-info,.sev-none{background:var(--unk-soft);color:var(--unk)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.86rem}
.crumbs b{font-weight:600} .crumbs .sep{color:var(--muted)}
.next{background:var(--wait-soft);border:1px solid var(--wait);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.next.calm{background:var(--ai-soft);border-color:var(--ai)}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stages button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 8px;min-height:44px;text-align:start;font-size:.8125rem;line-height:1.3}
.stages button .pill{font-size:.8125rem;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.st-locked{background:var(--unk-soft);color:var(--unk)}
.stages button.cur{outline:2px solid var(--accent)}
.lockline{font-size:.8125rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.timeline{display:flex;gap:2px;width:100%}
.timeline button{flex:1 1 0;min-width:0;min-height:32px;padding:0;border-radius:6px;font-size:.8125rem;border-width:2px;white-space:nowrap;overflow:hidden;direction:ltr;position:relative;font-variant-numeric:tabular-nums}
.timeline button i{font-style:normal;font-weight:700;position:absolute;top:-1px;inset-inline-end:2px;font-size:.75rem;line-height:1}
.timeline .end{flex:0 0 10px;align-self:stretch;border-radius:4px;background:var(--sunk)}
.timeline button.on{outline:2px solid var(--ink)}
.tl-ai_reviewed{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)} .tl-needs_owner{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.tl-outdated{background:repeating-linear-gradient(45deg,var(--unk-soft) 0 5px,transparent 5px 10px);border-color:var(--unk)} .tl-not_started{border-style:dashed}
.tl-working{background:var(--ai-soft);border-color:var(--ai);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.line.sel{border-color:var(--accent)}
.line .txt{font-size:1.05rem;line-height:1.8}
.hooks{display:grid;grid-template-columns:1fr;gap:8px}
.hook{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.hook.sel{border-color:var(--ok);border-width:2px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.frames img,.board img{width:100%;border-radius:8px;display:block;background:var(--sunk)}
.board{border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.board.sel{border-color:var(--accent);border-width:2px}
video,audio{width:100%;border-radius:12px;background:#000;display:block}
audio{background:none}
.words{line-height:2.1;font-size:1.08rem}
.w{border-radius:6px;padding:1px 2px;cursor:pointer}
.w.now{background:var(--accent);color:var(--accent-ink)} .w.est{text-decoration:underline dotted var(--wait)}
.w.heard{color:var(--ok)}
.seg{border-inline-start:3px solid var(--line);padding-inline-start:8px;margin:6px 0}
.seg.need{border-color:var(--wait)} .seg.ok{border-color:var(--ok)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden} .meter i{display:block;height:100%;background:var(--ok)}
.sheet{border:1px solid var(--accent);border-radius:14px;padding:12px;background:var(--raise);display:flex;flex-direction:column;gap:8px}
.finding{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.finding img{width:120px;border-radius:8px}
.label-ai{background:var(--ai-soft);color:var(--ai);border-radius:10px;padding:6px 10px;font-size:.8125rem;font-weight:600}
.label-draft{background:var(--wait-soft);color:var(--wait);border-radius:10px;padding:6px 10px;font-size:.84rem;font-weight:600}
.label-lock{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:.84rem;font-weight:600}
/* messages (at the top, clear of the decision bar): a success note fades; a refusal stays until closed or fixed; the text never blocks a tap (only its buttons take taps) */
.toast{position:fixed;inset-inline:16px;top:calc(60px + env(safe-area-inset-top,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;max-width:588px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-height:45vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.toast .tacts{display:flex;gap:8px;flex-wrap:wrap}
.toast button{pointer-events:auto;min-height:40px;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:inherit;font-weight:600}
.toast details{pointer-events:auto;font-weight:400;font-size:.8125rem;opacity:.9} .toast details div{direction:ltr;text-align:left}
.hl{outline:3px solid var(--wait)!important;outline-offset:3px;border-radius:8px}
.ask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ask .card{width:100%;max-width:588px}
.lockchip{display:inline-flex;gap:4px;align-items:center;border-radius:99px;padding:2px 10px;min-height:28px;background:var(--unk-soft);color:var(--unk);text-decoration:none;font-weight:600}
.inbox li{margin:4px 0} ul{padding-inline-start:20px;margin:0}
.claims li{margin:6px 0}
.ft{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;align-items:center} .ft a{display:inline-flex;align-items:center;min-height:32px}
.srcs a{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px}
.mode{display:grid;grid-template-columns:1fr;gap:8px}
.mode label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px}
.mode label.dis{opacity:.5}
.mode input{width:22px;height:22px;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;font-size:.88rem}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.vers button{min-height:34px;font-size:.8125rem;padding:2px 10px}
/* compact header, progress dots, the decision bar that stays at the bottom, folded details */
a.next{color:inherit;text-decoration:none}
.sharelink{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--raise);text-decoration:none;font-weight:600}
.top .ttl{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.sm{min-height:36px;padding:4px 12px;font-size:.88rem}
.dots{display:flex;gap:4px}
.dots button{flex:1 1 0;min-width:0;min-height:28px;padding:0;border:none;background:none;border-radius:6px;display:flex;align-items:center}
.dots button i{display:block;width:100%;height:8px;border-radius:99px;background:var(--line)}
.dots .d-done i{background:var(--ok)} .dots .d-wait i{background:var(--wait)} .dots .d-work i{background:var(--ai);animation:pulse 1.2s infinite}
.dots .d-ai i{background:var(--ai-soft);box-shadow:inset 0 0 0 1px var(--ai)} .dots .d-bad i{background:var(--bad)} .dots .d-lock i{background:repeating-linear-gradient(90deg,var(--unk) 0 3px,transparent 3px 6px)}
.dots button.cur i{height:12px;box-shadow:0 0 0 2px var(--ink)}
.dbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.dbar .miss:empty{display:none} .dbar .miss{font-size:.8125rem;color:var(--wait)} .dbar .miss ul{margin:2px 0 0}
.dbar .miss button.link{min-height:28px;padding:0;color:var(--wait);text-decoration:underline;text-align:start}
details>summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px}
details.card>summary{font-weight:600}
.dbar details>summary{color:var(--accent);font-size:.92rem}
.rec{box-shadow:0 0 0 2px var(--ok)} .recwhy{font-size:.8125rem;color:var(--ok);margin-top:-4px}
.stagelist{list-style:none;padding:0;margin:0;display:grid;gap:2px} .stagelist li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.stagelist a{min-height:28px;display:inline-flex;align-items:center}
.ask .card{max-height:85vh;overflow:auto}
.label-lock details{font-weight:400}
</style>
</head>

      <div class="tiny srcs">${(c.sources || []).map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener" aria-label="${esc((AR() ? 'المصدر ' : 'source ') + (i + 1))}">[${i + 1}]</a>`).join(' ')}</div></li>`).join('')}</ul>
    ${doc.claims_to_verify && doc.claims_to_verify.length ? `<h3>${t('toverify')}</h3><ul class="small">${doc.claims_to_verify.map(x => `<li>${esc(x.claim)}: ${esc(AR() ? x.why_ar || x.why : x.why)}</li>`).join('')}</ul>` : ''}
    ${d.check ? `<div class="tiny muted">${esc(d.check.by || '')}: ${d.check.findings.map(f => `${esc(f.claim)} · ${esc(codeName(f.code))}`).join(' · ') || t('none')}</div>` : ''}</details>

// ---------------------------------------------------------------- G2
function g2(v) {
  const d = v.g2;
  if (!d) return `<div class="card"><h2>${t('script')}</h2>${working(v, 'script') || `<p class="muted">—</p>`}</div>`;
  const ck = d.check ? d.check.lines : {}, hk = d.hooks;
  const open = !v.validity.G2.valid && (d.status === 'draft' || d.status === 'approved');   // approved by hand in Manual: you confirm it here
  const VERD = { supported: 'مدعوم بمصدر', attributed: 'منسوب', uncertain: 'غير مؤكد', unsupported: 'بلا مصدر', contradicted: 'يخالف البحث', disputed: 'الفحوص مختلفة' };
  const lines = d.lines.map(l => { const c = ck[l.id] || { severity: 'none', why: [], verdict: '' }; const ed = S.editing === l.id;
    const flag = ['critical', 'major', 'minor'].includes(c.severity);
    return `<div class="line ${ed ? 'sel' : ''}" id="ln-${l.id}"><div class="row between"><span class="tiny muted">${esc(lineName(l.id))}</span>
      <span>${flag && c.verdict ? pill('sev-' + c.severity, AR() ? VERD[c.verdict] || c.verdict : c.verdict) : ''}</span></div>
      ${ed ? `<textarea id="ed-${l.id}" data-draft="ed:${d.v}:${l.id}">${esc(l.text)}</textarea><div class="row"><button class="primary" data-saveline="${l.id}">${t('save')}</button><button data-canceledit="1">${t('cancel')}</button></div>`
           : `<div class="txt">${esc(l.text)}</div>`}
      ${flag && c.why && c.why.length ? `<div class="tiny">${c.why.map(w => `• ${esc(w)}`).join('<br>')}</div>` : ''}
      ${flag && c.sources && c.sources.length ? `<div class="tiny srcs">${t('sources')}: ${c.sources.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener" aria-label="${esc((AR() ? 'المصدر ' : 'source ') + (i + 1))}">[${i + 1}]</a>`).join(' ')}</div>` : ''}
      ${c.severity === 'critical' && open ? `<input data-ov="${l.id}" data-draft="ov:${d.v}:${l.id}" placeholder="${t('override')}" aria-label="${t('override')}">` : ''}
      ${c.severity === 'major' && open ? `<label class="row small"><input type="checkbox" data-ack="${l.id}" data-draft="ack:${d.v}:${l.id}"> ${t('ack')}</label>` : ''}
      ${l.role !== 'hook' && !ed && d.status === 'draft' ? `<button class="link" data-edit="${l.id}">${t('edit')}</button>` : ''}</div>`; }).join('');
  const sel = hk.options.find(o => o.id === hk.selected) || hk.options.find(o => o.id === hk.recommended);
  const others = hk.options.filter(o => o !== sel);
  const hookCard = o => `<div class="hook ${hk.selected === o.id ? 'sel' : ''}">
      <div class="row between"><b>${esc(AR() ? (HOOKT[o.type] || o.type) : o.type)}</b><span>${o.id === hk.recommended ? pill('st-ai_review', t('recommended')) : ''} ${hk.selected === o.id ? pill('st-owner_approved', t('chosen')) : ''}</span></div>
      <div>${esc(o.spoken)}</div>${hk.selected !== o.id ? `<button data-hook="${o.id}">${t('usehook')}</button>` : ''}</div>`;
  return `<div class="card"><div class="row between"><h2>${t('script')}</h2>${gateState(v, 'G2')}</div>${working(v, 'script')}
    <h3>${t('hook_one')}</h3>${sel ? hookCard(sel) : ''}${sel && sel.id === hk.recommended && hk.reasons ? `<details class="tiny muted" data-keep="hookwhy"><summary>${t('whyline')}</summary><p>${esc(hk.reasons)}</p></details>` : ''}
    ${others.length ? `<details data-keep="hooks"><summary class="small">${t('other_hooks')} (${others.length})</summary><div class="hooks">${others.map(hookCard).join('')}</div></details>` : ''}
    ${d.status === 'approved' ? `<p class="tiny muted">${AR() ? 'تغيير الافتتاحية الآن يصنع نسخة جديدة؛ يُعاد تسجيل سطر الافتتاحية ومشهدها فقط' : 'Changing the hook now makes a new version; only the hook line and its scene are redone'}</p>` : ''}</div>
  <div class="card"><h3>${t('script')} · v${d.v}</h3>${lines}
    <details class="tiny" data-keep="vers"><summary>${t('versions')} (${d.versions.length})</summary><p class="muted">${esc(d.note)} · ${esc(stx(d.author))}${d.check ? ` · ${esc(d.check.fact_label || '')}` : ''}</p>
      <div class="vers">${d.versions.map(x => `<span class="pill st-${x.v === d.v ? 'ai_review' : 'not_started'}">v${x.v} · ${esc(stx(x.status))}</span>`).join('')}</div></details></div>
  ${open ? decisionBar(v, 'G2', d.status === 'approved' ? { approveOnly: true } : {}) : `<div class="card">${pill('st-' + (d.status === 'approved' ? 'owner_approved' : 'needs_owner'), stx(d.status))}</div>`}`;
}

// ---------------------------------------------------------------- G3

  S.mixId = id;
  const segs = mix ? mix.segments.map(s => { const need = s.status !== 'approved'; const h = heardIn(id, s.start, s.end), L = s.end - s.start;
    return `<div class="seg ${need ? 'need' : 'ok'}" data-seg="${s.line}"><div class="row between tiny"><span class="muted">${esc(lineName(s.line))}</span>
      <span>${need ? `${t('heard')} <b data-h="${s.line}">${Math.min(100, Math.round(100 * h / L))}%</b>` : pill('st-owner_approved', t('owner_ok'))}</span></div>

  ${sel && ln ? `<div class="sheet"><div class="row between"><b>«${esc(sel.word)}»</b><span class="tiny muted" data-line="${esc(sel.line)}">${esc(lineName(sel.line))}</span></div>

      <label class="stack small">${t('fixword')}<input id="respell" data-draft="respell:${esc(sel.line)}:${esc(sel.word)}" placeholder="${t('respell')}" value="${esc(sel.word)}"></label>
      <button class="primary" data-pron="1">${t('apply')}</button>
      <div class="row small"><label class="grow">${t('speed')}<select id="sp"><option>0.9</option><option selected>1.0</option><option>1.1</option></select></label>
        <label class="grow">${t('pbefore')}<select id="pb"><option>0</option><option>0.3</option><option>0.6</option></select></label>
        <label class="grow">${t('pafter')}<select id="pa"><option>0</option><option>0.3</option><option>0.6</option></select></label></div>
      <button data-adjust="1">${t('apply')} (${AR() ? 'معالجة محلية مجانية' : 'free local processing'})</button>
      <h3>${t('compare')}</h3>${ln.takes.map((k, i) => `<div class="row small"><span class="grow">v${i + 1} · ${esc(stx(k.status))} · ${esc(k.processed ? (AR() ? 'معالجة محلية' : 'processed locally') : takeWhy(k.reason))}${k.same_audio_as ? ' · ' + (AR() ? 'الصوت نفسه' : 'same audio as before') : ''}</span>
        <audio controls preload="none" src="${esc(k.audio)}" style="max-width:220px"></audio></div>`).join('')}
      <button class="link" data-closeword="1">${t('cancel')}</button></div>` : ''}
  <div class="card"><h3>${t('script')}</h3><p class="tiny muted">${AR() ? 'اضغط كلمة لتسمعها أو تصحّحها' : 'Tap a word to hear or fix it'}</p>${segs}</div>
  <details class="card" data-keep="pron"><summary>${t('pron')} (${d.pron.length})</summary>${d.pron.length ? d.pron.map(p => `<div class="row small"><span class="grow">«${esc(p.word)}» → «${esc(p.respell)}» <span class="tiny muted">${esc(p.why || '')}</span></span>
      ${pill(p.status === 'approved' ? 'st-owner_approved' : 'st-ai_review', (p.source === 'ai' ? 'AI · ' : '') + t(p.status))}
      ${p.status === 'proposed' ? `<button data-pronrej="${p.id}">${t('reject')}</button>` : p.status === 'approved' ? `<button data-pronrej="${p.id}">${t('withdraw')}</button>` : ''}</div>`).join('') : `<p class="muted">${t('none')}</p>`}</details>
  <div class="card"><h3>${t('qa')}</h3>${(() => { const open = d.qa.flags.filter(f => f.status === 'open');
      const at = f => { const sg = mix && mix.segments.find(x => x.line === f.line); return sg && f.s != null ? (sg.start + f.s) : (sg ? sg.start : 0); };
      return d.qa.flags.length ? `<div class="chips">${d.qa.flags.map(f => `<button data-seekmix="${at(f).toFixed(2)}" title="${esc(AR() ? (f.detail_ar || f.detail) : f.detail)}">${esc(lineNo(f.line))} · ${esc(f.word || codeName(f.code))}${f.status !== 'open' ? ' ✓' : ''}</button>`).join('')}</div>
        <p class="tiny muted">${AR() ? 'كلمات غير واضحة للآلة. اضغط لتسمعها؛ أنت تحكم.' : 'Words the machine could not place. Tap to hear them; you decide.'}</p>
        ${open.length ? `<label class="row small"><input type="checkbox" id="ackqa" data-draft="ackqa:${hashIds(open.map(f => f.id))}"> ${AR() ? 'استمعتُ إلى هذه الكلمات' : 'I listened to these words'} (${open.length})</label>` : ''}`
        : `<p class="muted small">${t('none')}</p>`; })()}</div>

}

      : `<button data-seek="${s.start}" data-sid="${s.id}" class="tl-${(v.scenes.find(x => x.id === s.id) || {}).state || 'ai_reviewed'}" aria-label="${esc(lineName(s.id, true) + ' · ' + fmt(s.start))}"
      style="flex-grow:${Math.max(0.5, s.end - s.start)}">${esc(lineNo(s.id))}</button>`).join('')}</div>
    <div class="row between small"><span>${t('heard')} <b id="fheard">${fmt(h)}</b> ${t('of')} ${fmt(d.seconds)}</span><span class="tiny muted">${d.approved_film ? 'v' + d.approved_film.n + ' ' + t('owner_ok') : ''}</span></div>
    ${d.share ? `<a class="sharelink" href="${esc(d.share)}" download="${esc((v.title || 'film').replace(/[^\w\u0600-\u06FF -]/g, '') + ' v' + d.n)}.mp4">⬇ ${t('share')}${d.share_mb ? ` (${d.share_mb} ${t('mb')})` : ''}</a><span class="tiny muted">${t('share_note')}</span>` : ''}
    <div class="row"><input id="cm" class="grow" data-draft="cm:${d.n}" aria-label="${t('comment')}" placeholder="${t('comment')} …"><button data-comment="1">${t('send')}</button></div>
    ${d.comments.map(c => { const tk = d.tasks.find(x => x.source === 'comment ' + c.id) || {}; return `<div class="tiny">⏱ ${fmt(c.t)} · ${esc(lineName(c.scene, true))} · «${esc(c.text)}» · ${esc(stx(tk.status || ''))}</div>`; }).join('')}</div>
  ${big.length || minor.length || done.length ? `<div class="card"><h3>${t('findings')}</h3>
    ${big.map(f => `<div class="finding"><div class="row between">${pill('sev-' + f.severity, codeName(f.code))}<button class="link" data-seek="${f.t || 0}">⏱ ${fmt(f.t)}</button></div>
      <div class="small">${esc(AR() && f.detail_ar ? f.detail_ar : f.detail)}</div>${f.evidence ? `<img src="${esc(f.evidence)}" alt="${esc(codeName(f.code))}" loading="lazy">` : ''}
      ${f.recommendation ? `<div class="tiny muted">${esc(f.recommendation)}</div>` : ''}
      <input data-fexp="${f.id}" data-draft="fexp:${f.id}" aria-label="${f.severity === 'critical' ? t('override') : t('explain')}" placeholder="${f.severity === 'critical' ? t('override') : t('explain')}"><button data-fdis="${f.id}">${t('save')}</button></div>`).join('')}
    ${minor.length ? `<details class="small" data-keep="minor"><summary>${minor.length} ${t('minor_n')}</summary>${minor.map(f => `<div class="small">${pill('sev-minor', codeName(f.code))} ${esc(f.scene ? lineName(f.scene, true) : '')} · ${esc(AR() && f.detail_ar ? f.detail_ar : f.detail)}</div>`).join('')}</details>
      <label class="row small"><input type="checkbox" id="ackminor" data-draft="ackminor:${d.n}:${hashIds(minor.map(f => f.id))}"> ${t('ackall')} (${minor.length})</label>` : ''}
    ${done.length ? `<details class="tiny"><summary>${done.length} ✓</summary>${done.map(f => `<div>${esc(codeName(f.code))} · ${esc(stx(f.decision))} · ${esc(f.decision_note || '')}</div>`).join('')}</details>` : ''}</div>` : ''}
  ${v.validity.G5.valid ? `<div class="card">${pill('st-owner_approved', t('owner_ok'))}</div>` : decisionBar(v, 'G5')}`;
}

// ---------------------------------------------------------------- G6
function g6(v) {
  const d = v.g6;
  const p = d && d.plan;
  return `<div class="card"><div class="row between"><h2>${t('paid')}</h2>${gateState(v, 'G6')}</div>
    <div class="label-lock">${esc(AR() ? v.cost_lock.text_ar : v.cost_lock.text)}</div>
    ${p ? `<div class="kv small"><span class="muted">${t('script')}</span><span>v${p.script_v}</span><span class="muted">${t('voice')}</span><span>${esc(p.voice.name)} · ${esc(p.voice.model || p.voice.provider)}</span>
      <span class="muted">${AR() ? 'الأحرف' : 'Characters'}</span><span>${p.chars_total}</span><span class="muted">${t('budget')}</span><span>${p.budget_remaining ?? '—'}</span></div>
      <details><summary class="small">${AR() ? 'النص الذي سيُرسل' : 'Exact text that would be sent'} (${p.items.length})</summary>${p.items.map(i => `<div class="tiny">${esc(i.line)} · ${esc(i.action)} · ${i.chars} · ${esc(i.provider_input)}</div>`).join('')}</details>
      <h3>${t('blockers')}</h3><ul class="small">${p.blockers.map((b, i) => `<li>${esc(AR() ? ((p.blockers_ar || [])[i] || b) : b)}</li>`).join('')}</ul>
      <p class="tiny muted">${esc(AR() ? d.note_ar : d.note)}</p>
      <input id="g6c" data-draft="g6c:${p.hash}" inputmode="numeric" aria-label="${AR() ? 'عدد الأحرف للتأكيد' : 'Character count to confirm'}" placeholder="${AR() ? 'اكتب عدد الأحرف للتأكيد' : 'Type the character count to confirm'}">
      <button class="bad big" data-g6="1">${t('authorize')}</button>` : `<p class="muted small">${AR() ? 'تُبنى الخطة بعد موافقتك على الفيلم' : 'The plan is built after you approve the film'}</p>`}
    <p class="tiny muted">${AR() ? 'التصدير النهائي والنشر: تفويضات منفصلة، لا تحدث تلقائيًا أبدًا.' : 'Final export and publishing are separate authorizations and never automatic.'}</p></div>`;
}

// ---------------------------------------------------------------- exceptions, inbox, ai, history
function exPanel(v, id) {
  const x = v.exceptions.find(e => e.id === id);
  if (!x) return `<div class="card">—</div>`;
  const chips = ['text_size:1.2', 'zoom:1.18', 'slower:1.4', 'theme:tk-ink', 'theme:tk-bone'];
  const r = x.recommend;                                 // highlighted only when the server gives a clear reason; you still choose
  const opt = o => r && r.option === o
    ? `<button data-exd="${o}" class="primary rec">${t(o)} · ${t('recommended')}</button><p class="recwhy">${esc(AR() ? r.why_ar : r.why_en)}</p>`
    : `<button data-exd="${o}">${t(o)}</button>`;
  return `<div class="card"><div class="row between"><h2>${t('ex')}</h2>${pill(x.status === 'open' ? 'st-needs_owner' : 'st-completed', stx(x.status))}</div>
    <p><b>${esc(AR() ? (x.title_ar || x.title) : x.title)}</b></p><p class="small">${esc(AR() ? x.detail_ar || x.detail : x.detail)}</p>
    ${x.evidence && x.evidence.length ? `<div class="frames">${x.evidence.map((u, i) => `<img src="${esc(u)}" alt="${esc((x.scene ? lineName(x.scene, true) : '') + '، ' + t('frame') + ' ' + (i + 1))}">`).join('')}</div>` : ''}
    ${x.scene ? `<a href="#/p/${encodeURIComponent(v.id)}/scene/${x.scene}">${esc(lineName(x.scene, true))}</a>` : ''}
    ${x.status !== 'open' ? `<p class="small">${esc(stx(x.decision))} · ${esc(x.decision_note || '')}</p>`
      : v.mode !== 'copilot' ? `<p class="small">${t('manual_gate')}</p><button class="primary big" data-back="1">${t('back_cp')}</button>`
      : `<textarea id="exnote" data-draft="exnote:${x.id}" aria-label="${t('why')}" placeholder="${t('why')}"></textarea>
      ${x.options.includes('retry_with_change') ? `<div class="chips">${chips.map(c => `<button data-chip="${c}" aria-pressed="${!!(S.sel.chips || {})[c]}">${esc(chipName(c))}</button>`).join('')}</div>` : ''}
      <div class="stack">${x.options.map(opt).join('')}</div>`}</div>`;
}
function inbox(v) {
  const g = {};
  v.inbox.forEach(i => (g[i.group] ||= []).push(i));
  const GN = { decisions: 'قرارات', gates: 'موافقات', problems: 'مشكلات', scenes: 'مشاهد' };
  return `<div class="card"><h2>${t('inbox')}</h2>${Object.keys(g).length ? Object.entries(g).map(([k, xs]) => `<h3>${esc(AR() ? GN[k] || k : k)}</h3><ul class="inbox">${xs.map(i =>
    `<li><a href="#/p/${encodeURIComponent(v.id)}/${i.kind === 'gate' ? i.gate.toLowerCase() : i.kind === 'exception' ? 'ex/' + i.id : i.kind === 'scene' ? 'scene/' + i.scene : ''}">${esc(AR() ? i.title_ar || i.title : i.title)}</a></li>`).join('')}</ul>`).join('') : `<p class="muted">${t('none')}</p>`}</div>`;
}
// who does the AI work, and how much real AI use you allow (the real worker is also locked by the computer it runs on)
function aiPanel(v) {
  const a = v.ai, left = Math.max(0, a.budget_usd - a.spent_usd);
  return `<div class="card"><h2>${t('ai_usage')}</h2>
    <div class="kv small"><span class="muted">${t('budget')}</span><span>$${a.budget_usd.toFixed(2)}</span><span class="muted">${t('spent')}</span><span>$${a.spent_usd.toFixed(4)}</span>
      <span class="muted">${t('left')}</span><span>$${left.toFixed(2)}</span></div></div>
  <div class="card"><h3>${t('worker')}</h3><div class="mode">
      <label><input type="radio" name="worker" value="mock" ${a.worker === 'mock' ? 'checked' : ''}><span><b>${t('w_mock')}</b><br><span class="tiny muted">${t('w_mock_d')}</span></span></label>
      <label class="${a.real_enabled ? '' : 'dis'}"><input type="radio" name="worker" value="claude-code" ${a.worker === 'claude-code' ? 'checked' : ''} ${a.real_enabled ? '' : 'disabled'}><span><b>Claude</b><br><span class="tiny muted">${a.real_enabled ? t('w_real_d') : t('w_real_off')}</span></span></label></div>
    <button data-worker="1">${t('save')}</button></div>
  <div class="card"><h3>${t('set_budget')}</h3><p class="tiny muted">${t('budget_rule')}</p>
    <label class="stack small">${t('usd')}<input id="ai-usd" type="number" min="0" max="50" step="0.5" inputmode="decimal" data-draft="ai-usd"></label>
    <textarea id="ai-why" data-draft="ai-why" aria-label="${t('budget_why')}" placeholder="${t('budget_why')}"></textarea>
    <label class="row small"><input type="checkbox" id="ai-ok"> ${t('budget_ok')}</label>
    <button class="primary" data-aibudget="1">${t('set_budget')}</button></div>
  ${a.calls.length ? `<details class="card" data-keep="calls"><summary>${t('calls')} (${a.n_calls})</summary>${a.calls.slice().reverse().map(c => `<div class="tiny">${esc((c.at || '').replace('T', ' ').slice(0, 16))} · ${esc(aiKind(c.kind))} · ${stx(c.ok ? 'ok' : 'failed')} · $${(c.cost_usd || 0).toFixed(4)} · ${c.duration_s} ${t('s')}</div>`).join('')}</details>` : ''}`;
}
function historyPanel(v) {
  return `<div class="card"><h2>${t('history')}</h2>${v.history.map(h => `<div class="tiny"><span class="muted">${esc(h.at.slice(11, 19))} · ${esc(h.actor)}</span> ${esc(h.summary)}</div>`).join('')}</div>`;
}

// ------------------------------------------------------------------ wiring
function gateArgs(v, g, d) {
  const a = { gate: g, decision: d, content_hash: v.current[g] && v.current[g].hash, note: ($('#note-' + g) || {}).value || '' };
  if (g === 'G2') { a.ack = [...document.querySelectorAll('[data-ack]:checked')].map(e => e.dataset.ack);
    a.overrides = Object.fromEntries([...document.querySelectorAll('[data-ov]')].filter(e => e.value.trim()).map(e => [e.dataset.ov, e.value.trim()])); }
  if (g === 'G3') { a.playback = { covered: covered(S.mixId), of: v.g3.mix && v.g3.mix.file }; a.ack = ($('#ackqa') || {}).checked ? v.g3.qa.flags.filter(f => f.status === 'open').map(f => f.id) : []; }
  if (g === 'G4') a.choice = S.sel.style;
  if (g === 'G5') { a.playback = { covered: covered(S.filmId), of: S.filmN }; a.ack = ($('#ackminor') || {}).checked ? v.g5.findings.filter(f => !f.decision && f.severity === 'minor').map(f => f.id) : []; }
  return a;
}
// what each recorded action used up: its unsent text is cleared once the server has recorded it (never before)
function usedDrafts(action, args) {
  const a = args || {};
  if (action === 'cp_gate') return ['note:' + a.gate].concat(a.gate === 'G2' ? ['ov:', 'ack:'] : a.gate === 'G3' ? ['ackqa:'] : a.gate === 'G5' ? ['ackminor:'] : a.gate === 'G6' ? ['g6c:'] : []);
  if (action === 'cp_comment') return ['cm:'];
  if (action === 'cp_finding') return ['fexp:' + a.finding];
  if (action === 'cp_exception_decision') return ['exnote:' + a.id];
  if (action === 'cp_line_edit') return ['ed:'];
  if (action === 'cp_asset' && a.op === 'licence') return ['licev:' + a.id, 'licdec:' + a.id, 'lickind:' + a.id];
  if (action === 'upload') return ['up-credit'];
  if (action === 'cp_pron') return ['respell:'];
  if (action === 'cp_ai_budget') return ['ai-usd', 'ai-why'];
  return [];
}
async function act(action, args) {
  const j = await post(action, args);
  if (j) { clearDrafts(usedDrafts(action, args)); toast('✓'); S.sig = ''; await render(true); }
  return j;
}
function wire(v, panel) {
  const wk = document.querySelector('[data-worker]');
  if (wk) wk.onclick = () => { const w = (document.querySelector('input[name=worker]:checked') || {}).value; if (w && w !== v.ai.worker) act('cp_settings', { worker: w }); };
  const ab = document.querySelector('[data-aibudget]');
  if (ab) ab.onclick = async () => {
    const usd = +$('#ai-usd').value || 0;
    if (!$('#ai-ok').checked) return toast(t('budget_tick'), true, { fix: { label_ar: t('take_me'), label_en: t('take_me'), target: '#ai-ok' } });
    if (!(await ask(t('budget_q'), `${t('budget_b')} $${usd.toFixed(2)}`, t('budget_yes'), 'bad'))) return;   // real spending: asked twice
    act('cp_ai_budget', { usd, note: $('#ai-why').value.trim() }); };
  document.querySelectorAll('[data-gate]').forEach(b => b.onclick = () => act('cp_gate', gateArgs(v, b.dataset.gate, b.dataset.d)));
  document.querySelectorAll('[data-hook]').forEach(b => b.onclick = () => act('cp_hook', { hook: b.dataset.hook }));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editing = b.dataset.edit; S.sig = ''; project(true); });
  document.querySelectorAll('[data-canceledit]').forEach(b => b.onclick = () => { S.editing = null; S.sig = ''; project(true); });
  document.querySelectorAll('[data-saveline]').forEach(b => b.onclick = async () => { const l = b.dataset.saveline; const j = await act('cp_line_edit', { line: l, text: $('#ed-' + l).value }); if (j) S.editing = null; });
  document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => { S.sel.style = b.dataset.style; S.sig = ''; project(true); });
  document.querySelectorAll('[data-exd]').forEach(b => b.onclick = () => act('cp_exception_decision', { id: panel.slice(3), decision: b.dataset.exd, note: ($('#exnote') || {}).value || '',
    changes: Object.fromEntries(Object.keys(S.sel.chips || {}).filter(k => S.sel.chips[k]).map(c => c.split(':'))) }));
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { S.sel.chips ||= {}; S.sel.chips[b.dataset.chip] = !S.sel.chips[b.dataset.chip]; b.setAttribute('aria-pressed', S.sel.chips[b.dataset.chip]); });
  document.querySelectorAll('[data-fdis]').forEach(b => b.onclick = () => act('cp_finding', { finding: b.dataset.fdis, note: (document.querySelector(`[data-fexp="${b.dataset.fdis}"]`) || {}).value || '' }));
  document.querySelectorAll('[data-lic]').forEach(b => b.onclick = () => { const id = b.dataset.lic;
    act('cp_asset', { op: 'licence', id, licence: document.querySelector(`[data-lickind="${id}"]`).value, evidence: document.querySelector(`[data-licev="${id}"]`).value,
      declare: document.querySelector(`[data-licdec="${id}"]`).checked }); });
  const up = document.querySelector('[data-upload]');
  if (up) up.onclick = async () => { const f = $('#up-file').files[0]; if (!f) return toast(AR() ? 'اختر صورة' : 'Choose a picture', true);
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    const [slot, scene] = $('#up-slot').value.split('|');
    act('upload', { data, name: f.name, ext: f.name.split('.').pop(), slot, scene, use: document.querySelector('input[name=use]:checked').value, credit: $('#up-credit').value }); };
  const g6b = document.querySelector('[data-g6]');
  if (g6b) g6b.onclick = () => act('cp_gate', { gate: 'G6', decision: 'approved', content_hash: v.current.G6 && v.current.G6.hash, confirm_text: $('#g6c').value });
  // voice
  const mix = $('#mix');
  if (mix) {
    let stopAt = null;
    bindMedia(mix, S.mixId, tt => {
      document.querySelectorAll('.w.now').forEach(e => e.classList.remove('now'));
      const w = [...document.querySelectorAll('.w')].find(e => tt >= +e.dataset.ws && tt < +e.dataset.we); if (w) w.classList.add('now');
      v.g3.mix.segments.forEach(s => { const e = document.querySelector(`[data-h="${s.line}"]`); if (e) e.textContent = Math.min(100, Math.round(100 * heardIn(S.mixId, s.start, s.end) / (s.end - s.start))) + '%'; });
      if (stopAt != null && tt >= stopAt) { mix.pause(); stopAt = null; }
      showMissing();
    });
    document.querySelectorAll('.w').forEach(e => e.onclick = () => { S.sel.word = { line: e.dataset.line, word: e.dataset.word, s: +e.dataset.ws, e: +e.dataset.we };
      mix.currentTime = Math.max(0, +e.dataset.ws - 0.05); S.sig = ''; project(true); });
    document.querySelectorAll('[data-seekmix]').forEach(e => e.onclick = () => { mix.currentTime = Math.max(0, +e.dataset.seekmix - 0.3); stopAt = +e.dataset.seekmix + 1.2; mix.play(); });
    const pw = document.querySelector('[data-playword]');
    if (pw) pw.onclick = () => { const w = S.sel.word; const m = $('#mix'); m.currentTime = Math.max(0, w.s - 0.08); stopAt = w.e + 0.08; m.play(); };
  }
  const cw = document.querySelector('[data-closeword]'); if (cw) cw.onclick = () => { S.sel.word = null; S.sig = ''; project(true); };
  document.querySelectorAll('[data-pronrej]').forEach(b => b.onclick = () => act('cp_pron', { op: 'decide', id: b.dataset.pronrej, decision: 'rejected' }));
  const pr = document.querySelector('[data-pron]'); if (pr) pr.onclick = () => act('cp_pron', { word: S.sel.word.word, respell: $('#respell').value, lines: [S.sel.word.line] });
  const ad = document.querySelector('[data-adjust]'); if (ad) ad.onclick = () => act('cp_voice_adjust', { line: S.sel.word.line, speed: +$('#sp').value, pause_before: +$('#pb').value, pause_after: +$('#pa').value });
  // film
  const fv = $('#film');
  if (fv) {
    bindMedia(fv, S.filmId, tt => { const e = $('#fheard'); if (e) e.textContent = fmt(heardIn(S.filmId, 0, v.g5.seconds)); showMissing();
      document.querySelectorAll('#ftl button').forEach(b => b.classList.toggle('on', tt >= +b.dataset.seek && tt < (+b.dataset.seek + (+b.style.flexGrow || 0)))); });
    document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { fv.currentTime = +b.dataset.seek; fv.play(); });
    const cm = document.querySelector('[data-comment]');
    if (cm) cm.onclick = () => act('cp_comment', { film: v.g5.n, t: +fv.currentTime.toFixed(2), text: $('#cm').value });
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-go],[data-ctl],[data-retry],[data-back],[data-goto],[data-manual]');
  if (!b || !S.v || !$('#main').contains(b)) return;
  const v = S.v, d = b.dataset;
  if (d.go != null) location.hash = `#/p/${encodeURIComponent(v.id)}/${d.go}`;
  else if (d.ctl) { if (d.ctl === 'stop' && !(await ask(t('stop_q'), t('stop_b'), t('stop_ok'), 'bad'))) return; act('cp_control', { op: d.ctl }); }   // Stop always asks first
  else if (d.retry) act('cp_control', { op: 'retry', key: d.retry });
  else if (d.back) backSheet(v);
  else if (d.goto) goFix({ target: d.goto });
  else if (d.manual) { if (await ask(t('manual_q'), t('manual_b'), t('manual_ok'))) act('cp_mode', { mode: 'manual' }); }
});

// ------------------------------------------------------------------ polling
async function poll() {
  if (route().page === 'project' && S.pid) {
    try { S.v = await get('/api/copilot/' + encodeURIComponent(S.pid)); project(false); } catch (e) {}
  }
  setTimeout(poll, S.v && (S.v.task || S.v.runner_alive) ? 2000 : 6000);
}
render(true).then(() => setTimeout(poll, 2000));
</script>
