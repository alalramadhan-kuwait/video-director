<title>Video Director</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@600;800&family=Inter:wght@500;700&display=swap">
<style>
/* Layout: one review path per video (Voice → Scenes → Final → Publish). Home shows the film, the steps and one
   next button; scenes and voice checks are reviewed one at a time with the actions in a bar at the bottom.
   Dark-first like an edit suite; light follows the system. Few words: state is shown by colour + icon + one label. */
:root{
  --bg:#0f1114; --panel:#16191e; --raise:#1c2026; --sunk:#0b0d10; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
  --accent:#8fb4e3; --accent-ink:#0f1114; --accent-soft:#1d2a3a;
  --ok:#6cc79a; --ok-soft:#14301f; --wait:#e8b65a; --wait-soft:#362a10; --bad:#f08c80; --bad-soft:#3a1c19;
  --proc:#7fb2ea; --proc-soft:#17283b; --unk:#9aa1ab; --unk-soft:#22272e; --fix:#7fd3c8; --fix-soft:#11302c;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif; --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; --fix:#11756b; --fix-soft:#dcf2ef; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; --fix:#11756b; --fix-soft:#dcf2ef; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.ar{font-family:var(--f-ar)}
a{color:var(--accent)}
button,select{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:40px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{min-height:52px;font-size:1.02rem;padding:10px 18px;width:100%}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
h1{font-size:1rem;margin:0} h2{font-size:1.3rem;margin:0;text-wrap:balance} h3{font-size:.95rem;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem} .mono{font-family:var(--f-mono);font-size:.86em}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
/* chrome */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.toprow{display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto;white-space:nowrap}
.brand .mk{width:20px;height:20px;border-radius:5px;border:2px solid var(--ink);position:relative;flex:none}
.brand .mk::after{content:"";position:absolute;inset:4px 3px 4px 6px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
.proj{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.proj button{border:0;border-radius:0;min-height:34px;display:inline-flex;align-items:center;gap:6px;background:transparent;padding:4px 10px;white-space:nowrap}
.proj button+button{border-inline-start:1px solid var(--line)}
.proj i{width:9px;height:9px;border-radius:50%;display:inline-block}
.syncchip{font-size:.76rem;font-weight:600;border-radius:99px;padding:2px 9px;text-decoration:none}
.syncchip.pending{background:var(--wait-soft);color:var(--wait)} .syncchip.problem{background:var(--bad-soft);color:var(--bad)}
.shell{display:grid;grid-template-columns:184px minmax(0,1fr)}
nav.rail{border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:52px;align-self:start;min-height:calc(100vh - 52px)}
nav.rail a,nav.tabs a{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;border-radius:8px;padding:9px 10px}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{margin-inline-start:auto;background:var(--wait-soft);color:var(--wait);font-size:.7rem;font-weight:700;border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
nav.tabs{display:none}
main{padding:20px 24px 40px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1180px}
.ic{width:20px;height:20px;flex:none}
@media (max-width:760px){
  .shell{grid-template-columns:1fr} nav.rail{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.68rem;padding:8px 2px;justify-content:center;position:relative}
  nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
  nav.tabs .badge{position:absolute;top:3px;inset-inline-end:10px;margin:0}
  body.flow nav.tabs{display:none}
  main{padding:14px 16px 96px}
  body.flow main{padding-bottom:24px}
  .brand h1{display:none}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.fold{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)} details.fold[open]>summary::after{content:"－"}
details.fold>div{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;line-height:1.6;max-width:100%}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-wait{background:var(--wait-soft);color:var(--wait)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.s-unk{background:var(--unk-soft);color:var(--unk)} .s-fix{background:var(--fix-soft);color:var(--fix)} .s-proc{background:var(--proc-soft);color:var(--proc)}
.v-critical{background:var(--bad-soft);color:var(--bad)} .v-major{background:var(--wait-soft);color:var(--wait)} .v-minor{background:var(--proc-soft);color:var(--proc)} .v-info{background:var(--unk-soft);color:var(--unk)}
.b-decide{background:var(--wait-soft);color:var(--wait)} .b-fixable{background:var(--fix-soft);color:var(--fix)} .b-suggestion{background:var(--unk-soft);color:var(--unk)} .b-blocked{background:var(--bad-soft);color:var(--bad)}
.sync{font-size:.78rem;font-weight:600} .sync.recorded{color:var(--ok)} .sync.pending{color:var(--wait)} .sync.problem{color:var(--bad)}
/* video */
.player video{width:100%;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:14px;border:1px solid var(--line);display:block}
.kind{font-size:.74rem;color:var(--muted)}
/* home */
.home{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:28px;align-items:start}
.home .player video{max-height:70vh}
@media (max-width:760px){.home{grid-template-columns:1fr;gap:16px}.home .player video{max-height:38vh}}
.title h2{font-size:1.7rem} @media (max-width:760px){.title h2{font-size:1.4rem}}
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.path a{display:grid;grid-template-columns:36px minmax(0,1fr) auto 14px;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none}
ol.path .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--unk-soft);color:var(--unk)}
ol.path .lbl{font-weight:600} ol.path .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
ol.path .cnt{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted)}
ol.path .chev{color:var(--muted)}
ol.path li.done .num{background:var(--ok-soft);color:var(--ok)}
ol.path li.now a{border-color:var(--accent);background:var(--accent-soft)} ol.path li.now .num{background:var(--accent);color:var(--accent-ink)}
ol.path li.wait a{opacity:.7} ol.path li.blocked .num{background:var(--bad-soft);color:var(--bad)}
.bar10{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px} .bar10 i{display:block;height:100%;background:var(--ok)}
/* flows */
.flowhead{display:flex;align-items:center;gap:10px}
.flowhead .back{font-size:1.4rem;text-decoration:none;color:var(--ink);padding:2px 10px 2px 0}
.flowhead .t{font-weight:700;font-size:1.1rem} .flowhead .n{color:var(--muted);font-variant-numeric:tabular-nums}
.flowhead .pn{margin-inline-start:auto;display:flex;gap:6px} .flowhead .pn a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--raise)}
.flowhead .pn a[aria-disabled="true"]{opacity:.3;pointer-events:none}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots a{flex:1 1 0;min-width:10px;max-width:42px;height:8px;border-radius:99px;background:var(--unk-soft)}
.dots a.ok{background:var(--ok)} .dots a.fix{background:var(--fix)} .dots a.pend{outline:2px solid var(--wait);outline-offset:-2px}
.dots a.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.scenebox{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:22px;align-items:start}
.scenebox video,.scenebox img.still{width:100%;aspect-ratio:9/16;max-height:62vh;object-fit:contain;background:#000;border-radius:14px;border:1px solid var(--line);display:block}
@media (max-width:760px){.scenebox{grid-template-columns:1fr;gap:14px}.scenebox video,.scenebox img.still{max-height:44vh}}
.nar{font-size:1.08rem;line-height:1.7}
.verdict{font-weight:600;font-size:.9rem}
.issue{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:start}
.issue>button.itxt{background:transparent;border:0;text-align:start;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-height:0;border-radius:12px}
.issue .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.issue.open .txt{-webkit-line-clamp:unset}
.issue>button.fixbtn{margin:8px 8px 0 0;min-height:36px;padding:4px 12px;font-size:.84rem}
.issue .more{grid-column:1/-1;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:2px}
.sd.critical{background:var(--bad)} .sd.major{background:var(--wait)} .sd.minor{background:var(--proc)} .sd.info{background:var(--unk)}
.actionbar{position:sticky;bottom:0;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;margin-top:4px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar button{flex:1 1 0;min-height:52px;font-size:1rem}
.actionbar button.skip{flex:0 0 auto;background:transparent;border-color:transparent;color:var(--muted)}
@media (max-width:760px){.actionbar{border-radius:16px 16px 0 0;margin-inline:-16px;border-inline:0;border-bottom:0}}
.word{font-size:2rem;font-weight:700;line-height:1.3;text-align:center}
.playbig{width:112px;height:112px;border-radius:50%;font-size:1rem;font-weight:600;margin-inline:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--accent);color:var(--accent-ink);border:0}
.playbig b{font-size:1.8rem;line-height:1}
.gate{font-size:.86rem;text-align:center;min-height:1.4em}
.yes{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600} .warn{color:var(--wait)}
.check audio{width:100%;height:40px}
/* scenes */
.scenes{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start}
.scenes .player{position:sticky;top:64px} .scenes .player video{max-height:66vh}
@media (max-width:900px){.scenes{grid-template-columns:1fr}.scenes .player{position:static}.scenes .player video{max-height:38vh}}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow.now{border-color:var(--accent)}
.srow .thumb{padding:0;border:0;border-radius:0;position:relative;min-height:0;display:block;background:var(--sunk)}
.srow .thumb img{width:62px;height:100%;min-height:96px;object-fit:cover;display:block}
.srow .thumb span{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.7);color:#fff;font:600 .7rem var(--f-mono);text-align:center;padding:2px 0}
.srow .body{padding:8px 10px;display:flex;flex-direction:column;gap:4px;color:var(--ink);text-decoration:none;min-width:0}
.srow .nar1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.88rem;line-height:1.55}
/* art */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px} .chips button{flex:none;min-height:36px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden} .seg button{border:0;border-radius:0} .seg button+button{border-inline-start:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
@media (max-width:760px){.cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.cards>.card{flex:0 0 82%;scroll-snap-align:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.rec{border-color:var(--accent)} .card.locked{border-color:var(--ok)}
.card .pv{aspect-ratio:9/16;max-height:420px;width:100%;border-radius:10px;overflow:hidden;background:var(--sunk);position:relative;display:flex;align-items:center;justify-content:center}
.card .pv.wide{aspect-ratio:auto;max-height:none}
.card .pv img{width:100%;height:100%;object-fit:cover;cursor:zoom-in} .card .pv.wide img{object-fit:contain;height:auto}
.card .pv .lab{position:absolute;inset-inline:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;padding:5px 8px}
.card .pv .none{padding:18px;text-align:center;color:var(--muted);font-size:.86rem}
.card .pv.nopv{aspect-ratio:auto;min-height:72px;border:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.84rem;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* tasks */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.summary button{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px;border-radius:12px;background:var(--panel);text-align:start}
.summary b{font-size:1.4rem;font-variant-numeric:tabular-nums}
@media (max-width:760px){.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.summary button{padding:6px 10px;min-height:0}.summary b{font-size:1.15rem}.summary .small{font-size:.74rem}}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--unk)}
.task.needs_decision{border-inline-start-color:var(--wait)} .task.fixable{border-inline-start-color:var(--fix)} .task.blocked{border-inline-start-color:var(--bad)} .task.done{border-inline-start-color:var(--ok);opacity:.85}
.task .title{font-weight:600}
.fline{display:flex;gap:8px;align-items:baseline;font-size:.86rem} .fline span:last-child{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* style */
.board{display:flex;flex-direction:column;gap:16px}
.board .head{border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px}
.board .head img{width:56px;height:56px;border-radius:10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.swatch{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.72rem}
.swatch i{display:block;height:44px} .swatch span{display:block;padding:4px 6px} .swatch code{font-family:var(--f-mono)}
.type{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gallery img,.gallery video{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#000}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden} .meter i{display:block;height:100%;background:var(--accent)}
.okrow{display:flex;gap:8px;align-items:flex-start;font-size:.88rem} .okrow b{width:18px;text-align:center;flex:none}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:520px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top} tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:.76rem} td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.feed .ev{display:grid;grid-template-columns:130px 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.feed .ev:last-child{border-bottom:0} .feed time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.76rem}
@media (max-width:520px){.feed .ev{grid-template-columns:1fr}}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.lightbox img,.lightbox video{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox .compare{display:flex;gap:10px;max-width:100%;overflow-x:auto}
.lightbox .compare figure{margin:0;flex:0 0 auto;max-width:min(calc(70vh * 0.5625),80vw);color:#ddd;font-size:.8rem}
.lightbox .compare img{max-height:70vh}
.lightbox button{background:#fff;color:#111;border-color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:60;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;max-width:90vw}
@media (min-width:761px){.toast{bottom:20px}}
.answers{display:flex;flex-direction:column;gap:8px} .answers button{min-height:50px;font-size:1rem;text-align:center}
.answers.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;min-height:0;padding:4px}
a.linkrow{flex-direction:row;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink)}
.vline .words{display:flex;flex-wrap:wrap;gap:6px;margin:0;font-size:1.25rem;line-height:1.8}
.wd{min-height:40px;padding:2px 10px;border-radius:10px;font-family:var(--f-ar);font-size:1.15rem;background:var(--raise)}
.wd.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wd.flg{border-color:var(--bad);color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.lplay{width:44px;height:44px;border-radius:50%;padding:0;background:var(--accent);color:var(--accent-ink);border:0;font-size:1.1rem}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(5,6,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto}
body.busy button{pointer-events:none;opacity:.6}
.empty{color:var(--muted);font-size:.9rem;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="toprow">
    <div class="brand"><span class="mk" aria-hidden="true"></span><h1>Video Director</h1></div>
    <a id="syncchip" class="syncchip" hidden></a>
    <div class="proj" role="group" aria-label="Project" id="proj"></div>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="lightbox" id="lb" hidden role="dialog" aria-label="Full-screen view"><div id="lbBody"></div><button type="button" id="lbClose">Close</button></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
let DATA = __DATA__;
const MODE = '__MODE__';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P_KEYS = {tk:'timekeeper', dh:'diabetes-history'}, P_SHORT = {'timekeeper':'tk','diabetes-history':'dh'};
const SHORT_NAME = {'diabetes-history':'Diabetes', 'timekeeper':'Time Keeper'};
const DEC_LABEL = {approved:'Approved', rejected:'Rejected', changes_requested:'Fixes requested', selected:'Chosen', concept_selected:'Concept selected', accepted:'Fix', dismissed:'Dismissed', needs_source:'Needs a source', article_heard:'Arabic with «الـ»', article_missing:'Arabic without «الـ»', heard_english:'English', heard_other:'Something else', unsure:'Not sure', playback_failed:'Audio would not play', flagged:'Flagged'};
const LISTEN = ['article_heard','article_missing','heard_english','heard_other','unsure'];
const TAG = {decide:'Your call', fixable:'Claude fixes', suggestion:'Idea', blocked:'Needs source'};
const DIM = {'Historical and technical accuracy':'Facts', 'Correct watches, products and people':'Right people & objects', 'Does the image match the narration?':'Matches narration',
  'Composition and visual hierarchy':'Layout', 'Readability of Arabic text':'Arabic text', 'Lighting, colours and character proportions':'Colour & proportions',
  'Consistency with the approved project style':'Style', 'Motion and storytelling quality':'Motion'};
const ICON = {
  review:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg>',
  scenes:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="7" width="5" height="10" rx="1"/><rect x="9.5" y="7" width="5" height="10" rx="1"/><rect x="16.5" y="7" width="5" height="10" rx="1"/></svg>',
  art:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg>',
  style:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="9" r="4"/><circle cx="16" cy="15" r="4"/></svg>',
  more:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'};
const SECTIONS = [['review','Review'],['scenes','Scenes'],['art','Art'],['style','Style'],['more','More']];
const ALIAS = {watch:'review', timeline:'scenes', reviews:'tasks', identity:'style', costs:'more'};
const FLOWS = ['scene','voice','final','lines'];

// ------------------------------------------------------------------ decisions: recorded (event log) + page (waiting for sync)
const REC = {}, PAGE = {}, RECEIPT = {}, PLAY = {};
let db = null;
function seed(){
  for(const k in REC) delete REC[k];
  const put = (id,d) => { if(id && d) REC[id] = d; };
  DATA.review_tasks.forEach(t => { put(t.id, t.decision); (t.checks||[]).forEach(c => put(c.id, c.decision)); });
  DATA.inbox_checks.forEach(c => put('verdict-'+c.id, c.verdict));
  Object.values(DATA.flags||{}).forEach(fl => fl.forEach(f => put(f.item, f.decision)));
  Object.values(DATA.projects).forEach(p => p.videos.forEach(v => v.scenes.forEach(s => {
    (s.findings||[]).forEach(f => put(f.id, f.decision)); (s.versions||[]).forEach(x => put(x.id, x.decision));
    ((s.concepts||{}).options||[]).forEach(o => put(o.id, o.decision)); })));
}
function latestPage(item){ return Object.values(PAGE).filter(d => d.item===item).sort((a,b)=>a.at<b.at?-1:1).pop(); }
function state(item){
  // the recorded decision, unless a newer page decision is still waiting for the local app
  const pg = latestPage(item), rc = REC[item];
  if(pg){ const r = RECEIPT[pg.decision_id];
    if(!r) return {decision:pg.decision, sync:'pending', text:'Waiting to sync'};
    if(r.status==='recorded'||r.status==='duplicate') return {decision:pg.decision, sync:'recorded', text:'Saved'+(r.event?' · #'+r.event:''), locked:pg.decision==='approved'};
    if(!rc) return {decision:null, sync:'problem', text:'Not saved: '+r.reason};
    return {...rc, sync:'problem', text:'Not saved: '+r.reason, locked:rc.decision==='approved'};
  }
  if(rc) return {...rc, sync:'recorded', text:'Saved'+(rc.event?' · #'+rc.event:''), locked:rc.decision==='approved'};
  return null;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>e.hidden=true, 2800); }
let BUSY = false;
async function save(item, decision, note=''){
  // one decision; returns true when it was saved (local: recorded; page: stored and waiting to sync)
  if(BUSY) return false;                                   // a second tap while saving is ignored
  BUSY = true; document.body.classList.add('busy');
  try{ return await save1(item, decision, note); } finally { BUSY = false; document.body.classList.remove('busy'); }
}
async function save1(item, decision, note){
  const cur = state(item);
  if(cur && cur.locked && decision!=='changes_requested'){ toast('Approved and locked. Use “Fix” to reopen.'); return false; }
  const row = {decision_id:uid(), item, decision, note, at:new Date().toISOString()};
  if(LISTEN.includes(decision)){
    const ev = PLAY[item];
    if(!ev || !ev.ok){ toast('Play the word first.'); return false; }
    row.playback = ev.record;
  }
  try{
    if(MODE==='local'){
      const r = await fetch('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(row)});
      const j = await r.json();
      if(j.status!=='recorded' && j.status!=='duplicate'){ toast('Not saved: '+j.reason); return false; }
      return true;
    }
    PAGE[row.decision_id] = row;
    if(db) await db.doc('decisions/'+row.decision_id).set(row);
    else { try{ localStorage.setItem('vd-page-decisions', JSON.stringify(PAGE)); }catch(e){} }
    return true;
  }catch(e){ toast('Not saved. Try again.'); return false; }
}
async function refresh(){ if(MODE!=='local') return; const f = await fetch('/api/snapshot'); if(f.ok){ DATA = await f.json(); seed(); } }
async function decide(item, decision, note=''){ if(await save(item, decision, note)){ await refresh(); toast(MODE==='local'?'Saved':'Saved · waiting to sync'); } render(); }
function decBlock(item, choices, opts={}){
  const st = state(item);
  const btns = choices.map(([v,l]) => `<button type="button" data-dec="${v}" data-item="${esc(item)}" ${(st&&st.locked&&v!=='changes_requested')||opts.disabled?'disabled':''} aria-pressed="${!!st&&st.decision===v}">${esc(l)}</button>`).join('');
  return `<div class="acts">${btns}${st?`<span class="sync ${st.sync}">${st.locked?'🔒 ':''}${esc(DEC_LABEL[st.decision]||'')}${st.decision?' · ':''}${esc(st.text)}</span>`:''}</div>`;
}

// ------------------------------------------------------------------ routing
let proj='diabetes-history', view='review', arg=null;
function parse(){ const h = location.hash.slice(1).split('~'); if(P_KEYS[h[0]]){ proj=P_KEYS[h[0]]; view=ALIAS[h[1]]||h[1]||'review'; arg=h[2]||null; } }
const link = (v,a) => '#'+[P_SHORT[proj], v, a].filter(x=>x!=null&&x!=='').join('~');
addEventListener('hashchange', () => { parse(); render(); scrollTo(0,0); });
const V = () => DATA.projects[proj].videos[0];
const T = id => DATA.review_tasks.find(t => t.id===id);

// ------------------------------------------------------------------ helpers
const fmtT = s => { s=Math.max(0,+s||0); const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); };
const fmtAt = a => a ? a.replace('T',' ').replace(/(:\d\d)?(\.\d+)?Z$/,' UTC') : '—';
const dur = s => s==null ? '—' : s < 60 ? s.toFixed(1)+' s' : (s/60).toFixed(1)+' min';
const pill = (cls,t,dot) => `<span class="pill ${cls}${dot?' dot':''}">${esc(t)}</span>`;
const sources = base => base ? `<source src="${esc(base)}.mp4" type="video/mp4"><source src="${esc(base)}.webm" type="video/webm">` : '';
const videoTag = (base, attrs='') => `<video ${attrs} playsinline preload="metadata">${sources(base)}</video>`;
const previewTag = (pv, id) => `<video id="${id}" controls playsinline preload="metadata" poster="${esc(pv.poster)}"><source src="${esc(pv.mp4)}" type="video/mp4"><source src="${esc(pv.webm)}" type="video/webm"></video>`;
const kindChip = pv => pv.kind==='animatic' ? pill('s-wait','Animatic · not the film') : pill('s-unk','Published film');
const first = t => { const m = String(t||'').match(/^.*?[.!?؟](\s|$)/); const s = (m?m[0]:String(t||'')).trim(); return s.length>150 ? s.slice(0,147)+'…' : s; };
function sceneVerdict(s){ return proj==='diabetes-history' ? state('art-ep7-'+s.id) : null; }
function sceneMark(s){ const v = sceneVerdict(s); if(!v||!v.decision) return {k:'todo'};
  return {k: v.decision==='approved'?'ok':v.decision==='changes_requested'?'fix':'todo', pend: v.sync==='pending'}; }
const answered = c => { const st = state(c.id); return !!st && LISTEN.includes(st.decision); };
const verdictOf = c => { const st = state('verdict-'+c.id); return st && st.decision ? st : null; };
const checkDone = c => answered(c) && !!verdictOf(c);
const SHORT = () => P_SHORT[proj];
const flagState = (lid, i) => { const st = state(`flag-${SHORT()}-${lid}-${i}`); return st && st.decision==='flagged' ? st : null; };
const flagCount = () => (DATA.voice_lines[proj]||[]).reduce((n,l)=>n+l.words.filter((w,i)=>flagState(l.id,i)).length, 0);
const sceneStart = id => { const s = V().scenes.find(x=>x.id===id); return s ? s.start : 0; };

// the review path for the current video: what is done, what is next, what waits
function path(){
  const v = V(), st = k => (v.stages.find(s=>s.stage===k)||{});
  const out = [];
  if(proj==='diabetes-history'){
    const marks = v.scenes.map(sceneMark), done = marks.filter(m=>m.k!=='todo').length, fixes = marks.filter(m=>m.k==='fix').length;
    const nextScene = v.scenes.find((s,i)=>marks[i].k==='todo');
    const fin = state('final-ep7');
    out.push({key:'voice', label:'Voice', sub:'Approved · tap to hear every line', cnt:'30/30', state: st('voice').status==='approved'?'done':'now', href:link('lines')});
    out.push({key:'scenes', label:'Scenes', sub: fixes? fixes+' waiting for fixes':'Look at each scene', cnt:`${done}/${v.scenes.length}`, pct: done/v.scenes.length,
      state: done===v.scenes.length?'done':'now', href: link('scene', (nextScene||v.scenes[0]).id), go: nextScene && {label:`Review scene ${nextScene.id}`, href:link('scene', nextScene.id)}});
    const finalReady = done===v.scenes.length && !fixes;
    out.push({key:'final', label:'Final video', sub: fin&&fin.decision==='approved'?'Approved':finalReady?'Watch and approve':fixes?'After the fixes':'After the scenes', cnt:'',
      state: fin&&fin.decision==='approved'?'done':finalReady?'now':'wait', href:link('final'), go: finalReady && !(fin&&fin.decision==='approved') && {label:'Approve the final video', href:link('final')}});
    out.push({key:'publish', label:'Publish', sub:'Licence check (Fasih)', cnt:'', state:'blocked', href:link('more','blockers')});
  } else {
    const cs = DATA.inbox_checks, done = cs.filter(checkDone).length, nx = cs.findIndex(c=>!checkDone(c));
    out.push({key:'voice', label:'Voice', sub:'Listen to 8 lines', cnt:`${done}/${cs.length}`, pct: done/cs.length, state: done===cs.length?'done':'now',
      href: link('voice', Math.max(0,nx)), go: nx>=0 && {label:`Listen: check ${nx+1} of ${cs.length}`, href:link('voice', nx)}});
    out.push({key:'scenes', label:'Scenes', sub:'No artwork yet', cnt:'', state:'wait', href:link('scenes')});
    out.push({key:'final', label:'Final video', sub:'No film yet', cnt:'', state:'wait', href:link('scenes')});
    out.push({key:'publish', label:'Publish', sub:'Not started', cnt:'', state:'wait', href:link('more')});
  }
  return out;
}
const otherTasks = () => DATA.review_tasks.filter(t => t.project===proj && (t.type==='direction'||t.type==='engineering') && t.status!=='done' && !state(t.id));

// ------------------------------------------------------------------ chrome
function chrome(){
  $('proj').innerHTML = Object.entries(DATA.projects).map(([k,p]) => { const pal = DATA.identity[k].board.palette;
    return `<button type="button" data-proj="${k}" aria-pressed="${k===proj}"><i style="background:${esc(pal[0].hex)}"></i>${esc(SHORT_NAME[k]||p.name)}</button>`; }).join('');
  const pend = Object.values(PAGE).filter(d=>!RECEIPT[d.decision_id]).length;
  const prob = Object.values(PAGE).filter(d=>RECEIPT[d.decision_id]&&!['recorded','duplicate'].includes(RECEIPT[d.decision_id].status)).length;
  const sc = $('syncchip'); sc.hidden = !(pend||prob); sc.className = 'syncchip '+(prob?'problem':'pending');
  sc.textContent = prob ? `⚠ ${prob} not saved` : `⏳ ${pend} to sync`; sc.href = link('tasks');
  const p = path(), n = p.filter(s=>s.state==='now').length;
  const cur = FLOWS.includes(view) ? 'review' : view==='tasks' ? 'more' : view;
  const nav = SECTIONS.map(([k,l]) => `<a href="${link(k)}" ${cur===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></a>`).join('');
  $('rail').innerHTML = nav; $('tabs').innerHTML = nav;
  document.body.classList.toggle('flow', FLOWS.includes(view));
}

// ------------------------------------------------------------------ REVIEW (home)
function review(){
  const v = V(), p = path(), nx = p.find(s=>s.go), others = otherTasks();
  return `<section class="home">
    <div class="player">${previewTag(v.preview,'pv')}</div>
    <div class="stack" style="gap:16px">
      <div class="title stack" style="gap:2px"><h2 class="ar" dir="auto">${esc(v.title)}</h2><p class="muted row" style="gap:8px">${esc(v.episode)} · ${fmtT(v.duration)} ${kindChip(v.preview)}</p></div>
      ${nx?`<button type="button" class="primary big" data-href="${nx.go.href}" id="nextBtn">${esc(nx.go.label)} ›</button>`:'<p class="empty">Nothing waiting for you.</p>'}
      <ol class="path">${p.map((s,i)=>`<li class="${s.state}" data-step="${s.key}"><a href="${s.href}">
        <span class="num">${s.state==='done'?'✓':s.state==='blocked'?'!':s.state==='wait'?'🔒':i+1}</span>
        <span><span class="lbl">${esc(s.label)}</span><span class="sub">${esc(s.sub)}</span>${s.pct!=null&&s.state!=='done'?`<span class="bar10"><i style="width:${100*s.pct}%"></i></span>`:''}</span>
        <span class="cnt">${esc(s.cnt)}</span><span class="chev">›</span></a></li>`).join('')}</ol>
      <a class="panel linkrow" href="${link('lines')}" id="linesLink"><span>🎧 <b>Hear every line</b><br><span class="small muted">Tap any word that sounds wrong</span></span><span class="row">${flagCount()?`<span class="badge">🚩 ${flagCount()}</span>`:''}›</span></a>
      ${others.length?`<a class="small" href="${link('tasks')}">${others.length} other decision${others.length>1?'s':''} ›</a>`:''}
    </div></section>`;
}

// ------------------------------------------------------------------ SCENE (one at a time)
const FIX = {};   // scene id -> Set of finding ids marked "Fix"
const OPEN = new Set();
function fixSet(s){ if(!FIX[s.id]) FIX[s.id] = new Set(s.findings.filter(f => !f.decision && (f.bucket!=='suggestion' || ['critical','major'].includes(f.severity))).map(f=>f.id)); return FIX[s.id]; }
function flowHead(back, title, i, n, prev, next){
  return `<div class="flowhead"><a class="back" href="${back}" aria-label="Back">‹</a><span class="t">${title}</span>${n?`<span class="n">${i+1} / ${n}</span>`:''}
    ${n?`<span class="pn"><a href="${prev||'#'}" aria-label="Previous" aria-disabled="${!prev}">‹</a><a href="${next||'#'}" aria-label="Next" aria-disabled="${!next}">›</a></span>`:''}</div>`;
}
function scene(){
  const v = V(); if(proj!=='diabetes-history') return scenes();
  const s = v.scenes.find(x=>x.id===arg) || v.scenes[0], i = v.scenes.indexOf(s), fx = fixSet(s), st = sceneVerdict(s);
  const main = s.findings.filter(f => ['critical','major'].includes(f.severity) || f.bucket!=='suggestion'), rest = s.findings.filter(f => !main.includes(f));
  const issue = f => `<div class="issue ${OPEN.has(f.id)?'open':''}" data-f="${esc(f.id)}">
      <button type="button" class="itxt" data-open="${esc(f.id)}" aria-expanded="${OPEN.has(f.id)}"><span class="row" style="gap:6px"><i class="sd ${f.severity}"></i>${pill('b-'+f.bucket, TAG[f.bucket])}<span class="tiny muted">${esc(DIM[f.dimension]||f.dimension)}</span></span>
        <span class="txt">${esc(OPEN.has(f.id)?f.problem:first(f.problem))}</span></button>
      <button type="button" class="fixbtn" data-fix="${esc(f.id)}" aria-pressed="${fx.has(f.id)}" ${st&&st.locked?'disabled':''}>${fx.has(f.id)?'✓ Fix':'Fix'}</button>
      ${OPEN.has(f.id)?`<div class="more">${f.suggestion?`<p><b>Suggested</b> · <span class="ar" dir="auto">${esc(f.suggestion)}</span></p>`:''}${(f.notes||[]).map(n=>`<p class="warn small">${esc(n)}</p>`).join('')}
        <p class="tiny muted">${esc(f.severity)} · ${esc(f.timecode)} · AI reviewer · ${[...f.frames, ...f.evidence.map(e=>e.kind+' '+e.ref)].map(esc).join(', ')||'—'}</p></div>`:''}
    </div>`;
  const verdict = st&&st.decision ? `<p class="verdict ${st.decision==='approved'?'yes':'warn'}">${st.decision==='approved'?'✓ Approved':'✎ Fixes requested'} <span class="sync ${st.sync}">· ${esc(st.text)}</span></p>` : '';
  const n = fx.size;
  return `${flowHead(link('review'), 'Scene '+esc(s.id), i, v.scenes.length, v.scenes[i-1]&&link('scene',v.scenes[i-1].id), v.scenes[i+1]&&link('scene',v.scenes[i+1].id))}
    <div class="dots" aria-label="Scenes">${v.scenes.map(x=>{ const m = sceneMark(x); return `<a href="${link('scene',x.id)}" class="${m.k} ${m.pend?'pend':''} ${x.id===s.id?'cur':''}" title="${esc(x.id)}" aria-label="${esc(x.id)}"></a>`; }).join('')}</div>
    <div class="scenebox">
      <div class="stack" style="gap:6px">${videoTag(s.clip,`id="sv" controls loop autoplay muted poster="${esc(s.thumb)}"`)}
        <div class="row between tiny muted"><span>${fmtT(s.start)}–${fmtT(s.end)}</span><span class="row"><a href="${link('lines', s.id)}">🎧 Lines</a><a href="${link('art', s.id)}">Other looks ›</a></span></div></div>
      <div class="stack" style="gap:14px">
        <p class="nar ar" dir="auto">${esc(s.narration||'')}</p>
        ${verdict}
        <div class="stack" style="gap:8px"><h3>${s.findings.length} ${s.findings.length===1?'note':'notes'} from the reviewer</h3>
          ${main.map(issue).join('')}
          ${rest.length?`<details class="fold"><summary>${rest.length} small idea${rest.length>1?'s':''}</summary><div>${rest.map(issue).join('')}</div></details>`:''}</div>
      </div></div>
    <div class="actionbar">
      ${st&&st.locked ? `<button type="button" data-scenefix="${esc(s.id)}">✎ Reopen for fixes</button>`
        : `<button type="button" class="primary" data-sceneok="${esc(s.id)}" id="okBtn">✓ Approve</button><button type="button" data-scenefix="${esc(s.id)}" id="fixBtn" ${n?'':'disabled'}>✎ Fix ${n}</button>`}
      <button type="button" class="skip" data-href="${v.scenes[i+1]?link('scene',v.scenes[i+1].id):link('review')}">Skip ›</button></div>`;
}
function nextAfterScene(id){
  const v = V(), i = v.scenes.findIndex(x=>x.id===id);
  const order = [...v.scenes.slice(i+1), ...v.scenes.slice(0,i)];
  const nx = order.find(x => sceneMark(x).k==='todo');
  return nx ? link('scene', nx.id) : link('final');
}
async function sceneOk(id){
  if(await save('art-ep7-'+id, 'approved')){ await refresh(); toast(MODE==='local'?'Scene approved':'Approved · waiting to sync'); location.hash = nextAfterScene(id); render(); }
}
async function sceneFix(id){
  const s = V().scenes.find(x=>x.id===id), fx = [...fixSet(s)];
  if(!fx.length){ toast('Mark at least one note “Fix”.'); return; }
  for(const f of fx){ const cur = state(f); if(!cur || cur.decision!=='accepted') if(!await save(f, 'accepted')) return; }
  if(await save('art-ep7-'+id, 'changes_requested', 'fix: '+fx.join(', '))){ await refresh(); toast(`${fx.length} fix${fx.length>1?'es':''} requested`); location.hash = nextAfterScene(id); render(); }
}

// ------------------------------------------------------------------ VOICE (one check at a time)
let OTHER = null;            // check id whose "something else" box is open
const REASK = new Set();     // checks the owner wants to answer again
function voice(){
  const cs = DATA.inbox_checks; if(proj!=='timekeeper' || !cs.length) return more();
  const i = Math.min(Math.max(0, +arg||0), cs.length-1), c = cs[i], ev = PLAY[c.id], st = state(c.id), vd = verdictOf(c);

        <button type="button" data-verdict="keep" data-item="${esc(c.id)}" class="${vd?'':'primary'}" aria-pressed="${!!vd&&vd.decision==='approved'}">✓ Keep</button>
        <button type="button" data-verdict="fix" data-item="${esc(c.id)}" aria-pressed="${!!vd&&vd.decision==='changes_requested'}">✎ Fix it</button></div>` : ''}`;
}
function bindAudio(){
  document.querySelectorAll('audio[data-audio]').forEach(a => {
    const id = a.dataset.audio, c = DATA.inbox_checks.find(x=>x.id===id);
    const upd = () => {
      const ranges = []; for(let i=0;i<a.played.length;i++) ranges.push([+a.played.start(i).toFixed(3), +a.played.end(i).toFixed(3)]);
      const s = Math.max(0, c.word_s - 0.15), e = c.word_e; let cov = 0;
      ranges.forEach(([x,y]) => { const lo=Math.max(x,s), hi=Math.min(y,e); if(hi>lo) cov+=hi-lo; });
      const pct = cov/(e-s), durOk = isFinite(a.duration) && Math.abs(a.duration - c.duration) <= 0.25, ok = durOk && pct >= 0.8;
      const was = PLAY[id] && PLAY[id].ok;
      PLAY[id] = {ok, error:null, text: ok?`played ${Math.round(pct*100)} %`:'', record:{src:a.currentSrc, duration:+a.duration.toFixed(3), played:ranges, error:null}};
      if(ok && !was){ const g = document.querySelector(`.gate[data-gate="${CSS.escape(id)}"]`); if(g) g.innerHTML = '<span class="yes">✓ Played</span>';
        document.querySelectorAll(`button[data-item="${CSS.escape(id)}"]`).forEach(b=>{ if(LISTEN.includes(b.dataset.dec) && !(state(id)||{}).locked) b.disabled=false; }); }
    };
    a.addEventListener('timeupdate', upd); a.addEventListener('pause', upd); a.addEventListener('ended', upd);
    a.addEventListener('error', () => { PLAY[id] = {ok:false, error:(a.error&&a.error.message)||'media error '+(a.error&&a.error.code), record:{src:a.currentSrc||a.src, error:'load failed'}}; render(); });
  });
}
function playWord(id){
  const a = document.querySelector(`audio[data-audio="${CSS.escape(id)}"]`), c = DATA.inbox_checks.find(x=>x.id===id); if(!a) return;
  const start = Math.max(0, c.word_s - 0.6), stop = c.word_e + 0.4;
  const go = () => { a.currentTime = start; a.play().catch(err => { PLAY[id] = {ok:false, error:err.message, record:{src:a.currentSrc, error:err.message}}; render(); });
    const h = () => { if(a.currentTime >= stop){ a.pause(); a.removeEventListener('timeupdate', h); } }; a.addEventListener('timeupdate', h); };
  if(a.readyState>=1) go(); else { a.addEventListener('loadedmetadata', go, {once:true}); a.load(); }
}
async function answer(id, d){
  const note = d==='heard_other' && $('otherNote') ? $('otherNote').value.trim() : '';

async function verdict(id, v){

let rvFilter = 'open';
function tasks(){
  const TT = DATA.review_tasks;
  const live = t => { const st = state(t.id); return st && st.decision && t.status!=='done' ? 'done' : t.status; };   // decisions made on this page count at once
  const counts = s => TT.filter(t => s==='open' ? live(t)!=='done' : live(t)===s).length;
  const shown = TT.filter(t => rvFilter==='open' ? live(t)!=='done' : live(t)===rvFilter)
    .sort((a,b)=> (a.project===proj?0:1)-(b.project===proj?0:1) || ['needs_decision','fixable','blocked','suggestion','done'].indexOf(live(a))-['needs_decision','fixable','blocked','suggestion','done'].indexOf(live(b)));
  const probs = Object.values(PAGE).filter(d=>RECEIPT[d.decision_id]&&!['recorded','duplicate'].includes(RECEIPT[d.decision_id].status));
  return `${flowHead(link('more'), 'All tasks')}
    ${probs.length?`<div class="panel" style="border-color:var(--bad)"><b class="no">${probs.length} not saved</b>${probs.map(d=>{const r=RECEIPT[d.decision_id];return `<p class="small"><span class="sync problem">${esc(r.status)}</span> <span class="mono">${esc(d.item)}</span> · ${esc(DEC_LABEL[d.decision]||d.decision)} · ${esc(r.reason)}</p>`;}).join('')}</div>`:''}
    <div class="summary">${[['needs_decision','Your call'],['fixable','Claude fixes'],['blocked','Needs source'],['suggestion','Ideas'],['done','Done'],['open','All open']].map(([k,l])=>`<button type="button" data-rv="${k}" aria-pressed="${rvFilter===k}"><b>${counts(k)}</b><span class="small">${l}</span></button>`).join('')}</div>
    <div class="stack" style="gap:10px">${shown.map(t=>taskCard(t, live(t))).join('') || '<div class="empty">Nothing here.</div>'}</div>`;
}
function taskCard(t, status){
  let body = '', act = '';
  if(t.type==='art'){
    body = `<div class="row">${Object.entries(t.buckets).map(([b,n])=>pill('b-'+b, n+' '+TAG[b])).join('')}</div>`;
    act = `<button type="button" class="primary" data-goproj="${P_SHORT[t.project]}~scene~${esc(t.scene)}">Review scene ›</button>`;
  } else if(t.checks){
    const i = DATA.inbox_checks.findIndex(c=>c.line===t.checks[0].line);
    act = `<button type="button" class="primary" data-goproj="tk~voice~${i}">Listen ›</button>`;
  } else if(t.flags){
    body = `<div class="stack" style="gap:4px">${t.flags.map(f=>`<p class="fline"><span>🚩</span><span><b dir="auto">${esc(f.word)}</b> · ${esc(f.type_label)}${f.note?' · '+esc(f.note):''} <span class="tiny muted">${esc(f.line)}</span></span></p>`).join('')}</div>`;
    act = `<button type="button" class="primary" data-goproj="${P_SHORT[t.project]}~lines">Open lines ›</button>`;
  } else if(t.type==='final'){
    act = `<button type="button" data-goproj="dh~final">Open ›</button>`;
  } else if(t.status!=='blocked'){
    act = decBlock(t.id, t.type==='direction' ? [['selected','Choose now'],['changes_requested','None fit yet']] : [['approved','Allow'],['rejected','No']]);
  }
  const lbl = {needs_decision:['s-wait','Your call'], fixable:['s-fix','Claude fixes'], blocked:['s-bad','Blocked'], suggestion:['s-unk','Idea'], done:['s-ok','Done']}[status] || ['s-unk',status];
  return `<article class="task ${status}" id="task-${esc(t.id)}"><div class="row">${pill(lbl[0], lbl[1], true)}<span class="tiny muted">${esc(SHORT_NAME[t.project])}</span></div>
    <p class="title ar" dir="auto">${esc(t.title)}</p>${t.blocked_by?`<p class="small no">${esc(t.blocked_by)}</p>`:''}${body}${act?`<div class="acts">${act}</div>`:''}</article>`;
}

// ------------------------------------------------------------------ STYLE (one board per project, from approved files)
function style(){
  const x = DATA.identity[proj], b = x.board, pal = x.palette||{}, other = proj==='timekeeper'?'diabetes-history':'timekeeper';
  const sep = DATA.identity.separation, ok = sep.every(c=>c.ok);
  const sw = list => `<div class="swatches">${list.map(c=>`<div class="swatch" title="${esc(c.source||'')}"><i style="background:${esc(c.hex)}"></i><span><code>${esc(c.hex)}</code><br>${esc(c.name)}</span></div>`).join('')}</div>`;
  const gal = list => `<div class="gallery">${list.join('')}</div>`;
  return `<div class="row between"><h2>Style</h2>${pill(ok?'s-ok':'s-bad', ok?`✓ Kept apart from ${SHORT_NAME[other]}`:'Shared signature found', true)}</div>
    <section class="board">
      <div class="head" style="background:${esc(pal.bg||pal.paper||'#eee')};color:${esc(pal.ink||'#111')}">${b.logo?`<img src="${esc(b.logo)}" alt="Logo">`:''}<div><b style="font-size:1.25rem">${esc(DATA.projects[proj].name)}</b><br><span class="mono" style="font-size:.76rem;opacity:.85">${esc(x.profile)} · ${esc(x.status)}</span></div></div>
      <div class="stack"><h3>Colours</h3>${sw(b.palette)}${b.palette_film?`<p class="tiny muted">Royal Oak film colours</p>${sw(b.palette_film)}`:''}</div>
      <div class="stack"><h3>Type</h3>${b.type.map(t=>`<div class="type"><span class="tiny muted">${esc(t.role)} · ${esc(t.font||'unassigned')}</span>${t.sample?`<span dir="auto" style="font-family:'${esc(t.font)}',sans-serif;font-weight:${t.weight};font-size:${t.role==='Display'?'1.8rem':t.role==='Numbers'?'1.4rem':'1.05rem'}">${esc(t.sample)}</span>`:`<span class="small warn">Font file not here · no sample</span>`}</div>`).join('')}</div>
      <div class="stack"><h3>Characters & images</h3>${gal(b.characters.map(c=>`<img src="${esc(c.img)}" alt="${esc(c.caption)}" title="${esc(c.caption)}" data-full="${esc(c.img)}">`))}</div>
      <div class="stack"><h3>Layout</h3>${gal(b.composition.map(c=>`<img src="${esc(c.img)}" alt="${esc(c.caption)}" title="${esc(c.caption)}" data-full="${esc(c.img)}">`))}</div>
      <div class="stack"><h3>Motion</h3>${gal(b.motion.clips.map(c=>videoTag(c,'muted loop autoplay')))}</div>
      <div class="stack"><h3>End card</h3>${gal([`<img src="${esc(b.endcard.img)}" alt="End card" data-full="${esc(b.endcard.img)}">`, videoTag(b.endcard.clip,'muted loop autoplay')])}</div>
      <div class="stack"><h3>Sample scenes</h3>${gal(b.samples.map(c=>`<img src="${esc(c)}" alt="" data-full="${esc(c)}">`))}</div>
      <details class="fold"><summary>Sources and rules</summary><div class="small">
        <p class="muted">${esc(b.logo_note||'')}</p>
        <p>Colours: ${esc([...new Set(b.palette.map(c=>c.source))].join(' · '))}</p>
        ${b.type.map(t=>`<p>${esc(t.role)}: ${esc(t.font||'unassigned')}${t.source?' · '+esc(t.source):''}${t.missing?' · '+esc(t.missing):''}</p>`).join('')}
        <ul>${b.image_rules.filter(Boolean).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>${b.motion.notes.map(n=>`<p class="muted">${esc(n)}</p>`).join('')}<p class="muted">${esc(b.endcard.caption)}</p>
        ${sep.map(c=>`<div class="okrow"><b class="${c.ok?'yes':'no'}">${c.ok?'✓':'✗'}</b><span>${esc(c.check)}</span></div>`).join('')}</div></details>
    </section>`;
}

// ------------------------------------------------------------------ MORE (tasks, costs, details)
function more(){
  const c = DATA.costs, a = c.elevenlabs_account, v = V(), id = DATA.identity[proj];
  const open = DATA.review_tasks.filter(t=>t.status!=='done').length;
  return `<h2>More</h2>
    <a class="panel" href="${link('tasks')}" style="text-decoration:none;color:var(--ink);flex-direction:row;align-items:center;justify-content:space-between"><span><b>All tasks</b><br><span class="small muted">Both projects, grouped</span></span><span class="row"><span class="badge">${open}</span>›</span></a>
    <div class="panel"><div class="row between"><b>Paid voice</b>${pill('s-bad','🔒 Locked',true)}</div><p class="small">${c.spend.actual_units} spent · ${a.used.toLocaleString()} of ${a.limit.toLocaleString()} account characters used</p><div class="meter"><i style="width:${100*a.used/a.limit}%"></i></div></div>
    <details class="fold" ${arg==='blockers'?'open':''}><summary>Blockers</summary><div>${v.blockers.length?v.blockers.map(b=>`<p class="small"><b class="ar" dir="auto">${esc(b.what)}</b><br><span class="muted ar" dir="auto">${esc(b.why)}</span></p>`).join(''):'<p class="small muted">None</p>'}</div></details>
    <details class="fold" ${arg==='voice'?'open':''}><summary>Voice</summary><div class="small"><p>${esc(id.final_voice)} · ${esc(id.voices.map(x=>x.name+' ('+x.status+')').join(', '))}</p>
      ${v.stages.filter(s=>s.stage==='voice').map(s=>`<p>${s.units?s.units.done+' of '+s.units.total+' '+esc(s.units.unit):''} · ${esc(s.why)}</p>`).join('')}</div></details>
    <details class="fold"><summary>Costs</summary><div class="small"><p>${esc(c.guarantee)}</p>${c.lock.requires.map(r=>`<div class="okrow"><b class="${r.met?'yes':'no'}">${r.met?'✓':'✗'}</b><span>${esc(r.step)}</span></div>`).join('')}
      ${c.estimates.map(e=>`<p>${e.units.toLocaleString()} ${esc(e.unit)} estimated · ${esc(e.what)}</p>`).join('')}
      <div class="tbl"><table><tr><th>Operation</th><th>Cost</th></tr>${c.operations.map(o=>`<tr><td>${esc(o.op)}</td><td>${pill(o.kind==='paid'?'s-bad':'s-ok',o.kind)}</td></tr>`).join('')}</table></div></div></details>
    <details class="fold"><summary>Stages</summary><div>${v.stages.map(s=>`<p class="small"><b>${esc(s.label)}</b> · ${esc(s.status.replace('_',' '))}${s.units?` · ${s.units.done}/${s.units.total} ${esc(s.units.unit)}`:''}<br><span class="muted ar" dir="auto">${esc(s.why)}</span></p>`).join('')}</div></details>
    <details class="fold"><summary>Processing runs</summary><div>${runsTable()}</div></details>
    <details class="fold"><summary>History</summary><div class="feed">${v.history.slice(-14).reverse().map(e=>`<div class="ev"><time>${fmtAt(e.at)}</time><div><span class="ar" dir="auto">${esc(e.what||e.kind)}</span>${e.source==='reconstructed'?' '+pill('s-unk','reconstructed'):''}</div></div>`).join('')}</div></details>
    <details class="fold"><summary>Technical</summary><div class="small"><dl class="kv"><dt>Profile</dt><dd class="mono">${esc(id.profile)} · v${esc(id.version)} · ${esc(id.status)}</dd><dt>Engine</dt><dd>${esc(id.engine)}</dd>
      <dt>Pronunciation</dt><dd class="mono">${esc((id.library_scopes||[]).join(', '))}</dd><dt>Film</dt><dd>${esc(v.preview.label)}</dd><dt>Snapshot</dt><dd>${fmtAt(DATA.generated_at)}</dd>
      <dt>Mode</dt><dd>${MODE==='local'?'Local app · saves to the event log':'Review copy · saves wait for the local app'}</dd></dl></div></details>`;
}
function runsTable(){
  const runs = DATA.tasks.recent.filter(r => r.project===proj);
  if(!runs.length) return '<p class="muted small">None yet.</p>';
  return `<div class="tbl"><table><tr><th>Task</th><th>Units</th><th>Took</th><th>ETA check</th></tr>${runs.map(r=>`<tr><td>${esc(r.task)}</td><td class="n">${r.units_done}/${r.units_total}</td><td class="n">${dur(r.elapsed_s)}</td><td class="n">${r.eta_check?`said ${dur(r.eta_check.predicted_s)}, took ${dur(r.eta_check.actual_s)}`:'—'}</td></tr>`).join('')}</table></div>`;
}

// ------------------------------------------------------------------ render + events
function render(){
  chrome();
  const fn = {review, scenes, scene, voice, final, lines, art, style, more, tasks}[view] || review;
  $('view').innerHTML = fn();
  if(view==='scenes') bindScenes();
  if(view==='voice') bindAudio();
  if(view==='review' && arg && !isNaN(+arg)) seekTo(+arg, 'pv');
  const on = document.querySelector('.chips button[aria-pressed="true"]'); if(on) on.scrollIntoView({block:'nearest', inline:'center'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('button,img[data-full]'); if(!b) return; const d = b.dataset;
  if(d.proj){ proj=d.proj; arg=null; location.hash = link(FLOWS.includes(view)||view==='tasks'?'review':view); }
  else if(d.other!=null && d.ans==null){ OTHER = d.item; render(); }
  else if(d.ans){ answer(d.item, d.ans); }
  else if(d.reask){ REASK.add(d.reask); render(); }
  else if(d.verdict){ verdict(d.item, d.verdict); }
  else if(d.lplay){ playLine(d.lplay); }
  else if(d.wl){ SHEET = {line:d.wl, i:+d.wi, kind:null}; render(); }
  else if(d.fkind){ SHEET.kind = d.fkind; render(); }
  else if(d.fsave){ saveFlag(); }
  else if(d.funflag){ unflag(); }
  else if(d.fclose){ SHEET = null; render(); }
  else if(d.wplay){ const l = DATA.voice_lines[proj].find(x=>x.id===SHEET.line), w = l.words[SHEET.i]; playLine(l.id, Math.max(0, w.s-0.35), w.e+0.35); }
  else if(d.dec){ decide(d.item, d.dec); }
  else if(d.sceneok){ sceneOk(d.sceneok); }
  else if(d.scenefix){ sceneFix(d.scenefix); }
  else if(d.fix){ const s = V().scenes.find(x=>x.id===arg) || V().scenes[0], fx = fixSet(s); fx.has(d.fix)?fx.delete(d.fix):fx.add(d.fix); render(); }
  else if(d.open){ OPEN.has(d.open)?OPEN.delete(d.open):OPEN.add(d.open); render(); }
  else if(d.href){ location.hash = d.href; }
  else if(d.goproj){ location.hash = d.goproj; }
  else if(d.seekscene){ if(view!=='scenes'){ location.hash = link('scenes'); setTimeout(()=>seekTo(sceneStart(d.seekscene)),300); } else seekTo(sceneStart(d.seekscene)); }
  else if(d.artscene){ location.hash = link('art', d.artscene); }
  else if(d.arttab){ artTab=d.arttab; render(); }
  else if(d.rv){ rvFilter=d.rv; render(); }
  else if(d.word){ playWord(d.word); }
  else if(d.clip){ lightbox(`<video controls autoplay muted loop playsinline>${sources(d.clip)}</video>`); }
  else if(d.full){ lightbox(`<img src="${esc(d.full)}" alt="Full-screen view">`); }
  else if(d.compare){ const s = V().scenes.find(x=>x.id===arg) || V().scenes.find(x=>x.id==='b1'); const os = (s.concepts.options||[]).filter(o=>compareSet.has(o.id));
    lightbox(`<div class="compare">${os.map(o=>`<figure>${o.preview?`<img src="${esc(o.preview.img)}" alt="">`:'<div style="width:220px;height:390px;border:1px dashed #666;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center">Proposal only · nothing drawn</div>'}<figcaption><b>${esc(o.name)}</b> · Proposal<br>${o.preview?`<span style="color:#f3c96b">${esc(o.preview.label)}</span><br>`:''}${esc(o.cost)} · ${o.renderable?'can render':'can\'t render yet'}</figcaption></figure>`).join('')}</div>`); }
});
document.addEventListener('change', e => { const c = e.target.closest('input[data-cmp]'); if(!c) return;
  if(c.checked){ if(compareSet.size>=3){ c.checked=false; toast('Compare up to 3.'); return; } compareSet.add(c.dataset.cmp); } else compareSet.delete(c.dataset.cmp);
  const b = $('cmpBtn'); if(b){ b.disabled = compareSet.size<2; b.textContent = 'Compare '+(compareSet.size||''); } });
function playing(){ return [...document.querySelectorAll('audio,video')].some(m => !m.paused && !m.muted); }   // never re-render under a listener
function lightbox(html){ $('lbBody').innerHTML = html; $('lb').hidden = false; $('lbClose').focus(); }
$('lbClose').addEventListener('click', ()=>{ $('lb').hidden = true; $('lbBody').innerHTML=''; });
addEventListener('keydown', e => { if(e.key==='Escape' && !$('lb').hidden){ $('lb').hidden = true; $('lbBody').innerHTML=''; } });

seed();
try{ if(MODE==='artifact') Object.assign(PAGE, JSON.parse(localStorage.getItem('vd-page-decisions')||'{}')); }catch(e){}
parse(); render();
if(MODE==='artifact'){ (async()=>{ try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; if(!db) return;
  db.collection('decisions').onSnapshot(s => { for(const d of s.docs){ const v=d.data(); if(v&&v.decision_id) PAGE[v.decision_id]=v; } if(!playing()) render(); }, ()=>{});
  db.collection('sync').onSnapshot(s => { for(const d of s.docs){ const v=d.data(); if(v&&v.decision_id) RECEIPT[v.decision_id]=v; } if(!playing()) render(); }, ()=>{});
}catch(e){ db=null; } })(); }
</script>
