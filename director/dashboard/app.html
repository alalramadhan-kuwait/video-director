<title>Video Director</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@600;800&family=Inter:wght@500;700&display=swap">
<style>
/* Layout: a studio. The video is the stage: Watch opens on the player with the episode's title, current stage and
   the one next action beside it; detail lives in folded sections below. Dark-first like an edit suite (a light theme
   follows the system). Chrome stays neutral graphite so the projects' own colours (the band under the header, the
   style boards) are the only brand colour on screen. State colours are semantic and always carry a text label. */
:root{
  --bg:#0f1114; --panel:#16191e; --raise:#1c2026; --sunk:#0b0d10; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
  --accent:#8fb4e3; --accent-ink:#0f1114; --accent-soft:#1d2a3a;
  --ok:#6cc79a; --ok-soft:#14301f; --wait:#e8b65a; --wait-soft:#362a10; --bad:#f08c80; --bad-soft:#3a1c19;
  --proc:#7fb2ea; --proc-soft:#17283b; --unk:#9aa1ab; --unk-soft:#22272e; --ai:#b9a2e6; --ai-soft:#271f3c; --fix:#7fd3c8; --fix-soft:#11302c;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif; --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; --ai:#6b4fa0; --ai-soft:#eee8f8; --fix:#11756b; --fix-soft:#dcf2ef; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; --ai:#6b4fa0; --ai-soft:#eee8f8; --fix:#11756b; --fix-soft:#dcf2ef; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
.ar{font-family:var(--f-ar)}
a{color:var(--accent)}
button,select{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
h1{font-size:1rem;margin:0}
h2{font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:-.005em}
h3{font-size:1rem;margin:0}
p{margin:0}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem} .mono{font-family:var(--f-mono);font-size:.86em}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
/* chrome */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.toprow{display:flex;align-items:center;gap:10px 14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto;white-space:nowrap}
.brand .mk{width:20px;height:20px;border-radius:5px;border:2px solid var(--ink);position:relative}
.brand .mk::after{content:"";position:absolute;inset:4px 3px 4px 6px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
.proj{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.proj button{border:0;border-radius:0;min-height:34px;display:inline-flex;align-items:center;gap:7px;background:transparent}
.proj button+button{border-inline-start:1px solid var(--line)}
.proj i{width:10px;height:10px;border-radius:50%;display:inline-block}
.band{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:6px 16px;font-size:.78rem;background:var(--pb);color:var(--pi)}
.band b{font-weight:600}
.band .sw{display:inline-flex;gap:3px} .band .sw i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(127,127,127,.45)}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
nav.rail{border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:96px;align-self:start;min-height:calc(100vh - 96px)}
nav.rail a,nav.tabs a{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;border-radius:8px;padding:8px 10px}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{margin-inline-start:auto;background:var(--wait-soft);color:var(--wait);font-size:.7rem;font-weight:700;border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
nav.tabs{display:none}
main{padding:18px 22px 48px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.ic{width:18px;height:18px;flex:none}
@media (max-width:760px){
  .shell{grid-template-columns:1fr} nav.rail{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs a{flex-direction:column;gap:1px;font-size:.64rem;padding:7px 1px;justify-content:center;position:relative}
  nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
  nav.tabs .badge{position:absolute;top:2px;inset-inline-end:6px;margin:0}
  main{padding:14px 16px 92px}
  .toprow{padding:8px 16px} .brand h1{font-size:.92rem} .proj button{padding:4px 9px;font-size:.84rem}
  .band .hide-s{display:none}
}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.fold{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)} details.fold[open]>summary::after{content:"－"}
details.fold>div{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;line-height:1.6;max-width:100%}
@media (max-width:420px){.pill{white-space:normal}}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-processing{background:var(--proc-soft);color:var(--proc)} .s-waiting_review{background:var(--wait-soft);color:var(--wait)}
.s-approved,.s-done{background:var(--ok-soft);color:var(--ok)} .s-blocked,.s-failed{background:var(--bad-soft);color:var(--bad)}
.s-unknown,.s-not_started,.s-no_findings,.s-missing{background:var(--unk-soft);color:var(--unk)}
.v-critical{background:var(--bad-soft);color:var(--bad)} .v-major{background:var(--wait-soft);color:var(--wait)} .v-minor{background:var(--proc-soft);color:var(--proc)} .v-info{background:var(--unk-soft);color:var(--unk)}
.b-decide{background:var(--wait-soft);color:var(--wait)} .b-fixable{background:var(--fix-soft);color:var(--fix)} .b-suggestion{background:var(--unk-soft);color:var(--unk)} .b-blocked{background:var(--bad-soft);color:var(--bad)}
.k-ai{background:var(--ai-soft);color:var(--ai)} .k-auto{background:var(--ok-soft);color:var(--ok)} .k-plain{background:var(--unk-soft);color:var(--unk)}
/* watch */
.stage{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.player{display:flex;flex-direction:column;gap:8px}
.player video{width:100%;max-height:72vh;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:14px;border:1px solid var(--line);display:block}
@media (max-width:760px){.player video{max-height:58vh}}
.player .kind{font-size:.78rem;color:var(--muted)}
.hero h2{font-size:1.9rem;line-height:1.25}
@media (max-width:760px){.hero h2{font-size:1.5rem}}
.next{border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.steps .st{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--muted);min-width:0}
.steps .st i{display:block;height:6px;border-radius:99px;background:var(--unk-soft)}
.steps .st.approved i{background:var(--ok)} .steps .st.waiting_review i{background:var(--wait)} .steps .st.processing i{background:var(--proc)} .steps .st.blocked i,.steps .st.failed i{background:var(--bad)}
.steps .st.current span{color:var(--ink);font-weight:600}
.blocker{border-inline-start:3px solid var(--bad);padding:4px 10px;font-size:.88rem}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;background:var(--raise);border-top:3px solid var(--unk);min-width:0}
.sc.approved{border-top-color:var(--ok)} .sc.waiting_review{border-top-color:var(--wait)} .sc.blocked{border-top-color:var(--bad)}
.bar{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:540px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top} tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:.76rem} td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.feed .ev{display:grid;grid-template-columns:120px 1fr;gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.feed .ev:last-child{border-bottom:0} .feed time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.76rem}
@media (max-width:520px){.feed .ev{grid-template-columns:1fr}}
/* timeline */
.tlwrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.tlwrap{grid-template-columns:1fr}}
.tlwrap .player{position:sticky;top:110px}
@media (max-width:900px){.tlwrap .player{position:static}.tlwrap .player video{max-height:42vh}}
.strip{display:flex;gap:3px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.strip button{padding:0;border:2px solid transparent;border-radius:6px;background:var(--sunk);flex:none;display:flex;flex-direction:column;overflow:hidden;min-height:0;scroll-snap-align:start}
.strip button img{height:86px;width:100%;object-fit:cover;display:block}
.strip button b{height:5px;display:block}
.strip button span{font:500 .62rem var(--f-mono);color:var(--muted);padding:1px 3px;text-align:start}
.strip button.now{border-color:var(--accent)}
.sev-critical{background:var(--bad)} .sev-major{background:var(--wait)} .sev-minor{background:var(--proc)} .sev-none{background:var(--unk-soft)} .sev-ok{background:var(--ok)} .sev-listen{background:var(--wait)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.srow.now{border-color:var(--accent)}
.srow img{width:58px;height:103px;object-fit:cover;border-radius:6px;background:var(--sunk)}
.srow .nar{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.92rem}
/* scene + art */
.split{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.media video,.media img{width:100%;max-width:320px;border-radius:12px;border:1px solid var(--line);background:#000;display:block}
@media (max-width:900px){.media video,.media img{margin-inline:auto}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px} .chips button{flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden} .seg button{border:0;border-radius:0} .seg button+button{border-inline-start:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
@media (max-width:760px){.cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.cards>.card{flex:0 0 86%;scroll-snap-align:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.locked{border-color:var(--ok)} .card.rec{border-color:var(--accent)}
.card .pv{aspect-ratio:9/16;max-height:440px;width:100%;border-radius:10px;overflow:hidden;background:var(--sunk);position:relative;display:flex;align-items:center;justify-content:center}
.card .pv.wide{aspect-ratio:auto;max-height:none}
.card .pv img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.card .pv.wide img{object-fit:contain;height:auto}
.card .pv .lab{position:absolute;inset-inline:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;padding:5px 8px}
.card .pv .none{padding:18px;text-align:center;color:var(--muted);font-size:.86rem;border:1px dashed var(--line);border-radius:10px;margin:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.84rem} .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.yes{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sync{font-size:.76rem;font-weight:600}
.sync.recorded{color:var(--ok)} .sync.pending{color:var(--wait)} .sync.problem{color:var(--bad)}
/* reviews */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.summary button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;background:var(--panel);text-align:start}
.summary b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid var(--unk)}
.task.needs_decision{border-inline-start-color:var(--wait)} .task.fixable{border-inline-start-color:var(--fix)} .task.blocked{border-inline-start-color:var(--bad)} .task.done{border-inline-start-color:var(--ok);opacity:.85}
.task .title{font-weight:600;font-size:1.02rem}
.finding{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--raise)}
.check{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--raise)}
.check audio{width:100%;height:40px}
.gate{font-size:.82rem}
textarea{font:inherit;width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:6px 8px}
/* identity */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.board{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--panel)}
.board .head{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.swatch{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.72rem}
.swatch i{display:block;height:46px} .swatch span{display:block;padding:4px 6px} .swatch code{font-family:var(--f-mono)}
.type{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gallery3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gallery3 figure{margin:0;display:flex;flex-direction:column;gap:4px} .gallery3 img,.gallery3 video{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#000}
.gallery3 figcaption{font-size:.72rem;color:var(--muted)}
.okrow{display:flex;gap:8px;align-items:flex-start;font-size:.88rem} .okrow b{width:18px;text-align:center;flex:none}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden} .meter i{display:block;height:100%;background:var(--accent)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.lightbox img,.lightbox video{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox .compare{display:flex;gap:10px;max-width:100%;overflow-x:auto}
.lightbox .compare figure{margin:0;flex:0 0 auto;max-width:min(calc(70vh * 0.5625),80vw);color:#ddd;font-size:.8rem}
.lightbox .compare img{max-height:70vh}
.lightbox button{background:#fff;color:#111;border-color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;max-width:90vw}
@media (min-width:761px){.toast{bottom:20px}}
.empty{color:var(--muted);font-size:.9rem;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="toprow">
    <div class="brand"><span class="mk" aria-hidden="true"></span><h1>Video Director</h1></div>
    <div class="proj" role="group" aria-label="Project" id="proj"></div>
  </div>
  <div class="band" id="band"></div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="lightbox" id="lb" hidden role="dialog" aria-label="Full-screen view"><div id="lbBody"></div><button type="button" id="lbClose">Close</button></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
let DATA = __DATA__;
const MODE = '__MODE__';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P_KEYS = {tk:'timekeeper', dh:'diabetes-history'}, P_SHORT = {'timekeeper':'tk','diabetes-history':'dh'};
const ST = {processing:'Processing', waiting_review:'Waiting for review', approved:'Approved', blocked:'Blocked', failed:'Failed', unknown:'Not recorded', not_started:'Not started', no_findings:'No findings', missing:'Missing here', done:'Done', needs_decision:'Needs your decision', fixable:'Claude can fix', suggestion:'Suggestion only'};
const DEC_LABEL = {approved:'Approved', rejected:'Rejected', changes_requested:'Changes requested', selected:'Selected', concept_selected:'Concept selected', accepted:'Accepted', dismissed:'Dismissed', needs_source:'Needs a source', article_heard:'Article heard', article_missing:'Article missing', unsure:'Not sure', playback_failed:'Audio could not play'};
const LISTEN = ['article_heard','article_missing','unsure'];
const BSHORT = {decide:'Needs your decision', fixable:'Claude can fix', suggestion:'Suggestion', blocked:'Blocked: missing evidence'};
const ICON = {
  watch:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg>',

// ------------------------------------------------------------------ decisions: recorded (event log) + page (waiting for sync)
const REC = {};      // item -> recorded decision from the event log (snapshot)
const PAGE = {};     // decision_id -> decision saved on this Artifact page
const RECEIPT = {};  // decision_id -> sync receipt written back by the local application
const PLAY = {};     // check id -> playback evidence from the browser
let db = null;
function seed(){
  for(const k in REC) delete REC[k];
  const put = (id,d) => { if(id && d) REC[id] = d; };
  DATA.review_tasks.forEach(t => { put(t.id, t.decision); (t.checks||[]).forEach(c => put(c.id, c.decision)); });
  Object.values(DATA.projects).forEach(p => p.videos.forEach(v => v.scenes.forEach(s => {
    (s.findings||[]).forEach(f => put(f.id, f.decision)); (s.versions||[]).forEach(x => put(x.id, x.decision));
    ((s.concepts||{}).options||[]).forEach(o => put(o.id, o.decision)); })));
}
function latestPage(item){ return Object.values(PAGE).filter(d => d.item===item).sort((a,b)=>a.at<b.at?-1:1).pop(); }
function state(item){
  // what the owner sees for an item: the recorded decision, unless a newer page decision is still waiting for sync
  const pg = latestPage(item), rc = REC[item];
  if(pg){ const r = RECEIPT[pg.decision_id];
    if(!r) return {decision:pg.decision, sync:'pending', text:'Saved on this page · waiting for the local app'};
    if(r.status==='recorded'||r.status==='duplicate') return {decision:pg.decision, sync:'recorded', text:'Recorded in the event log'+(r.event?' · #'+r.event:''), locked:pg.decision==='approved'};
    if(!rc) return {decision:null, sync:'problem', text:'Not recorded: '+r.reason};
    return {...rc, sync:'problem', text:'Your page decision was not recorded: '+r.reason, locked:rc.decision==='approved'};
  }
  if(rc) return {...rc, sync:'recorded', text:'Recorded in the event log'+(rc.event?' · #'+rc.event:''), locked:rc.decision==='approved'};
  return null;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>e.hidden=true, 3200); }
async function decide(item, decision){
  const cur = state(item);
  if(cur && cur.locked && decision!=='changes_requested'){ toast('Approved and locked. Request changes to open a new revision.'); return; }
  const row = {decision_id:uid(), item, decision, note:'', at:new Date().toISOString()};
  if(LISTEN.includes(decision)){
    const ev = PLAY[item];
    if(!ev || !ev.ok){ toast('Play the flagged word first. A listening answer needs the audio to have played.'); return; }
    row.playback = ev.record;
  }
  try{
    if(MODE==='local'){
      const r = await fetch('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(row)});
      const j = await r.json();
      if(j.status==='recorded'||j.status==='duplicate'){ const f = await fetch('/api/snapshot'); if(f.ok){ DATA = await f.json(); seed(); } toast('Recorded in the event log · #'+j.event); }
      else toast('Not recorded ('+j.status+'): '+j.reason);
    } else {
      PAGE[row.decision_id] = row;
      if(db) await db.doc('decisions/'+row.decision_id).set(row);
      else { try{ localStorage.setItem('vd-page-decisions', JSON.stringify(PAGE)); }catch(e){} }
      toast('Saved on this page. It counts once the local app records it.');
    }
    render();
  }catch(e){ toast('Not saved ('+(e&&e.code||e.message||'error')+'). Try again.'); }
}
function decBlock(item, choices, opts={}){
  const st = state(item);
  const btns = choices.map(([v,l]) => `<button type="button" data-dec="${v}" data-item="${esc(item)}" ${(st&&st.locked&&v!=='changes_requested')||(opts.gate&&LISTEN.includes(v)&&!(PLAY[item]&&PLAY[item].ok))||opts.disabled?'disabled':''} aria-pressed="${!!st&&st.decision===v}">${esc(l)}</button>`).join('');
  const s = st ? `<span class="sync ${st.sync}">${st.locked?'Locked · ':''}${esc(DEC_LABEL[st.decision]||'')}${st.decision?' · ':''}${esc(st.text)}</span>` : '';
  return `<div class="acts">${btns}${s}</div>`;
}

    <div class="row">${pill('k-plain',t.type)} <span class="pill k-plain">${esc(pname)}</span> ${stP(t.status)} ${t.priority&&['critical','major','minor'].includes(t.priority)?pill('v-'+t.priority,t.priority):''}${t.scene?`<a class="mono small" href="#${P_SHORT[t.project]}~scene~${esc(t.scene)}">${esc(t.scene)}</a>`:''}${t.progress?`<span class="tiny muted">${t.progress.done}/${t.progress.total} done</span>`:''}</div>

function checkCard(c){
  const ev = PLAY[c.id];
  const gate = !c.available ? '<span class="no">The audio file is missing, so this cannot be answered as a listening result.</span>'
    : ev&&ev.error ? `<span class="no">The audio did not play (${esc(ev.error)}). This cannot count as a listening result.</span>`
    : ev&&ev.ok ? `<span class="yes">✓ ${esc(ev.text)}</span>` : `<span style="color:var(--wait)">Play the flagged word (${fmtT(c.word_s)}–${fmtT(c.word_e)}) before answering.</span>`;
  return `<div class="check" data-check="${esc(c.id)}"><div class="row between"><b class="ar" dir="auto">«${esc(c.written)}» → <bdi>${esc(c.sent)}</bdi></b><span class="tiny muted">line ${esc(c.line)}${c.cost_if_changed?' · a fix would cost '+c.cost_if_changed+' ElevenLabs characters':''}</span></div>
    <audio controls preload="metadata" src="${esc(c.audio)}" data-audio="${esc(c.id)}"></audio>
    <div class="row"><button type="button" data-word="${esc(c.id)}" ${c.available?'':'disabled'}>▶ Play the flagged word</button><span class="gate">${gate}</span></div>
    ${decBlock(c.id, [['article_heard','Article heard'],['article_missing','Article missing'],['unsure','Not sure']], {gate:true})}
    ${ev&&ev.error?decBlock(c.id+'', [['playback_failed','Report: audio would not play']]):''}</div>`;
}
function bindAudio(){
  document.querySelectorAll('audio[data-audio]').forEach(a => {
    const id = a.dataset.audio, c = DATA.inbox_checks.find(x=>x.id===id);
    const upd = () => {
      const ranges = []; for(let i=0;i<a.played.length;i++) ranges.push([+a.played.start(i).toFixed(3), +a.played.end(i).toFixed(3)]);
      const s = Math.max(0, c.word_s - 0.15), e = c.word_e; let cov = 0;
      ranges.forEach(([x,y]) => { const lo=Math.max(x,s), hi=Math.min(y,e); if(hi>lo) cov+=hi-lo; });
      const pct = cov/(e-s), durOk = isFinite(a.duration) && Math.abs(a.duration - c.duration) <= 0.25;
      const ok = durOk && pct >= 0.8;
      const was = PLAY[id] && PLAY[id].ok;
      PLAY[id] = {ok, error:null, text: ok?`played ${Math.round(pct*100)} % of the flagged word`:'', record:{src:a.currentSrc, duration:+a.duration.toFixed(3), played:ranges, error:null}};
      if(ok && !was){ const card = a.closest('.check'); card.querySelector('.gate').innerHTML = `<span class="yes">✓ ${esc(PLAY[id].text)}</span>`; card.querySelectorAll('button[data-dec]').forEach(b=>{ if(['article_heard','article_missing','unsure'].includes(b.dataset.dec) && !(state(id)||{}).locked) b.disabled=false; }); }
    };
    a.addEventListener('timeupdate', upd); a.addEventListener('pause', upd); a.addEventListener('ended', upd);
    a.addEventListener('error', () => { PLAY[id] = {ok:false, error:(a.error&&a.error.message)||'media error '+(a.error&&a.error.code), record:{src:a.currentSrc||a.src, error:'load failed'}}; render(); });
  });
}
function playWord(id){
  const a = document.querySelector(`audio[data-audio="${CSS.escape(id)}"]`), c = DATA.inbox_checks.find(x=>x.id===id); if(!a) return;
  const start = Math.max(0, c.word_s - 0.6), stop = c.word_e + 0.4;
  const go = () => { a.currentTime = start; a.play().catch(err => { PLAY[id] = {ok:false, error:err.message, record:{src:a.currentSrc, error:err.message}}; render(); });
    const h = () => { if(a.currentTime >= stop){ a.pause(); a.removeEventListener('timeupdate', h); } }; a.addEventListener('timeupdate', h); };
  if(a.readyState>=1) go(); else { a.addEventListener('loadedmetadata', go, {once:true}); a.load(); }
}

function render(){
  chrome();
  const fn = {watch, timeline, scene:sceneView, art, reviews, identity, costs}[view] || watch;
  $('view').innerHTML = fn();
  if(view==='timeline') bindTimeline();
  if(view==='reviews') bindAudio();
  if(view==='watch' && arg && !isNaN(+arg)) seekTo(+arg, 'pv');
  if(view==='reviews' && arg==='task'){ const el = document.getElementById('task-'+location.hash.split('~')[3]); if(el) el.scrollIntoView({block:'start'}); }
  const on = document.querySelector('.chips button[aria-pressed="true"]'); if(on) on.scrollIntoView({block:'nearest', inline:'center'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('button,img[data-full]'); if(!b) return; const d = b.dataset;
  if(d.proj){ proj=d.proj; arg=null; go(view==='scene'?'timeline':view); }
  else if(d.dec){ decide(d.item, d.dec); }
  else if(d.go){ const [v,a,c] = d.go.split('~'); location.hash = [P_SHORT[proj], v, a, c].filter(Boolean).join('~'); }
  else if(d.goproj){ location.hash = d.goproj; }
  else if(d.seek!=null){ seekTo(+d.seek, 'pv'); }
  else if(d.seekscene){ if(view!=='timeline'){ location.hash = P_SHORT[proj]+'~timeline'; setTimeout(()=>seekTo(sceneStart(d.seekscene)),300); } else seekTo(sceneStart(d.seekscene)); }
  else if(d.seeksceneT!=null){ location.hash = P_SHORT[proj]+'~watch~'+d.seeksceneT; }
  else if(d.artscene){ arg=d.artscene; location.hash = P_SHORT[proj]+'~art~'+d.artscene; }
  else if(d.arttab){ artTab=d.arttab; render(); }
  else if(d.rv){ rvFilter=d.rv; render(); }
  else if(d.word){ playWord(d.word); }
  else if(d.clip){ lightbox(`<video controls autoplay muted loop playsinline>${sources(d.clip)}</video>`); }
  else if(d.full){ lightbox(`<img src="${esc(d.full)}" alt="Full-screen view">`); }
  else if(d.compare){ const s = V().scenes.find(x=>x.id===arg) || V().scenes.find(x=>x.id==='b1'); const os = (s.concepts.options||[]).filter(o=>compareSet.has(o.id));
    lightbox(`<div class="compare">${os.map(o=>`<figure>${o.preview?`<img src="${esc(o.preview.img)}" alt="">`:'<div style="width:220px;height:390px;border:1px dashed #666;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center">Proposal only · no artwork</div>'}<figcaption><b>${esc(o.name)}</b> · Proposal<br>${o.preview?`<span style="color:#f3c96b">${esc(o.preview.label)}</span><br>`:''}${esc(o.cost)} · ${o.renderable?'renderable now':'not renderable yet'}<br>${esc(o.reasons.join('; '))}</figcaption></figure>`).join('')}</div>`); }
});
document.addEventListener('change', e => { const c = e.target.closest('input[data-cmp]'); if(!c) return;
  if(c.checked){ if(compareSet.size>=3){ c.checked=false; toast('Compare up to 3 concepts.'); return; } compareSet.add(c.dataset.cmp); } else compareSet.delete(c.dataset.cmp);
  const b = $('cmpBtn'); if(b){ b.disabled = compareSet.size<2; b.textContent = 'Compare '+(compareSet.size||''); } });
function playing(){ return [...document.querySelectorAll('audio,video')].some(m => !m.paused && !m.muted); }   // never re-render under a listener
function lightbox(html){ $('lbBody').innerHTML = html; $('lb').hidden = false; $('lbClose').focus(); }
$('lbClose').addEventListener('click', ()=>{ $('lb').hidden = true; $('lbBody').innerHTML=''; });
addEventListener('keydown', e => { if(e.key==='Escape' && !$('lb').hidden){ $('lb').hidden = true; $('lbBody').innerHTML=''; } });

seed();
try{ if(MODE==='artifact') Object.assign(PAGE, JSON.parse(localStorage.getItem('vd-page-decisions')||'{}')); }catch(e){}
parse(); render();
if(MODE==='artifact'){ (async()=>{ try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; if(!db) return;
  db.collection('decisions').onSnapshot(s => { for(const d of s.docs){ const v=d.data(); if(v&&v.decision_id) PAGE[v.decision_id]=v; } if(!playing()) render(); }, ()=>{});
  db.collection('sync').onSnapshot(s => { for(const d of s.docs){ const v=d.data(); if(v&&v.decision_id) RECEIPT[v.decision_id]=v; } if(!playing()) render(); }, ()=>{});
}catch(e){ db=null; } })(); }
</script>
