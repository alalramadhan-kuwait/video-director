<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Director Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Studio: a new video from an idea to a draft film and a checked final-voice plan. One step at a time, one main
   button per screen, state shown by colour + icon + one word. Same tokens as the review dashboard. */
:root{
  --bg:#0f1114; --panel:#16191e; --raise:#1c2026; --sunk:#0b0d10; --ink:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
  --accent:#8fb4e3; --accent-ink:#0f1114; --accent-soft:#1d2a3a;
  --ok:#6cc79a; --ok-soft:#14301f; --wait:#e8b65a; --wait-soft:#362a10; --bad:#f08c80; --bad-soft:#3a1c19;
  --proc:#7fb2ea; --proc-soft:#17283b; --unk:#9aa1ab; --unk-soft:#22272e;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif; --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#ffffff; --raise:#f7f8fa; --sunk:#e6e9ed; --ink:#14171b; --muted:#59616c; --line:#d6dae0;
  --accent:#2b5b87; --accent-ink:#ffffff; --accent-soft:#e2ebf4;
  --ok:#1d7a4e; --ok-soft:#dff1e7; --wait:#8a5a00; --wait-soft:#fbefd6; --bad:#b0362b; --bad-soft:#f8e1de;
  --proc:#2463a6; --proc-soft:#e1ecf8; --unk:#5f6873; --unk-soft:#eceef1; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;overflow-wrap:break-word}
main,.panel{max-width:100%} .mono,code{overflow-wrap:anywhere;word-break:break-word} .tablewrap{overflow-x:auto;max-width:100%}
.ar{font-family:var(--f-ar)} a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:42px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{min-height:52px;font-size:1.02rem;width:100%}
button.ok{border-color:var(--ok);color:var(--ok)} button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input,textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:88px;resize:vertical}
body.busy button{pointer-events:none;opacity:.6}
h1{font-size:1rem;margin:0} h2{font-size:1.3rem;margin:0} h3{font-size:1rem;margin:0} p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem} .mono{font-family:var(--f-mono);font-size:.85em}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px}
header.top a.home{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;margin-inline-end:auto}
.mk{width:20px;height:20px;border-radius:5px;border:2px solid var(--ink);position:relative;flex:none}
.mk::after{content:"";position:absolute;inset:4px 3px 4px 6px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
main{padding:16px 16px 110px;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;max-width:100%}
.pill:where([class*="s-"],[class*="v-"]){white-space:normal;overflow-wrap:anywhere;border-radius:12px}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-wait{background:var(--wait-soft);color:var(--wait)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.s-unk{background:var(--unk-soft);color:var(--unk)} .s-proc{background:var(--proc-soft);color:var(--proc)}
.v-critical{background:var(--bad-soft);color:var(--bad)} .v-major{background:var(--wait-soft);color:var(--wait)} .v-minor{background:var(--proc-soft);color:var(--proc)} .v-info{background:var(--unk-soft);color:var(--unk)}
.banner-draft{background:var(--wait-soft);color:var(--wait);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.banner-lock{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
/* steps */
ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
ol.steps a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none}
ol.steps .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:var(--unk-soft);color:var(--unk);flex:none}
ol.steps .l{font-weight:600;font-size:.92rem;line-height:1.2} ol.steps .st{display:block;font-size:.74rem;color:var(--muted);font-weight:400}
ol.steps li.approved .n{background:var(--ok-soft);color:var(--ok)} ol.steps li.now a{border-color:var(--accent);background:var(--accent-soft)}
ol.steps li.now .n{background:var(--accent);color:var(--accent-ink)} ol.steps li.blocked .n,ol.steps li.failed .n,ol.steps li.interrupted .n{background:var(--bad-soft);color:var(--bad)}
ol.steps li.processing .n{background:var(--proc-soft);color:var(--proc)}
.flowhead{display:flex;align-items:center;gap:10px} .flowhead a.back{font-size:1.4rem;text-decoration:none;color:var(--ink);padding:0 8px 0 0}
.flowhead .t{font-weight:700;font-size:1.15rem} .flowhead .nx{margin-inline-start:auto}
/* script */
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.lid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:8px}
.words{display:flex;flex-wrap:wrap;gap:0 1px;direction:rtl;font-family:var(--f-ar);font-size:1.12rem;line-height:1.5}
.wd{min-height:34px;padding:1px 4px;border-radius:7px;border:1px solid transparent;background:transparent}
.wd:hover{border-color:var(--line)} .wd.issue-critical{background:var(--bad-soft);color:var(--bad)} .wd.issue-major{background:var(--wait-soft);color:var(--wait)}
.wd.issue-info{text-decoration:underline dotted var(--muted)} .wd.flagged{outline:2px solid var(--bad);outline-offset:-2px}
.wd.now{background:var(--accent);color:var(--accent-ink)} .wd.changed{background:var(--ok-soft);color:var(--ok)}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtabs a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-decoration:none;color:var(--ink);background:var(--raise);font-size:.88rem}
.vtabs a[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.issue{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)} .issue:last-child{border-bottom:0}
.diff del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through} .diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
@media (min-width:761px){.sheet{align-items:center}.sheetbox{border-radius:18px}}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{min-height:38px}
/* cards, media */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.rec{border-color:var(--accent)} .card .body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card img.still{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block;cursor:zoom-in}
.thumbs{display:flex;gap:4px;padding:6px 6px 0} .thumbs img{width:56px;aspect-ratio:9/16;object-fit:cover;border-radius:6px;cursor:zoom-in}
video.film{width:100%;max-width:360px;aspect-ratio:9/16;background:#000;border-radius:14px;display:block}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;gap:8px;padding:10px;justify-content:space-between;align-items:center;color:#fff}
.viewer button{background:#222;color:#fff;border-color:#444}
/* voice */
.take{display:flex;flex-direction:column;gap:8px}
svg.wave{width:100%;height:56px;display:block;background:var(--sunk);border-radius:8px;cursor:pointer}
svg.wave rect{fill:var(--muted)} svg.wave .ph{stroke:var(--accent);stroke-width:2} svg.wave .wb{stroke:var(--line);stroke-width:1}
svg.wave .flg{fill:var(--bad-soft)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab .side{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ab .side.new{border-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem} table.t th,table.t td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.ar{direction:rtl;text-align:right}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden} .bar i{display:block;height:100%;background:var(--proc)}
.swatch{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:inline-block}
.actionbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.actionbar>*{flex:1;max-width:280px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.scenes a{display:flex;flex-direction:column;gap:3px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--raise);text-decoration:none;color:var(--ink);font-size:.74rem}
.scenes b{font-family:var(--f-mono);font-size:.8rem}.scenes .dots{display:flex;gap:4px}.scenes .d{width:10px;height:10px;border-radius:50%;background:var(--unk-soft);border:1px solid var(--line)}
.d.ok{background:var(--ok)}.d.wait{background:var(--wait)}.d.bad{background:var(--bad)}.d.sel{background:var(--proc)}
.inbox h3{display:flex;justify-content:space-between;align-items:center} .inbox a.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem}
.inbox a.item:last-child{border-bottom:0} .inbox a.item::after{content:"›";margin-inline-start:auto;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}.cmp img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;cursor:zoom-in}
.livechip{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:40}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-weight:600;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.hist li{padding:4px 0;border-bottom:1px solid var(--line);font-size:.86rem} .hist{list-style:none;margin:0;padding:0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:start}
@media (max-width:520px){.ab{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a class="home" href="#/"><span class="mk" aria-hidden="true"></span><span>Studio</span></a>
  <a href="/" class="small">Review dashboard</a></header>
<main id="main" aria-live="polite"></main>
<div id="sheet" class="sheet" hidden><div class="sheetbox" id="sheetbox" role="dialog" aria-modal="true"></div></div>
<div id="viewer" class="viewer" hidden><div class="vbar"><span id="vcap" class="small"></span><button data-vclose>Close ✕</button></div><img id="vimg" alt=""><div class="vbar"><button data-vprev>‹</button><span id="vpos" class="small"></span><button data-vnext>›</button></div></div>
<div id="toast" class="toast" hidden></div>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = (t) => `<bdi dir="rtl" class="ar">${esc(t)}</bdi>`;
const F = (pid, rel) => `/files/${pid}/${rel}`;
const uid = () => 'r-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
const WORD = /[ء-يً-ْٰـ]+|[A-Za-z][A-Za-z'’-]*|\d+/g;
const words = (t) => t.match(WORD) || [];
const STATE = { approved: ['s-ok', '✓', 'Done'], waiting_review: ['s-wait', '●', 'Your turn'], processing: ['s-proc', '◌', 'Working'],
  not_started: ['s-unk', '○', 'Not started'], failed: ['s-bad', '!', 'Failed'], interrupted: ['s-bad', '!', 'Interrupted'], blocked: ['s-bad', '■', 'Blocked'] };
let P = null, PID = null, BUSY = false, POLL = null, CUR = { v: null };
const play = { audio: new Audio(), stopAt: null, raf: null, proof: {} };

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), err ? 5200 : 2600); }
async function api(action, args = {}, extra = {}) {
  if (BUSY) return null; BUSY = true; document.body.classList.add('busy');
  try {
    const r = await fetch('/api/studio', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: PID, action, args, request_id: extra.rid || uid() }) });
    const j = await r.json();
    if (r.status >= 400) { toast(j.reason || j.error || 'Not saved', true); return null; }
    return j;
  } catch (e) { toast('Not saved: ' + e.message, true); return null; }
  finally { BUSY = false; document.body.classList.remove('busy'); }
}
async function load(pid) { const r = await fetch('/api/studio/' + pid); if (!r.ok) return null; return r.json(); }
async function refresh() { if (PID) { P = await load(PID); } render(); }
function pollWhileRunning() {
  clearTimeout(POLL);
  if (P && (P.jobs.some((j) => j.state === 'running'))) POLL = setTimeout(async () => { P = await load(PID); render(); pollWhileRunning(); }, 1500);
}
const route = () => (location.hash.replace(/^#\/?/, '') || '').split('/');
window.addEventListener('hashchange', () => { closeSheet(); go(); });
async function go() {
  const r = route();
  if (r[0] === 'p' && r[1]) { PID = r[1]; P = await load(PID); } else { PID = null; P = null; }   // always fresh: others (writer, jobs) change it too
  render(); pollWhileRunning(); window.scrollTo(0, 0);
}
function render() {
  const r = route(), m = $('#main');
  if (r[0] === 'new') return (m.innerHTML = newProject());
  if (r[0] !== 'p' || !P) return home();
  const step = r[2] || 'overview';
  const fn = { overview, research, script, hook, voice, art, storyboard, draft, review, gate, history, inbox }[step] || overview;
  m.innerHTML = fn(r);
  afterRender(step);
  pollWhileRunning();
}
function filmTag(r) {
  return `<video class="film" controls playsinline preload="metadata" poster="${F(PID, r.poster)}" data-film="${esc(r.id)}">${r.preview ? `<source src="${F(PID, r.preview)}" type="video/webm">` : ''}<source src="${F(PID, r.file)}" type="video/mp4"></video>`;
}
// ------------------------------------------------------------------ home + new
async function home() {
  const m = $('#main');
  const j = await (await fetch('/api/studio')).json();
  m.innerHTML = `<div class="row between"><h2>Your videos</h2><a href="#/new"><button class="primary" id="newBtn">＋ New video</button></a></div>
  ${j.projects.length ? `<div class="stack">${j.projects.map((p) => `<a class="panel" style="text-decoration:none;color:inherit" href="#/p/${esc(p.id)}" data-project="${esc(p.id)}">
     <div class="row between"><h3>${esc(p.title)}</h3><span class="pill s-unk">${esc(p.brand === 'timekeeper' ? 'Time Keeper' : 'Diabetes History')}</span></div>
     <span class="small muted">Now: ${esc(p.stage)} · updated ${esc((p.updated || '').replace('T', ' ').replace('Z', ''))}</span></a>`).join('')}</div>`
    : `<div class="panel"><p>No videos yet.</p><p class="muted small">Start with an idea. The studio walks you through research, script, hook, draft voice, art, storyboard, draft film, review and the final-voice plan.</p></div>`}`;
}
function newProject() {
  return `<div class="flowhead"><a class="back" href="#/" aria-label="Back">‹</a><span class="t">New video</span></div>
  <div class="panel"><label class="stack"><span class="small muted">Your idea</span><textarea id="idea" placeholder="What is the video about?"></textarea></label>
  <label class="stack"><span class="small muted">Short title</span><input id="title" placeholder="e.g. Rolex Oyster"></label>
  <span class="small muted">Brand</span>
  <div class="choice"><button data-brand="timekeeper" aria-pressed="false"><b>Time Keeper</b><span class="small muted">Watches · paper documentary · ElevenLabs final voice</span></button>
  <button data-brand="diabetes-history" aria-pressed="false"><b>Diabetes History</b><span class="small muted">Science history · paper-cut series</span></button></div>
  <button class="primary big" id="createBtn">Create project</button></div>`;
}
// ------------------------------------------------------------------ project overview (progress dashboard)
const pill = (s) => { const [c, i, l] = STATE[s] || STATE.not_started; return `<span class="pill ${c}">${i} ${l}</span>`; };
function steps() {
  return `<ol class="steps" aria-label="Steps">${P.steps.map((s, i) => `<li class="${s.state} ${s.id === P.stage ? 'now' : ''}" data-step="${s.id}"><a href="#/p/${PID}/${s.id}">
    <span class="n">${s.state === 'approved' ? '✓' : i + 1}</span><span class="l">${esc(s.name)}<span class="st">${(STATE[s.state] || STATE.not_started)[2]}</span></span></a></li>`).join('')}</ol>`;
}
function fmtS(s) { if (s == null) return '—'; s = Math.round(s); return s >= 60 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${s} s`; }
function runRow(r) {
  const pct = r.units_total ? Math.round(100 * r.units_done / r.units_total) : 0;
  return `<div class="stack" style="gap:4px"><div class="row between small"><span>${esc(r.task)}</span><span class="muted">${r.units_done}/${r.units_total} · ${fmtS(r.elapsed_s)}${r.state === 'running' ? (r.eta_s != null ? ` · about ${fmtS(r.eta_s)} left` : ` · no estimate (${esc(r.eta_reason)})`) : ''}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function overview() {
  const next = P.steps.find((s) => s.id === P.stage);
  const id = P.identity, vp = P.voice_profile;
  return `<div class="row between"><div class="stack" style="gap:2px"><h2 id="ptitle">${esc(P.title)}</h2><span class="small muted">${esc(id.brand_name)} · ${esc(P.idea)}</span></div></div>
  ${P.latest_render ? `<div class="panel" id="homefilm"><div class="row between"><h3>Latest draft · ${esc(P.latest_render.id)}</h3><span class="pill s-wait">DRAFT</span></div>
    ${filmTag(P.latest_render)}<span class="small muted">${fmtS(P.latest_render.seconds)} · storyboard v${P.latest_render.storyboard_v} · ${P.latest_render.decision ? esc(P.latest_render.decision) : '<a href="#/p/' + PID + '/draft">not decided yet ›</a>'}</span></div>` : ''}
  ${steps()}
  <a href="#/p/${PID}/${P.stage}"><button class="primary big" id="nextBtn">Next: ${esc(next.name)} ›</button></a>

    if (!y) { out.push(`<div><span class="mono tiny">${esc(id)}</span> <del>${ar(x.text)}</del></div>`); continue; }

    const wa = x.text.split(/\s+/), wb = y.text.split(/\s+/); let i = 0; while (i < wa.length && wa[i] === wb[i]) i++;

       ${c.versions.length > 1 ? `<div class="row tiny">${c.versions.map((x) => `<a href="#" data-full="${esc(x.stills[0])}" data-group="${esc(c.id)}">v${x.v}${x.status ? ' ' + esc(x.status) : ''}</a>`).join(' · ')}</div>` : ''}

    ${g.items.map((i) => `<a class="item" href="#/p/${PID}/${esc(i.href)}">${i.blocker ? '<span class="pill s-bad">■</span>' : i.wait ? '<span class="pill s-proc">◌</span>' : i.severity ? `<span class="pill v-${esc(i.severity)}">${esc(i.severity[0])}</span>` : '<span class="pill s-wait">●</span>'}<span>${esc(i.what)}</span></a>`).join('')}</div>`).join('')
    : '<div class="panel"><p>Nothing is waiting for you.</p></div>'}`;
}
function history() {
  return `<div class="flowhead"><a class="back" href="#/p/${PID}" aria-label="Back">‹</a><span class="t">History</span></div>
  <div class="panel"><span class="small muted">Every change is a new event. Nothing is overwritten.</span><ul class="hist" id="hist">${[...P.history].reverse().map((h) => `<li><span class="mono tiny">#${h.seq} ${esc(h.at.replace('T', ' ').slice(0, 19))}</span> <span class="tiny muted">${esc(h.actor)}</span> ${esc(h.summary)}</li>`).join('')}</ul></div>`;
}
// ------------------------------------------------------------------ sheets, viewer, playback
function openSheet(html) { $('#sheetbox').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet() { $('#sheet').hidden = true; $('#sheetbox').innerHTML = ''; }
let VIEW = { list: [], i: 0 };
function openViewer(rel, group) {
  const imgs = $$(`[data-group="${CSS.escape(group)}"]`).map((e) => e.dataset.full);
  VIEW = { list: [...new Set(imgs)], i: Math.max(0, [...new Set(imgs)].indexOf(rel)) }; showView(); $('#viewer').hidden = false;
}
function showView() { $('#vimg').src = F(PID, VIEW.list[VIEW.i]); $('#vpos').textContent = `${VIEW.i + 1} / ${VIEW.list.length}`; $('#vcap').textContent = VIEW.list[VIEW.i].split('/').pop(); }
function stopPlay() { play.audio.pause(); play.stopAt = null; cancelAnimationFrame(play.raf); $$('.wd.now').forEach((e) => e.classList.remove('now')); }
function playTake(tid, from = 0, to = null) {
  stopPlay();
  const t = P.voice.takes[tid], a = play.audio;
  a.dataset.take = tid; play.stopAt = to; play.from = from;
  const tick = () => {
    const ct = a.currentTime;
    const svg = $(`[data-wave="${CSS.escape(tid)}"]`);
    if (svg) { const x = ct / t.seconds * 800; const ph = svg.querySelector('.ph'); ph.setAttribute('x1', x); ph.setAttribute('x2', x); }
    $$(`[data-vw="${CSS.escape(tid)}"]`).forEach((b) => { const w = t.words[+b.dataset.wi]; b.classList.toggle('now', ct >= w.s && ct < w.e); });
    if (play.stopAt != null && ct >= play.stopAt) { a.pause(); proofMark(tid, ct - play.from, false, true); return; }
    if (!a.paused) play.raf = requestAnimationFrame(tick);
  };
  const start = () => { a.currentTime = from; a.play().then(() => { play.raf = requestAnimationFrame(tick); }).catch((e) => toast('Could not play: ' + e.message, true)); };
  if (!a.src.endsWith(t.audio)) { a.src = F(PID, t.audio); a.addEventListener('loadedmetadata', start, { once: true }); a.load(); }
  else start();
}
let LASTT = { id: null, t: 0 };
function heardTick(id, el) {               // count only continuous playback at up to 2x; a jump (seek) counts nothing
  const p = play.proof[id] ||= { played_s: 0, listened_s: 0, ended: false };
  const t = el.currentTime; if (LASTT.id === id && !el.paused && el.playbackRate <= 2.01) { const dt = t - LASTT.t; if (dt > 0 && dt < 0.6) p.listened_s += dt; }
  LASTT = { id, t }; return p;
}
play.audio.addEventListener('timeupdate', () => { const tid = play.audio.dataset.take; if (!tid) return; heardTick(tid, play.audio); if (play.stopAt == null) proofMark(tid, play.audio.currentTime, false); });
play.audio.addEventListener('seeking', () => { LASTT = { id: null, t: 0 }; });
play.audio.addEventListener('ended', () => { const tid = play.audio.dataset.take; if (tid) proofMark(tid, play.audio.duration, true); $$('.wd.now').forEach((e) => e.classList.remove('now')); });
function proofMark(id, s, ended, word) {
  const p = play.proof[id] ||= { played_s: 0, ended: false };
  if (!word) p.played_s = Math.max(p.played_s, s || 0);
  p.ended = p.ended || ended; if (word) p.word = true;
  const T = P && P.voice.takes[id]; const full = T && p.listened_s >= 0.8 * T.seconds;
  const el = $(`[data-heard="${CSS.escape(id)}"]`); if (el) el.textContent = full ? `✓ heard (${(p.listened_s || 0).toFixed(1)} s)` : `heard ${(p.listened_s || 0).toFixed(1)} s of ${T ? T.seconds.toFixed(1) : '?'} s`;
  const wh = $('#wheard'); if (wh && word) { wh.textContent = '✓ played'; const b = $('#vsave'); if (b && $('[data-vk][aria-pressed="true"]')) b.disabled = false; }
}
function afterRender(step) {
  for (const v of $$('video[data-film]')) { { const id = 'film-' + v.dataset.film;
    v.addEventListener('timeupdate', () => { const p = heardTick(id, v); const el = $(`[data-heard="${id}"]`); if (el) el.textContent = `watched ${p.listened_s.toFixed(0)} s of ${(v.duration || 0).toFixed(0)} s`; });
    v.addEventListener('seeking', () => { LASTT = { id: null, t: 0 }; }); } }
}
// ------------------------------------------------------------------ clicks
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button, a, img, svg.wave'); if (!t) return;
  const d = t.dataset;
  if (d.full) { ev.preventDefault(); return openViewer(d.full, d.group || 'x'); }
  if ('vclose' in d) return ($('#viewer').hidden = true);
  if ('vprev' in d) { VIEW.i = (VIEW.i - 1 + VIEW.list.length) % VIEW.list.length; return showView(); }
  if ('vnext' in d) { VIEW.i = (VIEW.i + 1) % VIEW.list.length; return showView(); }
  if ('close' in d) return closeSheet();
  if (d.brand) { $$('[data-brand]').forEach((b) => b.setAttribute('aria-pressed', b === t)); return; }
  if (t.id === 'createBtn') {
    const brand = $('[data-brand][aria-pressed="true"]')?.dataset.brand;
    PID = null; const j = await api('create_project', { title: $('#title').value, idea: $('#idea').value, brand });
    if (j) { toast('Project created'); location.hash = `#/p/${j.project}`; } return;
  }
  if (d.voice) { const j = await api('set_voice', { voice: d.voice }); if (j) { toast(`Final voice: ${j.result.voice.status}`); refresh(); } return; }
  if (d.resume) { const j = await api('resume', { job: d.resume }); if (j) { toast('Resumed'); refresh(); } return; }
  if (d.research) { const j = await api('research_decision', { decision: d.research, note: d.research === 'changes_requested' ? prompt('What should change?') || '' : '' }); if (j) refresh(); return; }
  if (d.sw != null && d.wi != null && t.classList.contains('wd') || d.suggest != null) { const sv = P.scripts.find((s) => s.v === CUR.v); if (sv.status !== 'draft') return toast('This version is ' + sv.status + '. Flag words on the latest draft.', true); return flagSheet(d.sw, +d.wi, d.suggest); }
  if (d.fk) { $$('[data-fk]').forEach((b) => b.setAttribute('aria-pressed', b === t)); return; }
  if (d.fsave) { const [lid, wi] = d.fsave.split(':'); const kind = $('[data-fk][aria-pressed="true"]')?.dataset.fk; if (!kind) return toast('Choose what is wrong', true);
    const j = await api('flag_word', { v: CUR.v, line: lid, wi: +wi, kind, note: $('#fnote').value, replacement: $('#frepl').value.trim() }); if (j) { closeSheet(); toast('Correction requested'); refresh(); } return; }
  if (d.apply) { const repl = $(`[data-repl="${CSS.escape(d.apply)}"]`).value.trim(); const j = await api('apply_correction', { flag: d.apply, replacement: repl }); if (j) { toast(`New version v${j.result.v}`); location.hash = `#/p/${PID}/script/${j.result.v}`; await refresh(); } return; }
  if (d.dismiss) { const j = await api('dismiss_flag', { flag: d.dismiss, note: prompt('Why dismiss?') || '' }); if (j) refresh(); return; }
  if ('compare' in d && t.tagName === 'BUTTON') { const a = +$('#cmpA').value, b = +$('#cmpB').value; $('#cmpOut').innerHTML = wordDiff(P.script_versions[a], P.script_versions[b]); return; }
  if (d.sdec) { const note = d.sdec === 'rejected' ? (prompt('Why reject? (kept with the version)') || '') : ''; if (d.sdec === 'rejected' && !note) return toast('Say why', true);
    const sv = P.scripts.find((x) => x.v === CUR.v); const crit = sv.checks.filter((c) => c.severity === 'critical');
    if (d.sdec === 'approved' && crit.length) {
      const why = prompt(`v${CUR.v} has ${crit.length} critical finding(s):\n${crit.map((c) => '• ' + c.detail).join('\n').slice(0, 600)}\n\nTo approve anyway, write why the check is wrong here (kept with the version). Cancel to go back.`);
      if (!why) return toast('Not approved: fix the line or explain why the check is wrong', true);
      const j = await api('script_decision', { v: CUR.v, decision: 'approved', override: true, note: why }); if (j) { toast(`v${CUR.v} approved over the finding (reason kept)`); refresh(); } return; }
    const j = await api('script_decision', { v: CUR.v, decision: d.sdec, note }); if (j) { toast(`v${CUR.v} ${d.sdec}`); refresh(); } return; }
  if (d.run) { const args = d.sceneRun ? { scene: d.sceneRun } : {}; const j = await api(d.run, args); if (j) { toast('Started'); refresh(); } return; }
  if (d.hsel) { const j = await api('hook_select', { hook: d.hsel }); if (j) { toast(`Hook ${d.hsel} chosen` + (j.result.script ? ` → script v${j.result.script.v} to approve` : '')); refresh(); } return; }
  if (d.deliver) { const line = $('input[name="payoff"]:checked')?.value || null; if (d.deliver === 'delivered' && !line) return toast('Choose the line that pays it off', true);
    const j = await api('hook_delivery', { decision: d.deliver, line }); if (j) refresh(); return; }
  if (d.tplay) return playTake(d.tplay);
  if (d.vw) { const tk = P.voice.takes[d.vw], w = tk.words[+d.wi]; playTake(d.vw, Math.max(0, w.s - 0.04), w.e + 0.06); return vflagSheet(d.vw, +d.wi); }
  if (d.wplay) { const [tid, wi] = d.wplay.split(':'); const w = P.voice.takes[tid].words[+wi]; return playTake(tid, Math.max(0, w.s - 0.04), w.e + 0.06); }
  if (d.vk) { $$('[data-vk]').forEach((b) => b.setAttribute('aria-pressed', b === t)); const tid = $('#vsave').dataset.vsave.split(':')[0]; if (play.proof[tid]?.word) $('#vsave').disabled = false; return; }
  if (d.vsave) { const [tid, wi] = d.vsave.split(':'); const kind = $('[data-vk][aria-pressed="true"]')?.dataset.vk;
    const j = await api('voice_flag', { take: tid, wi: +wi, kind, note: $('#vnote').value, respell: $('#vrespell').value.trim(), played: !!play.proof[tid]?.word }); if (j) { closeSheet(); toast('Word flagged'); refresh(); } return; }
  if (d.vfix) { const r = $(`[data-respell="${CSS.escape(d.vfix)}"]`).value.trim(); const j = await api('voice_fix', { vflag: d.vfix, respell: r }); if (j) { toast('Re-recording that line only'); refresh(); } return; }
  if (d.tdec) { const pr = play.proof[d.t] || {}; const j = await api('take_decision', { take: d.t, decision: d.tdec, playback: { listened_s: +(pr.listened_s || 0).toFixed(2) } }); if (j) { toast(`Take ${d.tdec}`); refresh(); } return; }
  if (d.asel) { const j = await api('art_select', { concept: d.asel }); if (j) { toast('Selected — not approved yet'); refresh(); } return; }
  if (d.amod) return modSheet(d.amod);
  if (d.mod) { t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true'); return; }
  if (d.msave) { const ch = {}; $$('[data-mod][aria-pressed="true"]').forEach((b) => { const [k, v] = b.dataset.mod.split(':'); ch[k] = v; });
    const j = await api('art_modify', { concept: d.msave, changes: ch, note: $('#mnote').value }); if (j) { closeSheet(); toast(Object.keys(ch).length ? 'Revision requested: drawing v' + (P.art.concepts[d.msave].versions.length + 1) : 'Note sent to the art operator (no automatic change for a free-text note)'); refresh(); } return; }
  if (d.aok) { const j = await api('art_decision', { concept: d.aok, version: +d.av, decision: 'approved' }); if (j) { toast(`Approved v${d.av}`); refresh(); } return; }
  if (d.arej) { const j = await api('art_decision', { concept: d.arej, version: +d.av, decision: 'rejected', note: prompt('Why reject? (optional)') || '' }); if (j) { toast('Rejected'); refresh(); } return; }
  if (d.awd) { const note = prompt('Why withdraw the approval? (kept in history)') || ''; if (!note) return toast('Say why', true);
    const j = await api('art_decision', { concept: d.awd, version: +d.av, decision: 'withdrawn', note }); if (j) { toast('Approval withdrawn'); refresh(); } return; }
  if (d.sbdec) { const note = d.sbdec === 'changes_requested' ? (prompt('What should change?') || '') : '';
    const j = await api('storyboard_decision', { v: +d.sbv, decision: d.sbdec, note }); if (j) { toast('Storyboard ' + d.sbdec); refresh(); } return; }
  if ('build' in d) { const j = await api('build_storyboard'); if (j) { toast(`Storyboard v${j.result.v}`); refresh(); } return; }
  if (d.rdec) { const pr = play.proof['film-' + d.r] || {}; const j = await api('render_decision', { render: d.r, decision: d.rdec, note: d.rdec === 'changes_requested' ? prompt('What should change?') || '' : '', playback: { listened_s: +(pr.listened_s || 0).toFixed(2) } }); if (j) refresh(); return; }
  if (d.fdec) { const note = $(`[data-fnote="${CSS.escape(d.f)}"]`).value; const j = await api('finding_decision', { finding: d.f, decision: d.fdec, note }); if (j) { toast(d.fdec === 'accepted' ? 'Correction task created' : 'Dismissed (kept in history)'); refresh(); } return; }
  if (d.fixdone) { const j = await api('fix_done', { task: d.fixdone, note: 'done' }); if (j) refresh(); return; }
  if ('gvoice' in d) { const j = await api('authorize_voice', { note: $('#gvnote').value }); if (j) { toast('Voice authorized for this film'); refresh(); } return; }
  if (d.term) { const j = await api('term_decision', { surface: d.term, decision: d.tdecision }); if (j) refresh(); return; }
  if ('gbudget' in d) { const j = await api('set_budget', { characters: parseInt($('#gbudget').value, 10) }); if (j) { toast('Budget set'); refresh(); } return; }
  if ('gplan' in d) { const j = await api('run_gate_plan'); if (j) { toast('Plan built'); refresh(); } return; }
  if (d.gauth) { const j = await api('gate_authorize', { plan: d.gauth, confirm_text: $('#gconfirm').value }); if (j) { toast('Authorized'); } refresh(); return; }
  if ('gen' in d) { await api('final_generate'); refresh(); return; }
  if (t.closest('svg.wave')) { const svg = t.closest('svg.wave'); const tid = svg.dataset.wave; const r = svg.getBoundingClientRect(); playTake(tid, (ev.clientX - r.left) / r.width * P.voice.takes[tid].seconds); }
});
// live sync: another session (phone, desktop, a job) changed the project -> refresh when idle, else offer it
let LAST_INPUT = 0; ['pointerdown', 'keydown'].forEach((e) => document.addEventListener(e, () => (LAST_INPUT = Date.now()), true));
async function liveSync() {
  if (!PID || !P || BUSY || Date.now() - LAST_INPUT < 4000) return;
  try { const j = await (await fetch('/api/studio')).json(); const me = j.projects.find((x) => x.id === PID);
    if (!me || me.updated === P.updated) return;
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const playing = $$('video').some((v) => !v.paused) || !play.audio.paused;
    if (typing || !$('#sheet').hidden || playing) { if (!$('#livechip')) document.body.insertAdjacentHTML('beforeend', '<button id="livechip" class="livechip primary" data-livesync>New changes · refresh</button>'); return; }
    const y = scrollY; P = await load(PID); render(); scrollTo(0, y);
  } catch (e) {}
}
setInterval(liveSync, 6000); window.addEventListener('focus', liveSync);
document.addEventListener('click', async (ev) => { if (ev.target.closest('[data-livesync]')) { $('#livechip')?.remove(); const y = scrollY; P = await load(PID); render(); scrollTo(0, y); } });
go();
</script>
