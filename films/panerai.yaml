# Panerai, told in order and in four acts: the shop on the bridge (1860); the light and its human price (1915–1928);
# the secret mission (1936–1941); after the war (1949–1993). Each act leads into the next.
# Each line has its story world (`set`, director/studio/sets.py) and, where the story carries a feeling, its `mood`.
# A historical event (`event: true`) is shown with a historical photograph; a change (`change: true`) says why (`because`).
# Every line names its sources (numbers refer to `sources`). Years are written as words in `say` so the voice reads them.
# A claim the sources only believe (the watches on the divers' wrists that night) is said as a belief: «يُقال».
title: بانيراي — ضوء في عتمة البحر
brand: timekeeper
seed: panerai
theme: tk-bone
sources:
  - "[1] Panerai — Wikipedia (1860 Florence; Radiomir radium sights; Rolex made the watches, Panerai the dials; ~1,600 watches 1935–1970; civilian market 1993): https://en.wikipedia.org/wiki/Panerai"
  - "[2] Phillips auction notes on the Radiomir (1936 prototypes for the Italian Navy; ref. 3646 made by Rolex; used by the navy's combat swimmers): https://www.phillips.com/detail/panerai/97925"
  - "[3] Espacenet GB191512270A (Panerai radium luminous sights patent, 1915): https://worldwide.espacenet.com/patent/search?q=pn%3DGB191512270A"
  - "[4] Radium Girls — Wikipedia (young women dial painters told the paint was harmless, lip-pointing brushes, tooth loss, anaemia, 'radium jaw'; more than 50 dead by 1927; five sued, settled in 1928, all five dead by the 1930s): https://en.wikipedia.org/wiki/Radium_Girls"
  - "[5] Raid on Alexandria (1941) — Wikipedia (19 Dec 1941, Decima Flottiglia MAS, three SLC 'maiali', six men, HMS Valiant and HMS Queen Elizabeth put out of action): https://en.wikipedia.org/wiki/Raid_on_Alexandria_(1941)"
  - "[6] HMS Queen Elizabeth (1913) — Wikipedia (the Royal Navy kept up the illusion of full operational status while she was repaired): https://en.wikipedia.org/wiki/HMS_Queen_Elizabeth_(1913)"
  - "[7] Worn & Wound, Military Watches of the World: Italy (Panerai had no watchmaking facility and turned to Rolex; 'highly likely' early Panerai saw service in the Alexandria raid): https://wornandwound.com/military-watches-of-the-world-italy-pt-i/"
  - "[8] Luminor (tritium) replaced radium because radium was too hazardous; the crown-protecting bridge, 1950s: https://www.watchfinder.com/articles/feature-the-incredible-deadly-story and https://wristreview.com/brief-history-panerai-luminor/"
  - "[9] Panerai, History (its own account: the first shop, on the Ponte alle Grazie, Florence, 1860): https://www.panerai.com/en/about-panerai/history.html"
  - "[10] Luminor name registered 1949 (tritium); radium dials on navy watches until the mid-1960s: https://wristreview.com/brief-history-panerai-luminor/"
photos:
  first_shop_bridge: {query: Alinari Ponte Rubaconte Ponte alle Grazie}
  radium_painters: {query: USRadiumGirls Argonne1}
  undark_ad: {query: Undark Radium Girls advertisement 1921}
  slc_torpedo: {query: Siluro lenta corsa Taranto}
  queen_elizabeth_1942: {query: HMS QUEEN ELIZABETH FLIES ENSIGN HALF MAST}
  crown_guard: {query: CROWN GUARD 29728851024}
  luminor_glow: {query: LUMINOR 30075754506}
  luminor_close: {query: PANERAI 29802698304}
lines:
  # ----------------------------------------------------------------------------------- act 1: the shop on the bridge
  - id: l1        # [1][2][4]
    set: workshop
    mood: mystery
    text: ساعة وُلدت من ضوء قاتل، وعاشت سرًّا عسكريًا لعقود. هذه قصة بانيراي.
    template: kinetic_type
    params: {lines: [{text: ضوء قاتل…, size: 84, in: slam}, {text: وسرّ عسكري, size: 70, at: 1.4, in: slam}], y: 470,
             stamp: {text: بانيراي, at: 2.8, y: 790, color: "#E8DCC0"}}
  - id: l2        # [1][9]
    set: florence
    text: تبدأ القصة في فلورنسا، عام 1860.
    say: تبدأ القصة في فلورنسا، عام ألفٍ وثمانمئةٍ وستين.
    template: city_zoom
    banner: فلورنسا · 1860
    params: {city: florence, sub: إيطاليا · 1860}
  - id: l3        # [9]
    event: true
    text: على هذا الجسر في فلورنسا، افتتح جوفاني بانيراي أول محل له.
    template: archive_photo
    banner: جسر ألّي غراتسيه
    params: {asset: first_shop_bridge, desc: Ponte alle Grazie 19th century, card: الجسر الذي كان عليه أول محل}
  # ----------------------------------------------------------------------------------- act 2: the light and its price
  - id: l4        # [1][3]
    set: radium
    mood: wonder
    event: true
    no_photo: no free-licence photograph of the first Radiomir exists; the patent is cited instead
    change: true
    because: كانت البحرية تحتاج أن ترى أجهزتها في ظلام الليل
    text: ومع الوقت صارت العائلة تصنع أدوات دقيقة للبحرية. ولتُرى في الليل، طوّرت في الحرب العالمية الأولى مسحوقًا بالراديوم يتوهّج، سمّته راديومير.
    template: kinetic_type
    banner: راديومير · 1915
    params: {lines: [{text: راديومير, size: 110}, {text: ضوء يُرى في الظلام, size: 56, at: 0.8}], y: 480}
  - id: l5        # [4]
    event: true
    mood: sadness
    text: وفي أمريكا، كان الضوء نفسه يُرسم على الساعات بأيدي عاملات شابّات.
    template: archive_photo
    banner: عاملات الراديوم
    params: {asset: radium_painters, desc: radium dial painters 1922, card: نيوجيرسي · نحو 1922}
  - id: l6        # [4]
    event: true
    mood: sadness
    text: قيل لهنّ إنه آمن، فكنّ يبلّلن الفرشاة بشفاههنّ.
    template: archive_photo
    banner: «يخدمك بأمان»
    params: {asset: undark_ad, desc: Undark advertisement 1921, card: إعلان طلاء الراديوم · 1921, move: out, pos: '50% 30%'}
  - id: l7        # [4]
    set: radium
    mood: sadness
    text: فتساقطت أسنانهنّ، وتآكلت فكوكهنّ، ومات أكثر من خمسين منهنّ.
    template: kinetic_type
    banner: ثمن الضوء
    params: {lines: [{text: أكثر من 50, size: 120}, {text: رحلن بحلول 1927, size: 56, at: 0.8}], y: 480}
  - id: l8        # [4]
    event: true
    mood: sadness
    text: خمسٌ منهنّ حصلن على تعويض عام 1928… ثم رحلن جميعًا في الثلاثينيات.
    say: خمسٌ منهنّ حصلن على تعويض عام ألفٍ وتسعمئةٍ وثمانيةٍ وعشرين… ثم رحلن جميعًا في الثلاثينيات.
    template: newspaper_card
    banner: القضية · 1928
    params: {header: '1928', title: خمس عاملات ضد الشركة, body: حصلن على تعويض… ورحلن جميعًا في الثلاثينيات}
  # ----------------------------------------------------------------------------------- act 3: the secret mission
  - id: l9        # [2][9]
    set: underwater
    text: وفي 1936 طلبت البحرية ساعة لغطّاسيها المقاتلين، تُقرأ في عتمة البحر.
    say: وفي عام ألفٍ وتسعمئةٍ وستةٍ وثلاثين طلبت البحرية ساعة لغطّاسيها المقاتلين، تُقرأ في عتمة البحر.
    template: animated_timeline
    banner: طلب البحرية
    params: {events: [{year: '1860', label: محل على الجسر}, {year: '1915', label: راديومير}, {year: '1928', label: قضية العاملات}, {year: '1936', label: ساعة للغطّاسين, hero: true}]}
  - id: l10       # [1][7]
    set: workshop
    change: true
    because: لم تكن بانيراي تملك مصنعًا للساعات، وكانت رولكس تملك علبة أويستر المقاومة للماء
    text: ولأن بانيراي لم تكن تملك مصنعًا للساعات، لجأت إلى رولكس، صاحبة علبة أويستر المقاومة للماء.
    template: spec_card
    banner: لماذا رولكس؟
    params: {title: ساعات البحرية الأولى, rows: [{label: العلبة, value: رولكس}, {label: الآلية, value: رولكس}, {label: الميناء المضيء, value: بانيراي}],
             source: 'المصدر: ويكيبيديا · فيليبس · Worn & Wound', y: 470}
  - id: l11       # [5]
    event: true
    mood: tension
    text: وكان الغطّاسون يركبون طوربيدات بطيئة يسمّونها الخنازير، ويتسلّلون بها ليلًا إلى موانئ العدو.
    template: archive_photo
    banner: الطوربيد البشري
    params: {asset: slc_torpedo, desc: SLC human torpedo in a museum, card: طوربيد «الخنزير» · متحف في تارانتو}
  - id: l12       # [5]
    mood: tension
    text: في ديسمبر 1941 تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    say: في ديسمبر عام ألفٍ وتسعمئةٍ وواحدٍ وأربعين تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    template: city_zoom
    banner: الإسكندرية · 1941
    params: {city: alexandria, sub: ليلة 19 ديسمبر 1941}
  - id: l13       # [5][6]
    event: true
    mood: mystery
    text: أُسر الستة. لكن البريطانيين أخفوا الضرر، كي لا يعرف أحد حجم ضعفهم.
    template: archive_photo
    banner: البارجة كوين إليزابيث
    params: {asset: queen_elizabeth_1942, desc: HMS Queen Elizabeth at Alexandria 1942, card: الإسكندرية · 20 يناير 1942}
  - id: l14       # [7]
    set: underwater
    mood: mystery
    text: ويُقال إن ساعات بانيراي كانت على معاصمهم تلك الليلة.
    template: product_reveal
    banner: يُقال…
    params: {asset: luminor_glow, desc: Luminor Marina, name: لومينور مارينا · طراز حديث}
  # ----------------------------------------------------------------------------------- act 4: after the war
  - id: l15       # [8][10]
    set: radium
    mood: joy
    change: true
    because: الراديوم كان خطرًا، والتريتيوم إشعاعه أضعف بكثير
    text: وبعد الحرب، ولأن الراديوم قاتل، سجّلت بانيراي عام 1949 مادة أخفّ إشعاعًا بكثير، سمّتها لومينور.
    say: وبعد الحرب، ولأن الراديوم قاتل، سجّلت بانيراي عام ألفٍ وتسعمئةٍ وتسعةٍ وأربعين مادة أخفّ إشعاعًا بكثير، سمّتها لومينور.
    template: kinetic_type
    banner: لومينور · 1949
    params: {lines: [{text: لومينور, size: 120}, {text: نهاية الضوء القاتل, size: 54, at: 0.7}], y: 500}
  - id: l16       # [8]
    set: workshop
    change: true
    because: كي يبقى التاج مضغوطًا على مانع التسرّب فلا يدخل الماء
    text: وفي الخمسينيات أضافت جسرًا يضغط التاج ويُحكم إغلاقه، كي لا يتسرّب الماء إلى الساعة.
    template: product_macro
    banner: لماذا الجسر؟
    params: {asset: crown_guard, desc: crown guard}
  - id: l17       # [1]
    set: archive
    mood: joy
    text: صُنع منها حتى 1970 نحو 1600 ساعة فقط، ثم في 1993 خرجت من السرّية إلى الناس.
    say: صُنع منها حتى عام ألفٍ وتسعمئةٍ وسبعين نحو ألفٍ وستمئة ساعة فقط، ثم في عام ألفٍ وتسعمئةٍ وثلاثةٍ وتسعين خرجت من السرّية إلى الناس.
    template: animated_timeline
    banner: من السرّية إلى الناس
    params: {events: [{year: '1949', label: لومينور}, {year: '1970', label: نحو 1600 ساعة فقط}, {year: '1993', label: للجمهور أول مرة, hero: true}]}
  - id: l18       # —
    set: underwater
    mood: wonder
    text: ساعة وُلدت من ضوء قاتل في عتمة البحر… وصارت اليوم من أشهر الساعات في العالم.
    template: product_reveal
    params: {asset: luminor_close, desc: Luminor Marina, name: بانيراي, name_size: 60}
