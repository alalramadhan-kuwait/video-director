# Panerai, told in order and in four acts: the shop on the bridge (1860); the light and its human price (1915–1928);
# the secret mission (1936–1941); after the war (1949–1993). Each act leads into the next.
# Every scene has a related photo of the time it speaks of (`year:` on each photo), shows only what is said in it, and every change of scene is led into by its first words.
# Each line has its story world (`set`, director/studio/sets.py) and, where the story carries a feeling, its `mood`.
# A historical event (`event: true`) is shown with a historical photograph; a change (`change: true`) says why (`because`).
# Every line names its sources (numbers refer to `sources`). Years are written as words in `say` so the voice reads them.
# A claim the sources only believe (the watches on the divers' wrists that night) is said as a belief: «يُقال».
title: بانيراي — ضوء في عتمة البحر
brand: timekeeper
seed: panerai
theme: tk-bone
sources:
  - "[1] Panerai — Wikipedia (1860 Florence; Radiomir radium sights; Rolex made the watches, Panerai the dials; ~1,600 watches 1935–1970; civilian market 1993): https://en.wikipedia.org/wiki/Panerai"
  - "[2] Phillips auction notes on the Radiomir (1936 prototypes for the Italian Navy; ref. 3646 made by Rolex; used by the navy's combat swimmers): https://www.phillips.com/detail/panerai/97925"
  - "[3] Espacenet GB191512270A (Panerai radium luminous sights patent, 1915): https://worldwide.espacenet.com/patent/search?q=pn%3DGB191512270A"
  - "[4] Radium Girls — Wikipedia (young women dial painters told the paint was harmless, lip-pointing brushes, tooth loss, anaemia, 'radium jaw'; more than 50 dead by 1927; five sued, settled in 1928, all five dead by the 1930s): https://en.wikipedia.org/wiki/Radium_Girls"
  - "[5] Raid on Alexandria (1941) — Wikipedia (19 Dec 1941, Decima Flottiglia MAS, three SLC 'maiali', six men, HMS Valiant and HMS Queen Elizabeth put out of action): https://en.wikipedia.org/wiki/Raid_on_Alexandria_(1941)"
  - "[6] HMS Queen Elizabeth (1913) — Wikipedia (the Royal Navy kept up the illusion of full operational status while she was repaired): https://en.wikipedia.org/wiki/HMS_Queen_Elizabeth_(1913)"
  - "[7] Worn & Wound, Military Watches of the World: Italy (Panerai had no watchmaking facility and turned to Rolex; 'highly likely' early Panerai saw service in the Alexandria raid): https://wornandwound.com/military-watches-of-the-world-italy-pt-i/"
  - "[8] Luminor (tritium) replaced radium because radium was too hazardous; the crown-protecting bridge, 1950s: https://www.watchfinder.com/articles/feature-the-incredible-deadly-story and https://wristreview.com/brief-history-panerai-luminor/"
  - "[9] Panerai, History (its own account: the first shop, on the Ponte alle Grazie, Florence, 1860): https://www.panerai.com/en/about-panerai/history.html"
  - "[11] Undark — Wikipedia (radium paint made by the U.S. Radium Corporation, Orange, New Jersey, 1917–1926; radium and zinc paint first mixed by William J. Hammer, 1902; a different product from Panerai's Radiomir): https://en.wikipedia.org/wiki/Undark"
  - "[12] Marie Curie discovered radium (with Pierre Curie, 1898): https://en.wikipedia.org/wiki/Radium"
  - "[13] US Patent 2,995,639, Giuseppe and Maria Panerai, filed 28 Aug 1957, granted 8 Aug 1961 (a device for a hermetically sealed box to be immersed under pressure); the drawing is public domain: US patent drawings are not subject to copyright (USPTO terms of use, https://www.uspto.gov/terms-use-uspto-websites): https://patents.google.com/patent/US2995639A"
  - "[14] Panerai diving instruments (depth gauge, compass, torch, knife, watch), probably 1940s–1960s: https://commons.wikimedia.org/wiki/File:Set_of_tools_for_scuba_diving_from_the_Italian_company_Panerai.jpg"
  - "[10] Luminor name registered 1949 (tritium); radium dials on navy watches until the mid-1960s: https://wristreview.com/brief-history-panerai-luminor/"
photos:
  # the opening: Panerai's own patent drawing (a real drawing from the archive, never an invented one), lines on blueprint
  panerai_patent_1961: {file: films/assets/panerai_patent_1961.png, year: 1961, licence: Public domain (US patent drawing),
                        credit: "G. & M. Panerai · US Patent 2,995,639 (1961) · public domain", page: "https://patents.google.com/patent/US2995639A"}
  panerai_tools: {query: Set of tools for scuba diving from the Italian company Panerai, year: 1950}
  panerai_gauge: {query: Panerai depth gauge for scuba diving, year: 1950}
  first_shop_bridge: {query: Alinari Ponte Rubaconte Ponte alle Grazie, year: 1870}
  marie_curie: {query: Marie Curie portrait 1900, year: 1900, person: ماري كوري}
  radium_painters: {query: USRadiumGirls Argonne1, year: 1922}
  undark_ad: {query: Undark Radium Girls advertisement 1921, year: 1921}
  grace_fryer: {query: Grace Fryer, year: 1925, person: غريس فراير}
  mas_plate_1936: {query: Decima Flotiglia MAS remnants National War Museum Malta MAS 452 plate, year: 1936}
  rolex_oyster_1926: {query: Rolex Oyster del 1926 primo orologio impermeabile, year: 1926}
  slc_torpedo: {query: Siluro lenta corsa Taranto, year: 1941}
  slc_compass: {query: Decima Flotiglia MAS remnants Malta SLC compass, year: 1941}
  queen_elizabeth_1942: {query: HMS QUEEN ELIZABETH FLIES ENSIGN HALF MAST, year: 1942}
  egiziano_1956: {query: Egiziano panerai2, year: 1956}
  marina_militare_1990s: {query: Panerai Marina Militare 5218, year: 1995}
  crown_guard: {query: CROWN GUARD 29728851024, year: 2016}
  luminor_glow: {query: LUMINOR 30075754506, year: 2016}
  luminor_close: {query: PANERAI 29802698304, year: 2016}
lines:
  # ----------------------------------------------------------------------------------- act 1: the shop on the bridge
  - id: l1        # [1][2][4][13]
    mood: mystery
    text: قصة بانيراي… ساعة وُلدت من ضوء قاتل، وعاشت سرًّا عسكريًا، وتبدأ في مدينة واحدة.
    template: blueprint
    params: {asset: panerai_patent_1961, desc: Panerai patent drawing 1961, y: 560, reveal: 2.2,
             lines: [{text: ضوء قاتل…, size: 80, at: 2.4, y: 190}], stamp: {text: سرّ عسكري, at: 3.6, x: 470, y: 690, size: 70},
             card: رسم من براءة اختراع بانيراي · جهاز محكم تحت الماء}
  - id: l2        # [1][9]
    set: florence
    text: في فلورنسا، عام 1860.
    say: في فلورنسا، عام ألفٍ وثمانمئةٍ وستين.
    template: city_zoom
    banner: فلورنسا · 1860
    params: {city: florence, sub: عام 1860}
  - id: l3        # [9]
    event: true
    text: وهناك، على جسر ألّي غراتسيه، افتتح جوفاني بانيراي أول محل له للساعات.
    template: archive_photo
    banner: جسر ألّي غراتسيه
    params: {asset: first_shop_bridge, desc: Ponte alle Grazie 19th century, card: على هذا الجسر · أول محل}
  - id: l4        # [1][9]
    event: true
    text: ومن هذا المحل الصغير في فلورنسا كبرت العائلة، حتى صارت تصنع أدوات دقيقة للبحرية الإيطالية.
    template: archive_photo
    banner: أدوات بانيراي للبحرية
    params: {asset: panerai_tools, desc: Panerai diving instruments, print: true, w: 580, y: 580,
             card: بوصلة ومقياس عمق ومصباح · أدوات بانيراي من منتصف القرن العشرين}
  # ----------------------------------------------------------------------------------- act 2: the light and its price
  - id: l5        # [1][3][14]
    mood: tension
    text: لكن البحرية احتاجت أن ترى أجهزتها في عتمة الليل، وتحت الماء.
    template: archive_photo
    banner: أجهزة تُقرأ في العتمة
    params: {asset: panerai_gauge, desc: Panerai depth gauge, card: مقياس عمق من أجهزة بانيراي للبحرية, move: in, pos: '50% 0%'}
  - id: l5b       # [1][3][12]
    set: radium
    mood: wonder
    event: true
    change: true
    because: احتاجت البحرية أن ترى أجهزتها ليلًا
    text: فطوّرت بانيراي، من الراديوم الذي اكتشفته العالمة ماري كوري، مسحوقًا يتوهّج سمّته راديومير.
    template: archive_photo
    banner: راديومير · من راديوم ماري كوري
    params: {asset: marie_curie, desc: Marie Curie portrait 1900, card: ماري كوري · العالمة التي اكتشفت الراديوم, move: in, pos: '50% 30%'}
  - id: l6        # [4][11] (Undark, not Radiomir: the link is radium itself)
    event: true
    mood: sadness
    text: غير أن الراديوم نفسه أخفى سرًّا مظلمًا، ففي أمريكا كان طلاء آخر بالراديوم، اسمه أندارك، ترسمه عاملات شابّات على الساعات.
    template: archive_photo
    banner: عاملات الراديوم
    params: {asset: radium_painters, desc: radium dial painters 1922, card: طلاء أندارك · عاملات شابّات في أمريكا}
  - id: l7        # [4]
    event: true
    mood: sadness
    text: وقيل لهنّ إن الطلاء آمن، كما كانت الإعلانات تَعِد، فكنّ يبلّلن الفرشاة بشفاههنّ.
    template: archive_photo
    banner: إعلان طلاء أندارك
    params: {asset: undark_ad, desc: Undark advertisement 1921, card: الإعلانات تَعِد بأنه آمن, move: out, pos: '50% 30%'}
  - id: l8        # [4]
    set: radium
    mood: sadness
    photo: radium_painters
    text: ثم تساقطت أسنانهنّ، وتآكلت فكوكهنّ، ومات أكثر من خمسين بحلول 1927.
    say: ثم تساقطت أسنانهنّ، وتآكلت فكوكهنّ، ومات أكثر من خمسين بحلول عام ألفٍ وتسعمئةٍ وسبعةٍ وعشرين.
    template: kinetic_type
    banner: مات أكثر من خمسين
    params: {lines: [{text: أكثر من 50, size: 120}, {text: بحلول 1927, size: 56, at: 0.8}], y: 480}
  - id: l9        # [4]
    event: true
    mood: sadness
    text: وحين رفعت خمسٌ منهنّ قضية، ومنهنّ غريس فراير، حصلن على تعويض… لكنّهنّ رحلن جميعًا.
    template: archive_photo
    banner: غريس فراير
    params: {asset: grace_fryer, desc: Grace Fryer, card: واحدة من الخمس اللواتي رفعن القضية}
  # ----------------------------------------------------------------------------------- act 3: the secret mission
  - id: l10       # [2][4]
    set: underwater
    mood: tension
    photo: mas_plate_1936
    text: وبينما كان العالم يكتشف خطر الراديوم، طلبت البحرية الإيطالية عام 1936 ساعة لغطّاسيها المقاتلين.
    say: وبينما كان العالم يكتشف خطر الراديوم، طلبت البحرية الإيطالية عام ألفٍ وتسعمئةٍ وستةٍ وثلاثين ساعة لغطّاسيها المقاتلين.
    template: kinetic_type
    banner: طلب البحرية · 1936
    params: {lines: [{text: ساعة للغطّاسين, size: 92}, {text: البحرية الإيطالية · 1936, size: 52, at: 0.8}], y: 480}
  - id: l11       # [1][7]
    set: workshop
    change: true
    because: لم تكن بانيراي تملك مصنعًا للساعات
    photo: rolex_oyster_1926
    text: ولأن بانيراي لا تملك مصنعًا للساعات، لجأت إلى رولكس صاحبة ساعة أويستر المقاومة للماء، فصنعت رولكس العلبة والآلية، وصنعت بانيراي الميناء المضيء.
    template: spec_card
    banner: لماذا رولكس؟
    params: {title: صنعت رولكس وصنعت بانيراي, rows: [{label: العلبة, value: رولكس}, {label: الآلية, value: رولكس}, {label: الميناء المضيء, value: بانيراي}], y: 470}
  - id: l12       # [5]
    event: true
    mood: tension
    text: وكانت لرجال يعملون في العتمة، غطّاسون يركبون طوربيدات يسمّونها الخنازير، ويتسلّلون ليلًا إلى موانئ العدو.
    template: archive_photo
    banner: الطوربيد البشري
    params: {asset: slc_torpedo, desc: SLC human torpedo in a museum, card: طوربيد «الخنزير» · من تلك الحرب}
  - id: l13       # [5]
    mood: tension
    text: وفي ديسمبر 1941، تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    say: وفي ديسمبر عام ألفٍ وتسعمئةٍ وواحدٍ وأربعين، تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    template: city_zoom
    banner: الإسكندرية · 1941
    params: {city: alexandria, sub: ديسمبر 1941}
  - id: l14       # [5][6]
    event: true
    mood: mystery
    text: لكن الستة أُسروا، وأخفى البريطانيون الضرر، فبدت البارجتان سليمتين، كي لا يعرف أحد حجم ضعفهم.
    template: archive_photo
    banner: البارجة كوين إليزابيث
    params: {asset: queen_elizabeth_1942, desc: HMS Queen Elizabeth at Alexandria 1942, card: تبدو سليمة… لكنها ليست كذلك}
  - id: l15       # [7]
    event: true
    mood: mystery
    text: ويُقال إن ساعات بانيراي كانت على معاصم هؤلاء الغطّاسين تلك الليلة، إلى جانب بوصلاتهم المضيئة.
    template: archive_photo
    banner: يُقال…
    params: {asset: slc_compass, desc: SLC compass, card: بوصلة من طوربيدات الغطّاسين · متحف مالطا}
  # ----------------------------------------------------------------------------------- act 4: after the war
  - id: l16       # [8][10]
    event: true
    mood: joy
    change: true
    because: الراديوم كان خطرًا، والتريتيوم إشعاعه أضعف بكثير
    text: ثم انتهت الحرب، ولأن الراديوم قاتل، سجّلت بانيراي عام 1949 مادة أخفّ إشعاعًا سمّتها لومينور، وإن بقي الراديوم في بعض موانئها حتى الستينيات.
    say: ثم انتهت الحرب، ولأن الراديوم قاتل، سجّلت بانيراي عام ألفٍ وتسعمئةٍ وتسعةٍ وأربعين مادة أخفّ إشعاعًا سمّتها لومينور، وإن بقي الراديوم في بعض موانئها حتى الستينيات.
    template: archive_photo
    banner: لومينور · 1949
    params: {asset: egiziano_1956, desc: Panerai Egiziano 1956, card: ساعة بانيراي من الخمسينيات · ما زال عليها الراديوم}
  - id: l17       # [8]
    set: workshop
    change: true
    because: كي يبقى التاج مضغوطًا على مانع التسرّب فلا يدخل الماء
    text: ومنذ الخمسينيات يضغط جسرٌ التاجَ ويُحكم إغلاقه كي لا يتسرّب الماء، وما زال هذا الجسر علامتها حتى اليوم.
    template: product_macro
    banner: جسر التاج اليوم
    params: {asset: crown_guard, desc: crown guard}
  - id: l18       # [1]
    mood: joy
    text: وبقيت سرًّا، فحتى 1970 لم يُصنع منها إلا نحو 1600 ساعة، إلى أن خرجت أخيرًا إلى الناس عام 1993.
    say: وبقيت سرًّا، فحتى عام ألفٍ وتسعمئةٍ وسبعين لم يُصنع منها إلا نحو ألفٍ وستمئة ساعة، إلى أن خرجت أخيرًا إلى الناس عام ألفٍ وتسعمئةٍ وثلاثةٍ وتسعين.
    template: product_reveal
    banner: إلى الناس · 1993
    params: {asset: marina_militare_1990s, desc: Panerai Marina Militare 1990s, name: خرجت إلى الناس, year: '1993'}
  - id: l19       # —
    set: underwater
    mood: wonder
    closing: true
    text: هكذا صارت بانيراي، المولودة من ضوء قاتل، من أشهر ساعات العالم اليوم.
    template: product_reveal
    params: {asset: luminor_close, desc: Luminor Marina, name: بانيراي, name_size: 60}
