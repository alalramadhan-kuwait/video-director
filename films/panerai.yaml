# Panerai, told in order and in four acts: the shop on the bridge (1860); the light and its human price (1915–1928);
# the secret mission (1936–1941); after the war (1949–1993). Each act leads into the next.
# Every scene has a related photo of the time it speaks of (`year:` on each photo), shows only what is said in it, and every change of scene is led into by its first words.
# Each line has its story world (`set`, director/studio/sets.py) and, where the story carries a feeling, its `mood`.
# A historical event (`event: true`) is shown with a historical photograph; a change (`change: true`) says why (`because`).
# Every line names its sources (numbers refer to `sources`). Years are written as words in `say` so the voice reads them.
# A claim the sources only believe (the watches on the divers' wrists that night) is said as a belief: «يُقال».
title: Panerai — ضوء في عتمة البحر
brand: timekeeper
platform: reels
# Genta's voice reads slower than the draft: the silences between lines shorten so the film keeps every word in 180 s
gap: {tail: 0.3, pause: 0}
seed: panerai
theme: tk-bone
sources:
  - "[1] Panerai — Wikipedia (1860 Florence; Radiomir radium sights; Rolex made the watches, Panerai the dials; ~1,600 watches 1935–1970; civilian market 1993): https://en.wikipedia.org/wiki/Panerai"
  - "[2] Phillips auction notes on the Radiomir (1936 prototypes for the Italian Navy; ref. 3646 made by Rolex; used by the navy's combat swimmers): https://www.phillips.com/detail/panerai/97925"
  - "[3] Espacenet GB191512270A (Panerai radium luminous sights patent, 1915): https://worldwide.espacenet.com/patent/search?q=pn%3DGB191512270A"
  - "[4] Radium Girls — Wikipedia (young women dial painters told the paint was harmless, lip-pointing brushes, tooth loss, anaemia, 'radium jaw'; more than 50 dead by 1927; five sued, settled in 1928, all five dead by the 1930s): https://en.wikipedia.org/wiki/Radium_Girls"
  - "[5] Raid on Alexandria (1941) — Wikipedia (19 Dec 1941, Decima Flottiglia MAS, three SLC 'maiali', six men, HMS Valiant and HMS Queen Elizabeth put out of action): https://en.wikipedia.org/wiki/Raid_on_Alexandria_(1941)"
  - "[7] Worn & Wound, Military Watches of the World: Italy (Panerai had no watchmaking facility and turned to Rolex; 'highly likely' early Panerai saw service in the Alexandria raid): https://wornandwound.com/military-watches-of-the-world-italy-pt-i/"
  - "[8] Luminor (tritium) replaced radium because radium was too hazardous; the crown-protecting bridge, 1950s: https://www.watchfinder.com/articles/feature-the-incredible-deadly-story and https://wristreview.com/brief-history-panerai-luminor/"
  - "[9] Panerai, History (its own account: the first shop, on the Ponte alle Grazie, Florence, 1860): https://www.panerai.com/en/about-panerai/history.html"
  - "[11] Undark — Wikipedia (radium paint made by the U.S. Radium Corporation, Orange, New Jersey, 1917–1926; radium and zinc paint first mixed by William J. Hammer, 1902; a different product from Panerai's Radiomir): https://en.wikipedia.org/wiki/Undark"
  - "[12] Marie Curie discovered radium (with Pierre Curie, 1898): https://en.wikipedia.org/wiki/Radium"
  - "[14] Panerai diving instruments (depth gauge, compass, torch, knife, watch), probably 1940s–1960s: https://commons.wikimedia.org/wiki/File:Set_of_tools_for_scuba_diving_from_the_Italian_company_Panerai.jpg"
  - "[15] The Milwaukee Leader, 22 May 1928, p. 1: «5 Radium Victims Lose Court Plea… five former New Jersey factory women whose physicians say they are dying from radium poisoning» (Library of Congress, Chronicling America; published in 1928, public domain in the US): https://www.loc.gov/resource/sn83045293/1928-05-22/ed-1/?sp=1"
  - "[10] Luminor name registered 1949 (tritium); radium dials on navy watches until the mid-1960s: https://wristreview.com/brief-history-panerai-luminor/"
photos:
  panerai_tools: {query: Set of tools for scuba diving from the Italian company Panerai, year: 1950, not_a_watch: true}   # instruments; its watches are not named
  panerai_gauge: {query: Panerai depth gauge for scuba diving, year: 1950, not_a_watch: true}
  first_shop_bridge: {query: Alinari Ponte Rubaconte Ponte alle Grazie, year: 1870}
  marie_curie: {query: Marie Curie portrait 1900, year: 1900, person: Marie Curie}
  radium_painters: {query: USRadiumGirls Argonne1, year: 1922}
  grace_fryer: {query: Grace Fryer, year: 1925, person: Grace Fryer}
  radium_victims_1928: {file: films/assets/radium_victims_1928.jpg, year: 1928, licence: Public domain (US newspaper published 1928),
                        credit: "The Milwaukee Leader · 22 May 1928 · Library of Congress · public domain", page: "https://www.loc.gov/resource/sn83045293/1928-05-22/ed-1/?sp=1"}
  navy_diver: {query: Teseo tesei tuta, year: 1941, person: Giorgio Giobbe}
  rolex_oyster_1926: {query: Rolex Oyster del 1926 primo orologio impermeabile, year: 1926, watch: Rolex Oyster · 1926}
  slc_torpedo: {query: Siluro lenta corsa Taranto, year: 1941}
  slc_compass: {query: Decima Flotiglia MAS remnants Malta SLC compass, year: 1941}
  marina_militare_1990s: {query: Panerai Marina Militare 5218, year: 1995, watch: Panerai Luminor Marina Militare 5218-202/A}
  # the owner's pick: the whole watch on white (rule 12j). Kept in films/private/ (never in git); source to be named
  pam111: {file: films/private/pam111.jpg, licence: credited, credit: product photo, year: 2016,
           watch: Panerai Luminor Marina PAM 111 · modern}
lines:
  # ----------------------------------------------------------------------------------- act 1: the shop on the bridge
  # the film opens where the story begins, Florence in 1860 (the owner did not like the teaser opening on the patent drawing)
  - id: l2        # [1][9]
    set: florence
    text: في Florence، عام 1860.
    say: في Florence، عام ألفٍ وثمانمئةٍ وستين.
    template: city_zoom
    banner: Florence · 1860
    params: {city: florence, name: Florence, sub: عام 1860}
  - id: l3        # [9]
    event: true
    text: وهناك، على جسر Ponte alle Grazie، افتتح Giovanni Panerai أول محل له للساعات.
    template: archive_photo
    banner: جسر Ponte alle Grazie
    params: {asset: first_shop_bridge, desc: Ponte alle Grazie 19th century, card: على هذا الجسر · أول محل}
  - id: l4        # [1][9]
    event: true
    text: ومن هذا المحل الصغير في Florence كبرت العائلة، حتى صارت تصنع أدوات دقيقة للبحرية الإيطالية.
    template: paper_cutout
    banner: أدوات Panerai للبحرية
    params: {asset: panerai_tools, desc: Panerai diving instruments, card: بوصلة ومقياس عمق ومصباح · أدوات Panerai للبحرية}
  # ----------------------------------------------------------------------------------- act 2: the light and its price
  - id: l5        # [1][3][14]
    mood: tension
    text: لكن البحرية احتاجت أن ترى أجهزتها في عتمة الليل، وتحت الماء.
    template: paper_cutout
    banner: أجهزة تُقرأ في العتمة
    params: {asset: panerai_gauge, desc: Panerai depth gauge, card: مقياس عمق من أجهزة Panerai للبحرية}
  - id: l5b       # [1][3][12]
    set: radium
    mood: wonder
    event: true
    change: true
    because: احتاجت البحرية أن ترى أجهزتها ليلًا
    text: فطوّرت Panerai، من الراديوم الذي اكتشفته العالمة Marie Curie، مسحوقًا يتوهّج سمّته Radiomir.
    # the owner heard «سمّته» said wrong (studio, voice test): full vowels and a breath before it
    say: فطوّرت Panerai، من الراديوم الذي اكتشفته العالمة Marie Curie، مسحوقًا يتوهّج، سَمَّتْهُ Radiomir.
    template: paper_cutout
    banner: Radiomir · من راديوم Marie Curie
    params: {asset: marie_curie, desc: Marie Curie portrait 1900, card: Marie Curie · العالمة التي اكتشفت الراديوم}
  - id: l6        # [4][11] (Undark, not Radiomir: the link is radium itself)
    event: true
    mood: sadness
    text: غير أن الراديوم نفسه أخفى سرًّا مظلمًا، ففي أمريكا كان طلاء آخر بالراديوم، اسمه Undark، ترسمه عاملات شابّات على الساعات.
    template: archive_photo
    banner: عاملات الراديوم
    params: {asset: radium_painters, desc: radium dial painters 1922, card: طلاء Undark · عاملات شابّات في أمريكا}
  - id: l8        # [4]
    set: radium
    mood: sadness
    photo: radium_painters
    text: ثم تساقطت أسنانهنّ، وتآكلت فكوكهنّ، ومات أكثر من خمسين بحلول 1927.
    say: ثم تساقطت أسنانهنّ، وتآكلت فكوكهنّ، ومات أكثر من خمسين بحلول عام ألفٍ وتسعمئةٍ وسبعةٍ وعشرين.
    template: kinetic_type
    banner: مات أكثر من خمسين
    params: {lines: [{text: أكثر من 50, size: 120}, {text: بحلول 1927, size: 56, at: 0.8}], y: 480}
  - id: l9        # [4][15]
    event: true
    mood: sadness
    text: وفي 1928، واجهت خمسٌ من هؤلاء العاملات الشركة في المحكمة، وكان أطباؤهنّ يقولون إنهنّ يحتضرن من الراديوم.
    say: وفي عام ألفٍ وتسعمئةٍ وثمانيةٍ وعشرين، واجهت خمسٌ من هؤلاء العاملات الشركة في المحكمة، وكان أطباؤهنّ يقولون إنهنّ يحتضرن من الراديوم.
    template: archive_photo
    params: {asset: radium_victims_1928, desc: Milwaukee Leader 22 May 1928, print: true, w: 400, y: 545, rot: -1, card_y: 870,
             card: خمس عاملات يقول أطباؤهنّ إنهنّ يحتضرن من الراديوم}
  - id: l9b       # [4]
    event: true
    mood: sadness
    text: ومنهنّ Grace Fryer. حصلت كلّ واحدة منهنّ على تعويض، لكنّ الراديوم كان قد استقرّ في عظامهنّ، فرحلن الخمس جميعًا في السنوات التالية.
    template: paper_cutout
    banner: Grace Fryer
    params: {asset: grace_fryer, desc: Grace Fryer, card: Grace Fryer · حصلن على تعويض ورحلن الخمس جميعًا}
  # ----------------------------------------------------------------------------------- act 3: the secret mission
  - id: l10       # [2][4]
    set: underwater
    mood: tension
    text: وبينما كان العالم يكتشف خطر الراديوم، طلبت البحرية الإيطالية عام 1936 ساعة لغطّاسيها المقاتلين.
    say: وبينما كان العالم يكتشف خطر الراديوم، طلبت البحرية الإيطالية عام ألفٍ وتسعمئةٍ وستةٍ وثلاثين ساعة لغطّاسيها المقاتلين.
    template: paper_cutout
    banner: طلب البحرية · 1936
    # no free photo of the 1936 watch (Commons has only a homage), and a watch is never drawn: the divers it was for
    params: {asset: navy_diver, desc: Giorgio Giobbe in a diving suit, card: Giorgio Giobbe · من غطّاسي البحرية الإيطالية}
  - id: l11       # [1][7]
    set: workshop
    change: true
    because: لم تكن Panerai تملك مصنعًا للساعات
    text: ولأن Panerai لا تملك مصنعًا للساعات، لجأت إلى Rolex صاحبة ساعة Oyster المقاومة للماء، فصنعت Rolex العلبة والآلية، وصنعت Panerai الميناء المضيء.
    template: paper_cutout
    banner: لماذا Rolex؟
    # the photo is a Rolex, not the Panerai Rolex made: the card says so (rule 12i)
    params: {asset: rolex_oyster_1926, desc: Rolex Oyster 1926, card: Rolex Oyster · ساعة Rolex المقاومة للماء}
  - id: l12       # [5]
    event: true
    mood: tension
    text: وكانت لرجال يعملون في العتمة، غطّاسون يركبون طوربيدات يسمّونها الخنازير، ويتسلّلون ليلًا إلى موانئ العدو.
    template: archive_photo
    banner: الطوربيد البشري
    params: {asset: slc_torpedo, desc: SLC human torpedo in a museum, card: طوربيد «الخنزير» · من تلك الحرب}
  - id: l13       # [5]
    mood: tension
    text: وفي ديسمبر 1941، تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    say: وفي ديسمبر عام ألفٍ وتسعمئةٍ وواحدٍ وأربعين، تسلّل ستة منهم إلى ميناء الإسكندرية، وعطّلوا بارجتين بريطانيتين.
    template: city_zoom
    banner: الإسكندرية · 1941
    params: {city: alexandria, sub: ديسمبر 1941}
  - id: l15       # [7]
    event: true
    mood: mystery
    text: ويُقال إن ساعات Panerai كانت على معاصم هؤلاء الغطّاسين تلك الليلة، إلى جانب بوصلاتهم المضيئة.
    template: archive_photo
    banner: يُقال…
    params: {asset: slc_compass, desc: SLC compass, card: بوصلة من طوربيدات الغطّاسين · متحف مالطا}
  # ----------------------------------------------------------------------------------- act 4: after the war
  - id: l16       # [8][10]
    event: true
    mood: joy
    change: true
    because: الراديوم كان خطرًا، والتريتيوم إشعاعه أضعف بكثير
    text: ثم انتهت الحرب، ولأن الراديوم قاتل، سجّلت Panerai عام 1949 مادة أخفّ إشعاعًا سمّتها Luminor، وإن بقي الراديوم في بعض موانئها حتى الستينيات.
    say: ثم انتهت الحرب، ولأن الراديوم قاتل، سجّلت Panerai عام ألفٍ وتسعمئةٍ وتسعةٍ وأربعين مادة أخفّ إشعاعًا، سَمَّتْهَا Luminor، وإن بقي الراديوم في بعض موانئها حتى الستينيات.
    template: kinetic_type
    banner: Luminor · 1949
    # the line names Luminor: no free photo shows a 1950s Panerai with Luminor, and another model would mislead (rule 12i)
    no_photo: لا توجد صورة حرّة لساعة Panerai بمادة Luminor من الخمسينيات
    params: {lines: [{text: Luminor, size: 110}, {text: مادة أخفّ إشعاعًا · 1949, size: 48, at: 0.8}], y: 480}
  - id: l18       # [1]
    mood: joy
    text: وبقيت سرًّا، فحتى 1970 لم يُصنع منها إلا نحو 1600 ساعة، إلى أن خرجت أخيرًا إلى الناس عام 1993.
    say: وبقيت سرًّا، فحتى عام ألفٍ وتسعمئةٍ وسبعين لم يُصنع منها إلا نحو ألفٍ وستمئة ساعة، إلى أن خرجت أخيرًا إلى الناس عام ألفٍ وتسعمئةٍ وثلاثةٍ وتسعين.
    template: stat_counter
    photo: marina_militare_1990s
    banner: إلى الناس · 1993
    params: {title: حتى 1970, value: 1600, label: ساعة فقط, land_on: '1600', source: 'المصدر: Panerai · Wikipedia'}
  - id: l19       # —
    set: underwater
    mood: wonder
    closing: true
    text: هكذا صارت Panerai، التي صُنعت لرجال يعملون في عتمة البحر، من أشهر ساعات العالم اليوم.
    template: paper_cutout
    # the whole watch, cut out like paper (rule 12h), from the photo the owner chose (rule 12j)
    params: {asset: pam111, desc: Luminor Marina PAM 111, card: Luminor Marina · طراز حديث من أشهر ساعات اليوم}
