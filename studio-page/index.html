<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ستوديو تايم كيبر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF7EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* layout: a phone app in the celebration-dial look the owner chose (theme A): cream ground, one bright colour per film,
   rounded cards, a dark floating tab bar; one light look on purpose */
:root{
  --bg:#FBF7EF; --card:#FFFFFF; --ink:#1B1B1B; --mute:#5B5650; --soft:#EFE8DA; --line:#E6DECD;
  --teal:#2BB5B8; --yellow:#F2C230; --coral:#F2765F; --pink:#E9A0C0; --green:#A8D8A0; --blue:#2F5BD3; --ok:#2E8B57;
  --display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.app{max-width:560px;margin:0 auto;position:relative}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:800 34px/1.1 var(--display)}
h2{font:800 21px/1.25 var(--display)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bubbles{position:absolute;inset:0 auto auto 0;width:200px;height:150px;pointer-events:none;z-index:0}
.bubbles span{position:absolute;border-radius:50%}
.top{position:relative;z-index:1;padding-block:26px 6px;display:grid;gap:2px}
.sub{font:700 14px var(--body);color:var(--mute)}
.view{position:relative;z-index:1;display:grid;gap:12px;padding-top:12px}
.now{display:flex;gap:8px;align-items:center;font:700 13.5px var(--body);background:var(--card);border-radius:999px;padding:8px 14px;justify-self:start;box-shadow:0 1px 0 var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 30%,transparent)}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.4}}
/* film cards */
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fname{font:800 20px/1.2 var(--display)}
.track{height:8px;border-radius:999px;background:rgba(27,27,27,.18);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.state{display:flex;gap:6px;align-items:center;font:700 13.5px var(--body)}
.pill{background:var(--bg);border-radius:999px;padding:6px 13px;font:800 13.5px var(--body)}
.empty{background:var(--card);border-radius:24px;padding:18px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.short{border:0;border-radius:18px;padding:10px 16px;min-height:50px;display:flex;align-items:center;gap:10px;font:800 16px var(--display);cursor:pointer;text-decoration:none}
/* film page */
.back{width:44px;height:44px;border-radius:50%;background:var(--ink);border:0;display:grid;place-items:center;cursor:pointer}
.fhead{display:flex;align-items:center;gap:12px}
.fhead .tag{margin-inline-start:auto;border-radius:999px;padding:4px 12px;font:700 13px var(--body);white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.steps li{display:grid;place-items:center}
.steps span{width:34px;height:34px;max-width:100%;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display)}
.steps .todo{background:var(--soft);color:var(--mute)}
.steps .cur{border:3px solid var(--ink)}
.stepname{text-align:center;font:700 14px var(--body)}
.prog{background:var(--card);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;box-shadow:0 1px 0 var(--line)}
.prog b.big{grid-row:span 2;font:800 40px/1 var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.prog .track{background:var(--soft);height:10px}.prog .track i{background:var(--teal)}
.gate{border-radius:28px;padding:16px;display:grid;gap:12px;justify-items:center}
video{width:min(100%,240px);aspect-ratio:9/16;border-radius:18px;background:#000;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.btn{min-height:52px;border-radius:999px;font:800 17px var(--display);cursor:pointer;border:0;padding:8px 16px}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.line{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
textarea{font:inherit;font-size:16px;width:100%;min-height:84px;border-radius:16px;border:0;background:var(--bg);padding:10px 12px;resize:vertical}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{border-radius:20px;padding:12px 14px;display:grid;gap:0}
.act b{font:800 17px var(--display)}.act span{font:700 12.5px var(--body)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:6px 14px;font:700 13px var(--body);background:var(--soft);cursor:pointer;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
/* library, styles, team */
.lang{border-radius:24px;padding:14px 16px;display:grid;gap:8px}
.lang ul{margin:0;padding-inline-start:18px;display:grid;gap:2px;font-size:14px}
.ex{background:rgba(255,255,255,.7);border-radius:14px;padding:8px 12px;display:grid;gap:2px;font:600 14.5px/1.6 var(--body)}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type{border:0;border-radius:22px;padding:14px;min-height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;text-align:start}
.type b{font:800 17px/1.25 var(--display)}.type span{font:700 12px var(--body)}
.typecard{border-radius:26px;padding:16px;display:grid;gap:10px;background:var(--teal)}
.beats{display:flex;gap:4px}
.beats span{border-radius:999px;padding:5px 0;text-align:center;font:700 11px var(--body);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.typecard ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sample{display:grid;gap:6px;justify-items:center;text-align:center}
.sample img,.sample .ph{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:16px;background:var(--soft);max-width:100%}
.sample .ph{display:grid;place-items:center;font:700 12px var(--body);color:var(--mute);padding:6px}
.sample b{font:800 15px var(--display)}
.badge{border-radius:999px;padding:2px 10px;font:700 12px var(--body);justify-self:start}
.group{background:var(--card);border-radius:20px;padding:12px 14px;display:grid;gap:4px;box-shadow:0 1px 0 var(--line)}
.group b{font:800 16px var(--display)}.group p{font-size:13px;color:var(--mute);line-height:1.7}
.readers{display:flex;justify-content:space-between;gap:6px}
.reader{display:grid;justify-items:center;gap:4px;text-align:center}
.reader img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--c)}
.reader b{font:800 13.5px var(--display)}.reader span{font:700 11px var(--body);color:var(--mute)}
.voice{border-radius:20px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.voice b{font:800 18px var(--display)}
/* tab bar */
nav.tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;height:64px;background:var(--ink);border-radius:32px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:20}
nav.tabs a{justify-self:center;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{background:var(--c)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--teal);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:700;z-index:30}
.note{font-size:13px;color:var(--mute)}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;width:100%;direction:rtl}
.slides img{flex:none;width:min(78%,300px);aspect-ratio:4/5;object-fit:cover;border-radius:16px;scroll-snap-align:center;background:var(--soft);box-shadow:0 1px 0 var(--line)}
.caption{background:var(--card);border-radius:20px;padding:12px 14px;display:grid;gap:8px;width:100%;box-shadow:0 1px 0 var(--line)}
.caption pre{margin:0;white-space:pre-wrap;font:500 15px/1.7 var(--body)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.pick button{position:relative;border:0;padding:0;border-radius:12px;background:var(--soft);cursor:pointer;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.pick img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;transition:opacity .15s}
.pick span{position:absolute;inset-block-end:6px;inset-inline-start:6px;background:var(--bg);color:var(--ink);border-radius:999px;padding:1px 9px;font:800 12.5px var(--body)}
.pick button[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--ink)}
.pick button[aria-pressed="true"] img{opacity:.55}
.pick button[aria-pressed="true"] span{background:var(--ink);color:var(--bg)}
.pick button[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 14px var(--body)}
.chg{margin:4px 0 0;padding-inline-start:18px;display:grid;gap:2px;font-size:14px}
.kitc{width:100%;height:auto;aspect-ratio:4/5;border-radius:18px;box-shadow:0 1px 0 var(--line);background:var(--soft)}
.warn{list-style:none;margin:0;padding:0;display:grid;gap:4px;font:700 13.5px var(--body);color:#a3172e}.warn .ok{color:var(--ok)}
.inp{font:inherit;font-size:16px;width:100%;border-radius:14px;border:0;background:var(--card);padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.kind{font:800 11.5px var(--body);background:var(--bg);border-radius:999px;padding:2px 9px}
/* the films list, by topic (the owner: «too bulky… group the topics together… the latest update shown»): one card per
   topic, one slim row per Reel or carousel with its kind, version, when it was last made and whether it has the newest rules */
.topic{border-radius:22px;padding:10px 10px 8px;display:grid;gap:6px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 6px 0}
.thead b{font:800 19px/1.2 var(--display)}.thead span{font:700 12.5px var(--body)}
.item{border:0;width:100%;text-align:start;background:rgba(255,255,255,.62);border-radius:14px;padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;cursor:pointer;color:var(--ink);min-height:52px}
.item svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;grid-row:span 2}
.iname{font:800 15px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imeta{font:600 12px/1.3 var(--body);color:#3b3732;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.ist{grid-row:1 / span 2;grid-column:3;font:800 12px var(--body);border-radius:999px;padding:3px 10px;background:var(--ink);color:var(--bg);white-space:nowrap}
.ist.ok{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.checks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.checks .when{margin-inline-start:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.shots{margin:2px 0 0;padding-inline-start:18px;display:grid;gap:2px;font-size:13px}
.up{display:flex;align-items:center;justify-content:center;width:100%}
.vd{display:inline-block;border-radius:999px;padding:2px 10px;font:800 13px var(--body);color:#fff}
.vd.good{background:#2E8B57}.vd.mid{background:#C98A12}.vd.bad{background:#C0392B}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.nums div{background:var(--bg);border-radius:12px;padding:6px 10px;display:grid}.nums span{font-size:12px;color:var(--mute)}.nums b{font:800 16px var(--display)}
.recipe ol{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px}.recipe summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rok{color:#1f6b3f}.rold{color:#8a1426}
.rules{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:3px;font-size:14px}
/* Instagram reports: four questions, the numbers as evidence, a confidence on every claim */
.auto{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:2px 10px;font:700 12px var(--body);background:#E3F1E8;color:#1f6b3f}
.conf{display:inline-block;border-radius:999px;padding:1px 9px;font:700 11.5px var(--body);white-space:nowrap}
.conf.high{background:#1f6b3f;color:#fff}.conf.medium{background:#F2C230;color:var(--ink)}.conf.low{background:var(--soft);color:var(--mute)}
.conf.principle{background:#DCE5FA;color:#23408f}.conf.not_enough{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line)}
.rep{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:grid;gap:8px}
.q{border-radius:14px;padding:8px 12px;display:grid;gap:3px}.q b{font:800 14.5px var(--display)}.q ul{margin:0;padding-inline-start:18px;display:grid;gap:3px;font-size:14px;line-height:1.55}
.q.ok{background:#E3F1E8}.q.no{background:#FBE6E3}.q.try{background:#FFF4D6}.q.ev{background:var(--bg)}
.evt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.evt th{font:700 11.5px var(--body);color:var(--mute);text-align:start;padding:2px 4px}
.evt td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.evt td:first-child{font-weight:700}.evt .r{white-space:nowrap;font-weight:800;direction:ltr;text-align:end}
.evt tr.good .r{color:#1f6b3f}.evt tr.bad .r{color:#B3261E}.evt tr.na td,.evt tr.nc td,.evt tr.nobase td{color:var(--mute)}
.evt small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.brief .sec{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}.brief .sec:first-of-type{border-top:0}
.brief .sec b{font:800 15px var(--display)}.brief .sec p{font-size:14px;color:var(--ink)}.brief .sec .note{font-size:12.5px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}.linkrow .inp{flex:1 1 200px;min-width:0}
/* the Instagram side of the studio (approved plan, 3 Nov 2026): strength marks, status dot, numbers, learning, the post picker */
.lv{flex:none;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font:800 10px var(--body);margin-top:3px}
.lv.c{background:#1f6b3f;color:#fff}.lv.e{box-shadow:inset 0 0 0 1.7px #8a5a00;color:#8a5a00}.lv.w{box-shadow:inset 0 0 0 1.5px #9b948a;color:#857e74;border-radius:5px}
.q li.l{list-style:none;display:flex;gap:7px;align-items:flex-start;margin-inline-start:-18px}
.sdot{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:5px 11px;font:700 12.5px var(--body);box-shadow:0 1px 0 var(--line);cursor:pointer;color:var(--ink)}
.sdot::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E8B57}
.sdot.bad::before{background:#C0392B}.sdot.idle::before{background:#b3ab9f}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 4px;font:700 13px var(--body);cursor:pointer;color:var(--ink);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:default}
.tilesg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{background:var(--card);border-radius:16px;padding:9px 11px;box-shadow:0 1px 0 var(--line);display:grid;gap:1px;min-width:0}
.tl span{font:600 12px var(--body);color:var(--mute)}.tl b{font:800 21px/1.15 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tl small{font:700 11.5px var(--body);color:#1f6b3f}
.splitb{height:14px;border-radius:8px;overflow:hidden;display:flex;background:var(--soft)}.splitb i{display:block;height:100%}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:13px}
.bars .tr{height:10px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.bars .tr i{position:absolute;inset-block:0;right:0;border-radius:6px;background:var(--teal)}
.bars .tr i.bad{background:var(--coral)}.bars .tr i.mid{background:#b9b1a4}
.bars .tr u{position:absolute;inset-block:-2px;right:50%;width:2px;background:var(--ink)}
.bars .x{font:800 12.5px var(--body);direction:ltr;font-variant-numeric:tabular-nums}
.kvr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.kvr:first-child{border-top:0}
.kvr b{font-weight:700;text-align:end}
.sheet{position:fixed;inset:auto 0 0 0;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 40px -16px rgba(0,0,0,.35);display:grid;gap:9px;z-index:25;max-height:82vh;overflow-y:auto}
body:has(.sheet) nav.tabs,body:has(.sheet) #toast{display:none}
.scrim{position:fixed;inset:0;background:rgba(27,27,27,.38);z-index:24;border:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.post{border:0;width:100%;text-align:start;border-radius:14px;padding:9px 12px;background:var(--bg);display:grid;gap:1px;font:500 13px var(--body);cursor:pointer;color:var(--ink)}
.post b{font:700 14px var(--body)}.post[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--ink);background:#fff}
.post:disabled{opacity:.5;cursor:default}
.tag2{display:inline-block;border-radius:999px;padding:0 8px;font:700 11px var(--body);background:#E3F1E8;color:#1f6b3f}
.sugg{border-radius:16px;padding:10px 12px;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink);display:grid;gap:6px}

/* v3, the approved iPhone design: the numbers in five seconds, one number before posting, the rest closed */
.hero{background:var(--card);border-radius:24px;padding:14px 16px 10px;display:grid;gap:10px;box-shadow:0 1px 0 var(--line)}
.hn{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.hn small{display:block;font:700 12.5px var(--body);color:var(--mute)}
.hn b{display:block;font:800 34px/1.05 var(--display);font-variant-numeric:tabular-nums}
.hn b.sm{font-size:27px}
.pch{display:inline-block;font:800 12.5px var(--body);border-radius:999px;padding:1px 9px;margin-top:3px}
.pch.down{background:#FBE3DF;color:#B3261E}.pch.ok{background:#E3F1E8;color:#1f6b3f}.pch.up{background:#DCEBFF;color:#1d4fa8}
.chart svg{width:100%;height:auto;display:block}
.b7{fill:var(--teal)}.bp{fill:#9FD9DA}.bo{fill:#DCD3C2}.gl{stroke:var(--line);stroke-width:1}.ax{font:500 9.5px var(--body);fill:var(--mute)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:600 11.5px var(--body);color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.gist{border-radius:22px;padding:12px 14px;background:#FFF4D6;display:grid;gap:8px}
.gist .gr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:14.5px;line-height:1.5}
.gist .tg{font:800 11.5px var(--body);border-radius:999px;padding:1px 8px;background:var(--ink);color:var(--bg);white-space:nowrap;margin-top:2px}
.gist .tg.t2{background:var(--teal);color:var(--ink)}
.fold{background:var(--card);border-radius:18px;box-shadow:0 1px 0 var(--line)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;font:800 15px var(--display)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span{font:600 12.5px var(--body);color:var(--mute);text-align:end}
details.fold>summary::after{content:"‹";font:800 18px var(--body);color:var(--mute);transform:rotate(-90deg);transition:transform .15s;flex:none}
details.fold[open]>summary::after{transform:rotate(90deg)}
.fin{padding:0 14px 12px;display:grid;gap:8px}
.pred{background:var(--card);border-radius:24px;padding:14px 16px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.pred small{font:700 12.5px var(--body);color:var(--mute)}
.pred .pbig{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.range{position:relative;height:10px;border-radius:999px;background:var(--soft);margin:6px 0 2px}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:#9FD9DA}
.range em{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);margin-inline-start:-2px}
.rl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 11.5px var(--body);color:var(--mute);font-variant-numeric:tabular-nums}
.sg{display:grid;gap:8px}.sg h3{margin:0;font:800 16px var(--display)}
.sgi{background:var(--card);border-radius:18px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 1px 0 var(--line)}
.sgi p{margin:0;font-size:14px;line-height:1.5}.sgi p small{display:block;color:var(--mute);font-size:12px}
.do{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:800 14px var(--display);padding:7px 14px;min-height:40px;cursor:pointer}
.vs{display:grid;gap:8px}.vsrow{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;font-size:13px}
.vsrow .bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}.vsrow .bar i{display:block;height:100%;border-radius:999px}
.vsrow b{font:800 15px var(--display);font-variant-numeric:tabular-nums}
.lines3{background:var(--card);border-radius:20px;padding:10px 14px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.lines3 div{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px;line-height:1.5}
.lines3 .ok{color:#1f6b3f;font-weight:800}.lines3 .no{color:#B3261E;font-weight:800}.lines3 .nx{color:#7A5A00;font-weight:800}
.badge.off{background:#DCE5FA;color:#23408f}.badge.tp{background:var(--soft);color:var(--mute)}.badge.un{background:#FBE6E3;color:#8a1426}
.ktab{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.ktab th{font:700 11px var(--body);color:var(--mute);text-align:start;padding:3px}
.ktab td{padding:6px 3px;border-top:1px solid var(--line);vertical-align:top}.ktab td small{display:block;color:var(--mute);font-size:11px}
.pl{border:0;width:100%;text-align:start;background:var(--card);border-radius:16px;padding:9px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;box-shadow:0 1px 0 var(--line);cursor:pointer;color:var(--ink);min-height:56px}
.pl svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;grid-row:span 2}
.pl .n{font:800 15px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .m{font:600 12px/1.3 var(--body);color:var(--mute);grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .r{grid-row:1/span 2;grid-column:3;text-align:end;display:grid;gap:2px;justify-items:end}
.pl .r b{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.vbad{font:800 11.5px var(--body);border-radius:999px;padding:1px 8px;white-space:nowrap}
.vbad.good{background:#E3F1E8;color:#1f6b3f}.vbad.mid{background:#FFF4D6;color:#7A5A00}.vbad.bad{background:#FBE6E3;color:#8a1426}
.moved{border:0;width:100%;background:var(--card);border-radius:18px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 0 var(--line);cursor:pointer;color:var(--ink);font:800 15px var(--display)}
.moved span{font:700 13px var(--body)}
/* the simple Instagram page (6 Nov 2026): the account in one sentence, one thing to do, each post with a verdict and one reason; the numbers live in «متقدم» */
.ovr{border-radius:22px;padding:16px;display:grid;gap:8px}.ovr.down{background:#FBE3DF}.ovr.up{background:#DDF0D8}.ovr.ok{background:var(--soft)}
.ovr h1{font:800 30px/1.15 var(--display)}.ovr p{font-size:15px;line-height:1.55;color:#3B3732}
.obar{height:10px;border-radius:999px;background:#fff;overflow:hidden}.obar i{display:block;height:100%;border-radius:999px;background:var(--coral)}
.acn{border-radius:22px;padding:16px;background:#FFE9A8;display:grid;gap:9px}.acn small{font:700 13px var(--body);color:#4A3A00}.acn b{font:800 20px/1.35 var(--display)}.acn span{font-size:13.5px;color:#3B3732}
.dots{display:flex;gap:6px}.dots i{width:18px;height:18px;border-radius:50%;background:#1F8F92}.dots i.on{background:var(--coral)}
.plist{display:grid}.prow{border:0;border-top:1px solid var(--line);background:transparent;width:100%;padding:10px 0;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;text-align:start;cursor:pointer;color:var(--ink)}
.prow img,.pth{width:56px;height:70px;border-radius:10px;object-fit:cover;display:block;background:var(--soft)}
.pb{min-width:0;display:grid;gap:2px;font-size:13.5px;line-height:1.45}.pt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pt b:first-child{font:700 15px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ptip{font-size:13px;color:var(--mute)}
.pv{flex:none;border-radius:999px;padding:1px 11px;font:700 12.5px var(--body);color:var(--ink)}.pv.bad{background:var(--coral)}.pv.good{background:var(--green)}.pv.mid{background:var(--yellow)}.pv.early{background:var(--soft);color:#3B3732}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.fchips::-webkit-scrollbar{display:none}.fchips .chip{flex:none;min-height:36px}
.ptile{position:relative;border:0;padding:0;aspect-ratio:3/4;min-width:0;background:var(--soft);overflow:hidden;cursor:pointer;color:var(--ink)}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.ptile .pv{position:absolute;top:6px;inset-inline-start:6px;font-size:11.5px;padding:1px 8px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ptile svg{position:absolute;top:7px;inset-inline-end:6px;width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.pfb{position:absolute;inset:34px 8px 8px;font:700 12px/1.35 var(--body);overflow:hidden;text-align:start}
.lnk{border:0;background:transparent;min-height:44px;font:700 14px var(--body);cursor:pointer;color:var(--ink);padding:0}
.adv{border:0;border-top:1px solid var(--line);background:transparent;width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;font:700 14.5px var(--body);cursor:pointer;color:var(--ink);padding:0}.adv span{font-weight:500;color:var(--mute)}
.phead{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}.phead>div{min-width:0;overflow-wrap:anywhere}.phead img,.phead .pth{width:76px;height:95px;border-radius:12px}
.phead h1{font:800 34px/1.1 var(--display)}.phead h1.bad{color:#B3261E}.phead h1.good{color:#1F6B3F}.phead h1.mid{color:#7A5A00}
.psec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}.psec h2{font:800 19px var(--display)}.psec p,.psec li{font-size:15px;line-height:1.6}.psec ul{margin:0;padding-inline-start:18px;display:grid;gap:5px}
/* the request flow (6 Nov 2026): a request shows at once; nothing is built before the owner chooses */
.flowc{background:var(--card);border-radius:18px;padding:12px 14px;display:grid;gap:7px;box-shadow:0 1px 0 var(--line)}.flowc b{font:800 16px var(--display)}.flowc p{font-size:14px;line-height:1.55}.flowc small{font-size:12.5px;color:var(--mute)}
.nextb{border-radius:16px;background:#FFE9A8;padding:10px 14px;display:grid;gap:1px}.nextb small{font:700 12.5px var(--body);color:#4A3A00}.nextb b{font:800 16px/1.4 var(--display)}
.scr{background:var(--card);border-radius:18px;box-shadow:0 1px 0 var(--line)}.scrl{padding:0 10px 12px;display:grid;gap:2px}
.sl{border:0;background:transparent;width:100%;text-align:start;display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;padding:7px 6px;border-radius:10px;cursor:pointer;color:var(--ink);font:500 15px/1.6 var(--body);min-height:44px}.sl span:first-child{font:700 12.5px/2 var(--body);color:var(--mute)}.sl.ed{background:#FFF4D6}
.pastebox{display:grid;gap:6px;margin:0 14px 10px;padding:10px;background:#FFF4D6;border-radius:12px}.pastebox textarea{min-height:170px;background:#fff}
.sayb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 14px 10px}.sl.now{background:#FFE9A8}
.sl.wl{cursor:default}.wds{display:flex;flex-wrap:wrap;gap:3px 2px;min-width:0}.wd{border:0;background:var(--bg);border-radius:8px;padding:6px 7px;min-height:38px;font:500 16px/1.4 var(--body);color:var(--ink);cursor:pointer}.wd[aria-pressed="true"]{background:var(--coral);font-weight:700}
.fixb{display:grid;gap:8px;padding:8px;margin:0 4px 6px;background:#FFF4D6;border-radius:10px}.fixb label{display:grid;gap:3px;font:700 13px var(--body)}.fixb .inp{background:#fff}
.fixs{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));padding:8px 10px 10px;z-index:2}.fixs .btn{width:100%;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.sledit{display:grid;gap:6px;padding:6px;background:#FFF4D6;border-radius:10px}.sledit textarea{min-height:90px;background:#fff}
.flowi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.flowi img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--soft)}
.flowl{display:grid;gap:6px}.flowl button{border:0;background:var(--bg);border-radius:12px;padding:8px 10px;text-align:start;cursor:pointer;color:var(--ink);display:grid;gap:1px;min-height:44px}.flowl button b{font:700 14px var(--body)}.flowl button span{font-size:12.5px;color:var(--mute)}
/* the Reel page (7 Nov 2026, the approved mockups Main · Voice · Review · Publish): seven stages, «دورك الحين» answered in
   place, the latest video, the details folded, one box for a change; voice, review and publishing open as their own views */
:root{--gold:#D4A72C;--turn:#FCE7A6;--turn-ink:#6B5411;--turn-card:#FFFDF6;--done:#2E7D5B;--rec:#E8573F;--rec-soft:#FDE3DC;--rec-ink:#9A2F1C;--edge:#E8E1D2;--night-line:#3A372F;--night-mute:#C9BFA6}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fp-head{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding-block:22px 2px}
.fp-head .back{flex:none}
.fp-ht{flex:1;min-width:0;display:grid;gap:2px}
.fp-ht h1{font:800 26px/1.15 var(--display)}
.fp-ht span{font:600 13px var(--body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-ver{flex:none;background:var(--gold);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 14px var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.fp-ver.ok{background:var(--done);color:#fff}
.fp-box{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:14px 12px;display:grid;gap:10px;min-width:0}
.fp-box h2{font:700 16px var(--body)}
.fp-where{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:2px}
.fp-where b{font:700 15px var(--body);flex:none}.fp-where span{font:600 13px/1.5 var(--body);color:var(--mute);text-align:end;min-width:0}
.fp-stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.fp-stages li{display:grid;justify-items:center;gap:4px;min-width:0}
.fp-stages i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);font-style:normal;background:var(--soft);color:var(--mute)}
.fp-stages .ok i{background:var(--done);color:#fff}
.fp-stages .cur i{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px var(--turn)}
.fp-stages small{font:600 11px/1.2 var(--body);color:var(--mute);white-space:nowrap}
.fp-stages .ok small{color:#3F3A30}.fp-stages .cur small{color:var(--ink);font-weight:800}
.fp-turn{background:var(--turn);border-radius:20px;padding:16px 14px;display:grid;gap:12px;min-width:0}
.fp-turn.work{background:var(--card);border:1px solid var(--edge)}
.fp-tt{display:grid;gap:2px}.fp-tt small{font:700 13px var(--body);color:var(--turn-ink)}.fp-turn.work .fp-tt small{color:var(--mute)}
.fp-tt h2{font:800 21px/1.3 var(--display)}
.fp-tp{font-size:14px;line-height:1.6;color:#4A3D12}.fp-turn.work .fp-tp{color:var(--ink)}
.fp-tp b{background:var(--turn-card);border-radius:6px;padding:0 3px}
.fp-opt{background:var(--turn-card);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px 10px;align-items:center;box-shadow:inset 0 0 0 2px transparent}
.fp-opt.on{box-shadow:inset 0 0 0 2px var(--ink)}
.fp-opt .ot{display:grid;min-width:0}.fp-opt .ot b{font:700 17px/1.35 var(--body)}.fp-opt .ot small{font-size:12.5px;color:var(--mute);line-height:1.45}
.fp-opt .do{min-height:44px}.fp-opt .do.full{grid-column:1/-1}
.fp-opt .do[aria-pressed="true"]{background:var(--done)}
.fp-opt img{grid-column:1/-1;width:100%;max-height:240px;object-fit:cover;border-radius:10px;background:var(--soft)}
.fp-opt.w{background:var(--card)}
.fp-play{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.fp-play svg{width:15px;height:15px;fill:currentColor}
.fp-play.lt{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.fp-cost{background:var(--turn-card);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.6}
.fp-acts{display:grid;gap:8px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px #C9BFA6;font:600 14.5px var(--body);min-height:44px;width:100%}
.btn.go{background:var(--done);color:#fff}
.fp-pct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.fp-pct b{font:800 34px/1 var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.fp-track{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}.fp-track i{display:block;height:100%;border-radius:999px;background:var(--teal)}
.fp-wq{display:grid;gap:8px}
.fp-vid{background:var(--card);border:1px solid var(--edge);border-radius:18px;overflow:hidden;display:grid}
.fp-vid .stage{background:var(--ink);display:grid;place-items:center;padding:12px}
.fp-vid video{width:min(100%,260px)}
.fp-vid img{width:min(100%,260px);aspect-ratio:9/16;object-fit:cover;border-radius:18px}
.fp-vcap{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.fp-vcap span:last-child{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fp-link{border:0;border-top:1px solid var(--edge);background:transparent;min-height:48px;font:700 14.5px var(--body);color:var(--ink);cursor:pointer;width:100%}
.fp-rows{display:grid;gap:8px}.fp-rows>h2{font:700 15px var(--body);padding-inline:4px}
.fp-rows .fold{border:1px solid var(--edge);box-shadow:none;border-radius:14px;min-width:0}
.fp-rows details.fold>summary{min-height:52px;font:700 16px var(--body)}
.fp-row{border:1px solid var(--edge);background:var(--card);border-radius:14px;width:100%;min-height:52px;padding:11px 14px;display:flex;align-items:center;gap:8px;font:700 16px var(--body);color:var(--ink);cursor:pointer;text-align:start}
.fp-row span{margin-inline-start:auto;font:600 12.5px var(--body);color:var(--mute);text-align:end}
.fp-row::after{content:"‹";font:800 18px var(--body);color:var(--mute);flex:none}
.fp-rows pre{margin:0;white-space:pre-wrap;font:500 15px/1.7 var(--body)}
.fp-rows .fin img{width:100%;border-radius:12px;background:var(--soft)}
.fp-lbl{font:700 15px var(--body)}
.fp-ask textarea{min-height:64px}
.fp-more{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* review */
.fp-rv{background:var(--ink);border-radius:18px;overflow:hidden;display:grid}
.fp-rv video{width:min(100%,300px);margin:12px auto 0}
.fp-rvc{padding:10px 14px 12px;display:grid;gap:8px;color:var(--bg)}
.fp-rvc .tag{justify-self:center;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 10px;font:700 12.5px var(--body)}
.fp-tl{position:relative;height:22px;direction:ltr}
.fp-tl::before{content:"";position:absolute;top:9px;left:0;right:0;height:4px;border-radius:999px;background:var(--night-line)}
.fp-tl>i{position:absolute;top:9px;left:0;height:4px;border-radius:999px;background:var(--gold);width:0}
.fp-tl .mks{position:absolute;inset:0}.fp-tl .mk{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--rec);border:2px solid var(--ink);margin-left:-8px}
.fp-rvt{display:flex;justify-content:space-between;color:var(--night-mute);font-size:13px;font-variant-numeric:tabular-nums;direction:ltr}
.btn.ondark{background:transparent;box-shadow:inset 0 0 0 1px #5B5547;color:var(--bg);font:600 14px var(--body);min-height:44px}
.btn.rec{background:var(--rec);color:#fff;font:700 14px var(--body);min-height:44px}
.fp-notes{display:grid;gap:8px}
.fp-nrow{display:grid;grid-template-columns:56px minmax(0,1fr) 44px;gap:8px;align-items:center}
.fp-nrow .nt{border:0;background:var(--rec-soft);color:var(--rec-ink);font:700 13px var(--body);border-radius:8px;min-height:36px;cursor:pointer;font-variant-numeric:tabular-nums}
.fp-nrow p{font-size:15px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.fp-x{width:44px;height:44px;border:0;background:transparent;color:var(--mute);cursor:pointer;font:700 20px var(--body)}
.fp-addrow{display:flex;gap:8px}.fp-addrow .inp{flex:1;min-width:0;background:var(--bg)}
.fp-addrow .btn{min-height:44px;font-size:15px;flex:none}
/* voice */
.fp-take{background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.fp-take .fp-play{background:var(--gold);color:var(--ink);width:46px;height:46px}
.fp-tk{display:grid;gap:4px;min-width:0}.fp-tk span{font-size:14px}
.fp-take input[type=range]{width:100%;accent-color:var(--gold);direction:ltr;margin:0;min-height:24px}

function diffFlow(a, b) {                                           // what changed from a (applied) to b (the edit), in Arabic
  const A = Object.fromEntries((a?.nodes || []).map((n) => [n.id, n])), Bn = Object.fromEntries((b?.nodes || []).map((n) => [n.id, n]));

    if ((x.note || '') !== (y.note || '')) out.push(`${L(id, Bn)}: غيّرت الملاحظة`);

    ry.filter((t) => !rx.includes(t)).forEach((t) => out.push(`${L(id, Bn)}: قاعدة يديدة «${t}»`));
    rx.filter((t) => !ry.includes(t)).forEach((t) => out.push(`${L(id, Bn)}: شلت القاعدة «${t}»`));

    db.doc('studio/ig').onSnapshot((d) => { if (d.exists && (!ig || igCached) && d.data().page) { ig = d.data().page; igAt = d.data().at; igCached = true; refresh(); } }, () => {});
    db.doc('studio/ig_choices').onSnapshot((d) => { igChoices = d.exists ? d.data() : {}; refresh(); }, () => {});
    mcp = await window.claude.use('mcp').catch(() => null);
    const firstLoad = setInterval(() => { if (ready) { clearInterval(firstLoad); loadIg(false); } }, 300);
    setInterval(() => { if (document.visibilityState === 'visible') loadIg(false); }, 30 * 60e3);   // the reports move every 3 hours
    setInterval(refresh, 5 * 60e3);                                  // the countdowns move
  } catch (e) { ready = true; route(); }
})();
})();
</script>
