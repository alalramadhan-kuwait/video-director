<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ستوديو تايم كيبر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF7EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* layout: a phone app in the celebration-dial look the owner chose (theme A): cream ground, one bright colour per film,
   rounded cards, a dark floating tab bar; one light look on purpose */
:root{
  --bg:#FBF7EF; --card:#FFFFFF; --ink:#1B1B1B; --mute:#5B5650; --soft:#EFE8DA; --line:#E6DECD;
  --teal:#2BB5B8; --yellow:#F2C230; --coral:#F2765F; --pink:#E9A0C0; --green:#A8D8A0; --blue:#2F5BD3; --ok:#2E8B57;
  --display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.app{max-width:560px;margin:0 auto;position:relative}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:800 34px/1.1 var(--display)}
h2{font:800 21px/1.25 var(--display)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bubbles{position:absolute;inset:0 auto auto 0;width:200px;height:150px;pointer-events:none;z-index:0}
.bubbles span{position:absolute;border-radius:50%}
.top{position:relative;z-index:1;padding-block:26px 6px;display:grid;gap:2px}
.sub{font:700 14px var(--body);color:var(--mute)}
.view{position:relative;z-index:1;display:grid;gap:12px;padding-top:12px}
.now{display:flex;gap:8px;align-items:center;font:700 13.5px var(--body);background:var(--card);border-radius:999px;padding:8px 14px;justify-self:start;box-shadow:0 1px 0 var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 30%,transparent)}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.4}}
/* film cards */
.film{border:0;width:100%;text-align:start;border-radius:24px;padding:14px 18px;display:grid;gap:8px;cursor:pointer;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fname{font:800 20px/1.2 var(--display)}
.pct{font:800 22px/1 var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:999px;background:rgba(27,27,27,.18);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.state{display:flex;gap:6px;align-items:center;font:700 13.5px var(--body)}
.pill{background:var(--bg);border-radius:999px;padding:6px 13px;font:800 13.5px var(--body)}
.empty{background:var(--card);border-radius:24px;padding:18px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.short{border:0;border-radius:22px;padding:14px 16px;min-height:78px;display:flex;align-items:center;gap:10px;font:800 17px var(--display);cursor:pointer;text-decoration:none}
/* film page */
.back{width:44px;height:44px;border-radius:50%;background:var(--ink);border:0;display:grid;place-items:center;cursor:pointer}
.fhead{display:flex;align-items:center;gap:12px}
.fhead .tag{margin-inline-start:auto;border-radius:999px;padding:4px 12px;font:700 13px var(--body);white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.steps li{display:grid;place-items:center}
.steps span{width:34px;height:34px;max-width:100%;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display)}
.steps .todo{background:var(--soft);color:var(--mute)}
.steps .cur{border:3px solid var(--ink)}
.stepname{text-align:center;font:700 14px var(--body)}
.prog{background:var(--card);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;box-shadow:0 1px 0 var(--line)}
.prog b.big{grid-row:span 2;font:800 40px/1 var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.prog .track{background:var(--soft);height:10px}.prog .track i{background:var(--teal)}
.gate{border-radius:28px;padding:16px;display:grid;gap:12px;justify-items:center}
video{width:min(100%,240px);aspect-ratio:9/16;border-radius:18px;background:#000;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.btn{min-height:52px;border-radius:999px;font:800 17px var(--display);cursor:pointer;border:0;padding:8px 16px}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.line{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
textarea{font:inherit;font-size:16px;width:100%;min-height:84px;border-radius:16px;border:0;background:var(--bg);padding:10px 12px;resize:vertical}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{border-radius:20px;padding:12px 14px;display:grid;gap:0}
.act b{font:800 17px var(--display)}.act span{font:700 12.5px var(--body)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:6px 14px;font:700 13px var(--body);background:var(--soft);cursor:pointer;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
/* library, styles, team */
.lang{border-radius:24px;padding:14px 16px;display:grid;gap:8px}
.lang ul{margin:0;padding-inline-start:18px;display:grid;gap:2px;font-size:14px}
.ex{background:rgba(255,255,255,.7);border-radius:14px;padding:8px 12px;display:grid;gap:2px;font:600 14.5px/1.6 var(--body)}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type{border:0;border-radius:22px;padding:14px;min-height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;text-align:start}
.type b{font:800 17px/1.25 var(--display)}.type span{font:700 12px var(--body)}
.typecard{border-radius:26px;padding:16px;display:grid;gap:10px;background:var(--teal)}
.beats{display:flex;gap:4px}
.beats span{border-radius:999px;padding:5px 0;text-align:center;font:700 11px var(--body);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.typecard ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sample{display:grid;gap:6px;justify-items:center;text-align:center}
.sample img,.sample .ph{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:16px;background:var(--soft);max-width:100%}
.sample .ph{display:grid;place-items:center;font:700 12px var(--body);color:var(--mute);padding:6px}
.sample b{font:800 15px var(--display)}
.badge{border-radius:999px;padding:2px 10px;font:700 12px var(--body);justify-self:start}
.group{background:var(--card);border-radius:20px;padding:12px 14px;display:grid;gap:4px;box-shadow:0 1px 0 var(--line)}
.group b{font:800 16px var(--display)}.group p{font-size:13px;color:var(--mute);line-height:1.7}
.readers{display:flex;justify-content:space-between;gap:6px}
.reader{display:grid;justify-items:center;gap:4px;text-align:center}
.reader img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--c)}
.reader b{font:800 13.5px var(--display)}.reader span{font:700 11px var(--body);color:var(--mute)}
.voice{border-radius:20px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.voice b{font:800 18px var(--display)}
/* tab bar */
nav.tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;height:64px;background:var(--ink);border-radius:32px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:20}
nav.tabs a{justify-self:center;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{background:var(--c)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--teal);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:700;z-index:30}
.note{font-size:13px;color:var(--mute)}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;width:100%;direction:rtl}
.slides img{flex:none;width:min(78%,300px);aspect-ratio:4/5;object-fit:cover;border-radius:16px;scroll-snap-align:center;background:var(--soft);box-shadow:0 1px 0 var(--line)}
.caption{background:var(--card);border-radius:20px;padding:12px 14px;display:grid;gap:8px;width:100%;box-shadow:0 1px 0 var(--line)}
.caption pre{margin:0;white-space:pre-wrap;font:500 15px/1.7 var(--body)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.pick button{position:relative;border:0;padding:0;border-radius:12px;background:var(--soft);cursor:pointer;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.pick img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;transition:opacity .15s}
.pick span{position:absolute;inset-block-end:6px;inset-inline-start:6px;background:var(--bg);color:var(--ink);border-radius:999px;padding:1px 9px;font:800 12.5px var(--body)}
.pick button[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--ink)}
.pick button[aria-pressed="true"] img{opacity:.55}
.pick button[aria-pressed="true"] span{background:var(--ink);color:var(--bg)}
.pick button[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 14px var(--body)}
.kind{font:800 11.5px var(--body);background:var(--bg);border-radius:999px;padding:2px 9px}
</style>

<div class="app" dir="rtl" lang="ar">
  <div class="bubbles" aria-hidden="true"><span style="top:-60px;left:-50px;width:190px;height:190px;background:var(--teal);opacity:.9"></span><span style="top:40px;left:80px;width:64px;height:64px;background:var(--yellow)"></span><span style="top:-20px;left:130px;width:40px;height:40px;background:var(--coral)"></span><span style="top:110px;left:20px;width:30px;height:30px;background:var(--pink)"></span></div>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="الأقسام" id="tabs"></nav>
<div id="toast" hidden role="status"></div>

<script>
(() => {
const COLORS = ['#2BB5B8', '#F2765F', '#E9A0C0', '#A8D8A0', '#F2C230'];
const STEPS = ['الفكرة والبحث', 'الهوك والسكربت', 'القرّاء', 'الصوت', 'الإيقاع والانتقالات', 'الستايل', 'الصور والتركيب', 'المراجعة', 'التسليم'];
const TABS = [
  { id: 'films', name: 'الأفلام', c: '#2BB5B8', icon: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>' },
  { id: 'library', name: 'المكتبة', c: '#F2765F', icon: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8"/>' },
  { id: 'styles', name: 'الستايلات', c: '#F2C230', icon: '<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>' },
  { id: 'recreate', name: 'ريل عجبك', c: '#E9A0C0', icon: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>' },
  { id: 'team', name: 'الفريق', c: '#A8D8A0', icon: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5M11 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5"/>' }];
const READERS = [['نورة', 'noura', 'مبتدئة', '#E9A0C0'], ['فهد', 'fahad', 'متوسط', '#2BB5B8'], ['بو خالد', 'bukhaled', 'خبير', '#F2C230'], ['سالم', 'salem', 'الفلتر', '#A8D8A0'], ['إتيان', 'etienne', 'البراند', '#F2765F']];
const VOICES = [['Jarnathan', 'المعتمد ✓', '#2BB5B8'], ['Ali TK', 'صوتك', '#EFE8DA'], ['OmniVoice', 'يشتغل · يستنسخ صوتك من مقطع 10–30 ث', '#EFE8DA'], ['ناصر', 'متاح', '#EFE8DA'], ['Abdullah', 'Halter', '#EFE8DA']];
const LOOKS = [
  { name: 'بيانات', fits: 'الأرقام والآليات', imgs: ['samples/data-1.jpg', 'samples/data-2.jpg', 'samples/data-3.jpg'], built: true, film: 'الياقوت' },
  { name: 'ورقي', fits: 'الأشخاص والبراندات', imgs: ['samples/paper-1.jpg', 'samples/paper-2.jpg', 'posters/halter-1.jpg'], built: true, film: 'Halter' },
  { name: 'رسم تقني', fits: 'كيف تشتغل القطعة', imgs: ['samples/technical-1.jpg'], built: true, film: 'الياقوت' },
  { name: 'نقش النحاس', fits: 'التاريخ والوثائق والأشخاص', imgs: ['samples/engraving-7.jpg', 'samples/engraving-34.5.jpg', 'samples/engraving-59.jpg'], built: true, film: 'الياقوت · نقش' },
  { name: 'آرت ديكو', fits: 'الإعلانات والفخامة والعشرينات', imgs: ['samples/deco-11.jpg', 'samples/deco-31.jpg', 'samples/deco-56.jpg'], built: true, film: '10:10' }];
const CODE = [['وثائقي', 'نشرة 1920، أخبار بالكابشن، تحقيق بصري، مونتاج بنائي…', 8], ['أدلة', 'تفكيك القطع، المجهر، طاولة الأرشيف، لوحة هندسية…', 8],
  ['رسم يدوي', 'ألوان مائية، حبر صيني، طباشير، كتاب بالشمع…', 8], ['طباعة ونقش', 'نقش النحاس، الحفر بالخشب، ريزوغراف…', 6], ['جرافيك', 'آرت ديكو، سويسري، بلوبرنت، زجاج معشّق…', 7],
  ['معلومات', 'قصص بالبيانات، إنفوجرافيك، عرض داكن، خريطة مترو…', 8], ['كرتون وألعاب وسينما ومواد', 'أنمي الثمانينات، بكسل، فيلم صامت، خيال ظل، كتاب منبثق…', 21]];
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let films = [], now = null, lib = null, db = null, comments = null, ready = false, openType = null, openLang = 'tk', openFormat = 'reel';
const picks = {};                                                  // slides chosen for a change, per carousel (kept across live refreshes)
let chgOpen = null;
const picked = (id) => picks[id] || (picks[id] = new Set());
const slideName = (k) => (k === 0 ? 'الغلاف' : `${k}`);
const FORMAT = { reel: 'ريل', carousel: 'كاروسيل', both: 'ريل وكاروسيل' };

function pct(f) { return f.state === 'done' ? 100 : Math.round(100 * (Math.max(1, f.step || 1) - 1) / STEPS.length); }
function color(f, i) { return f.color || COLORS[i % COLORS.length]; }
function eta(m) { if (m == null) return ''; return m < 60 ? `~${m} د` : `~${Math.round(m / 6) / 10} س`; }
function stateLine(f) {
  if (f.state === 'waiting') return { icon: '⏸', text: 'بانتظارك · ' + (f.waiting || STEPS[(f.step || 1) - 1]), action: true };
  if (f.state === 'working') return { icon: '⏱', text: 'يشتغل · ' + (f.now || STEPS[(f.step || 1) - 1]), eta: f.eta_min };
  if (f.state === 'done') return { icon: '✓', text: f.done_text || 'جاهز للنشر' };
  return { icon: '', text: STEPS[(f.step || 1) - 1] };
}

function tabs(active) {
  $('#tabs').innerHTML = TABS.map((t) => `<a href="#${t.id}" style="--c:${t.c}" aria-label="${t.name}" ${t.id === active ? 'aria-current="page"' : ''}>
    <svg viewBox="0 0 24 24" aria-hidden="true" stroke="${t.id === active ? '#1B1B1B' : t.c}">${t.icon}</svg></a>`).join('');
}
function header(title, sub) { return `<header class="top"><h1>${esc(title)}</h1>${sub ? `<span class="sub">${sub}</span>` : ''}</header>`; }
function nowLine() {
  if (!now) return '';
  return `<div class="now"><span class="dot${now.busy ? ' on' : ''}"></span>${now.busy ? 'Claude يشتغل' : 'Claude واقف'}${now.text ? ' · ' + esc(now.text) : ''}</div>`;
}

function viewFilms() {
  const waiting = films.filter((f) => f.state === 'waiting').length, working = films.filter((f) => f.state === 'working').length;
  let h = header('أفلامنا', ready ? `${waiting} بانتظارك · ${working} يشتغل` : 'جاري التحميل…') + nowLine();
  if (ready && !films.length) h += `<div class="empty"><b style="font:800 18px var(--display)">ما فيه أفلام للحين</b><p class="note">أرسل لي فكرة في المحادثة، ويطلع الفلم هنا بنسبته ووقته.</p></div>`;
  films.forEach((f, i) => {
    const s = stateLine(f), p = pct(f);
    h += `<button type="button" class="film" style="background:${color(f, i)}" data-film="${esc(f.id)}">
      <span class="row"><span class="fname">${esc(f.name)} ${f.kind === 'carousel' ? '<span class="kind">كاروسيل</span>' : ''}</span><span class="pct">${p}%</span></span>
      <span class="track" aria-hidden="true"><i style="width:${p}%"></i></span>
      <span class="row"><span class="state">${s.icon} ${esc(s.text)}</span>${s.action ? '<span class="pill">افتح ▶</span>' : s.eta != null ? `<span class="state">باقي ${eta(s.eta)}</span>` : ''}</span>
    </button>`;
  });
  h += `<div class="shortcuts"><a class="short" href="#recreate" style="background:var(--yellow);color:var(--ink)">ريل عجبك</a><a class="short" href="#library" style="background:var(--blue);color:#fff">فكرة جديدة</a></div>`;
  return h;
}

function viewFilm(id) {
  const i = films.findIndex((f) => f.id === id), f = films[i];
  if (!f) return header('الفلم', ready ? 'ما لقيت هالفلم' : 'جاري التحميل…') + '<a class="chip" href="#films">→ الأفلام</a>';
  const c = color(f, i), p = pct(f), step = f.step || 1, s = stateLine(f);
  const dots = STEPS.map((n, k) => {
    const cls = k + 1 < step || f.state === 'done' ? '' : k + 1 === step ? 'cur' : 'todo';
    const bg = cls === '' ? `background:${COLORS[k % COLORS.length]}` : '';
    return `<li><span class="${cls}" style="${bg}" title="${n}">${k + 1}</span></li>`;
  }).join('');
  let h = `<header class="top fhead"><button type="button" class="back" aria-label="رجوع" data-go="films"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF7EF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 style="font-size:28px">${esc(f.name)}</h1>${f.version ? `<span class="tag" style="background:${c}">${esc(f.version)}${f.seconds ? ' · ' + f.seconds + 'ث' : ''}</span>` : ''}</header>`;
  h += `<ol class="steps" aria-label="المراحل">${dots}</ol><p class="stepname">${esc(STEPS[step - 1])}</p>`;
  h += `<div class="prog"><b class="big">${p}%</b><span class="track" aria-hidden="true"><i style="width:${p}%"></i></span>

async function tell(text, el, record) {
  let sent = false;
  try {
    if (comments && (await comments.canSendToClaude()) === 'available') { await comments.sendToClaude({ anchor: await comments.anchorFor(el), text }); sent = true; }
  } catch (e) { /* kept in the inbox below */ }
  try { if (db) await db.collection('inbox').add({ ...record, text, sent, at: new Date().toISOString() }); } catch (e) {}
  toast(sent ? 'وصلت لـ Claude ✓' : 'انحفظت هنا. قل لي «شيّك الاستوديو» في المحادثة.');
}
async function act(b) {
  const kind = b.dataset.act, id = b.dataset.id, f = films.find((x) => x.id === id);
  if (kind === 'change') { const box = $('#chg'); box.hidden = !box.hidden; chgOpen = box.hidden ? null : id; if (!box.hidden && f.kind !== 'carousel') $('#note').focus(); return; }
  if (kind === 'copy') {
    try { await navigator.clipboard.writeText(f.caption || ''); toast('انسخ الكابشن ✓'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#cap')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('اضغط مطوّل وانسخ.'); }
    return;

  if (kind === 'share') { share(f, b); return; }
  if (kind === 'one') { one(f, +b.dataset.k, b); return; }
  if (kind === 'saveall' || kind === 'savecap') { await save(kind, f, b); return; }
  b.disabled = true;
  try {
    if (kind === 'approve') await tell(`الاستوديو: موافق على «${f.name}» ${f.version || ''} (${STEPS[(f.step || 1) - 1]}).`, b, { film: id, kind: 'approve', step: f.step });
    else if (kind === 'send') {

      if (!note) { toast('اكتب وش تبي يتغيّر.'); return; }
      const where = slides.length ? ' · ' + slides.map((k) => (k === 0 ? 'الغلاف' : `الشريحة ${k}`)).join('، ') : '';
      await tell(`الاستوديو: تعديل على «${f.name}» ${f.version || ''}${where}: ${note}`, b, { film: id, kind: 'change', step: f.step, note, ...(slides.length ? { slides: slides.map((k) => f.slides[k]) } : {}) });
      picked(id).clear(); chgOpen = null; route();
    } else if (kind === 'twin') {

      await tell(`الاستوديو: سوّ ${want} من «${f.title || f.name}» (${f.version || ''}): نفس المعلومات والمصادر.`, b, { film: id, kind: 'twin', format: f.kind === 'carousel' ? 'reel' : 'carousel' });
    } else if (kind === 'start') {
      const T = lib.types[b.dataset.type];
      await tell(`الاستوديو: ابدأ ${FORMAT[openFormat]} جديد من نوع «${T.name}» بلغة «${lib.languages[openLang].name}». (أرسل لي الموضوع في المحادثة.)`, b, { kind: 'start', type: b.dataset.type, language: openLang, format: openFormat });
    }
  } finally { b.disabled = false; }
}
// The owner: «instead of save, make it as I can share it… I want to share all along the caption». Inside the Claude app
// the page cannot open the phone's share sheet with several files, and each save is one file with its own prompt; so
// «شارك الكل» shares the slides where the viewer allows it (a browser), and otherwise saves ONE zip holding every
// slide and the caption, which the phone's Files app opens into the images. The caption also goes to the clipboard.
// The files are fetched when the page opens, so the tap reaches the share with nothing awaited first.
const shareFiles = {};
function prefetch(f) {
  if (!f?.slides?.length || shareFiles[f.id]) return;

    .then((files) => (shareFiles[f.id] = files), () => { delete shareFiles[f.id]; });
}
function crc32(u8) {

async function share(f, b) {
  const files = Array.isArray(shareFiles[f.id]) ? shareFiles[f.id] : null;
  if (!files) { toast('لحظة، الصور تتحمّل… اضغط مرة ثانية.'); prefetch(f); return; }
  if (f.caption) navigator.clipboard?.writeText(f.caption).catch(() => {});
  if (navigator.canShare?.({ files })) {
    try { await navigator.share({ files }); toast(f.caption ? 'الكابشن منسوخ: الصقه مع البوست ✓' : 'تم ✓'); return; }
    catch (e) { if (e?.name === 'AbortError') return; }
  }
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
  if (!dl) { toast('المشاركة مو متاحة هنا. اضغط مطوّل على الصورة واحفظها.'); return; }
  b.disabled = true;
  try {
    const items = await Promise.all(files.map(async (x) => ({ name: x.name, data: new Uint8Array(await x.arrayBuffer()) })));
    if (f.caption) items.push({ name: `${f.id}-caption.txt`, data: new TextEncoder().encode(f.caption) });
    await dl.save({ filename: `${f.id}.zip`, data: zip(items) });
    toast(f.caption ? 'الكابشن منسوخ ✓ افتح الملف في Files' : 'افتح الملف في Files ✓');
  } catch (e) { if (e?.code !== 'declined') toast('ما قدرت أجهز الملف. شارك الصور وحدة وحدة تحت.'); }
  finally { b.disabled = false; }
}
async function one(f, k, b) {                                        // one slide: its own share sheet (Save Image)
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
  const files = Array.isArray(shareFiles[f.id]) ? shareFiles[f.id] : null;
  if (files && navigator.canShare?.({ files: [files[k]] }) && !dl) { navigator.share({ files: [files[k]] }).catch(() => {}); return; }
  if (!dl) { toast('اضغط مطوّل على الصورة واحفظها.'); return; }
  b.disabled = true;
  try {
    const data = files ? files[k] : await (await fetch(f.slides[k])).blob();
    await dl.save({ filename: `${f.id}-${String(k + 1).padStart(2, '0')}.png`, data });
    b.classList.add('on');
  } catch (e) { if (e?.code === 'rate_limited') toast('لحظة وجرّب مرة ثانية.'); }
  finally { b.disabled = false; }

      try { await dl.save({ filename: `${f.id}-${String(k + 1).padStart(2, '0')}.png`, data: blob }); n++; } catch (e) { break; }
    }
    toast(n ? `انحفظت ${n} صور ✓` : 'ما انحفظ شي.');
  } catch (e) { toast('ما قدرت أحفظ. جرّب مرة ثانية.'); }
  finally { b.disabled = false; }
}
function toast(t) { const n = $('#toast'); n.textContent = t; n.hidden = false; clearTimeout(n._t); n._t = setTimeout(() => (n.hidden = true), 6000); }

function refresh() {                                                // live data never interrupts a playing film or a note being typed
  const v = document.querySelector('video'), t = document.getElementById('note');
  if ((v && !v.paused) || (t && t.value.trim()) || document.activeElement?.tagName === 'TEXTAREA') return;
  route();
}
window.addEventListener('hashchange', route);

fetch('library.json').then((r) => r.json()).then((j) => { lib = j; route(); }).catch(() => {});
(async () => {
  try {

    db.doc('studio/now').onSnapshot((d) => { now = d.exists ? d.data() : null; refresh(); }, () => {});
  } catch (e) { ready = true; route(); }
})();
