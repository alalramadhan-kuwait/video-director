<style>

}

  --paper:#16171A; --card:#202227; --ink:#ECE8DF; --muted:#A39F95; --line:#34363C; --accent:#D2B06A;
  --ok:#8CC9A0; --okb:#1E3326; --warn:#E6BE6A; --warnb:#3A2E14; --bad:#F0A39C; --badb:#3D1F1D; --info:#AFC0E6; --infob:#232B3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171A; --card:#202227; --ink:#ECE8DF; --muted:#A39F95; --line:#34363C; --accent:#D2B06A;
  --ok:#8CC9A0; --okb:#1E3326; --warn:#E6BE6A; --warnb:#3A2E14; --bad:#F0A39C; --badb:#3D1F1D; --info:#AFC0E6; --infob:#232B3D; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);margin:0}

.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 64px}
h1{font-size:1.25rem;margin:0;text-wrap:balance} h2{font-size:1.05rem;margin:0;text-wrap:balance} h3{font-size:.95rem;margin:0}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}

.between{justify-content:space-between}

button.lang{min-height:32px;padding:4px 10px;font-size:.8rem}

.lightbox img{max-height:100%;max-width:100%;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 14px;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

    ['7', 'Low', 'Mobile and usability', 'Wrong toast after switching back to an authorized voice, mid-animation previews, tiny disclaimers, never tried on a real iPhone.', 'Fix after your notes from this copy.']] };

// ---------------------------------------------------------------- saved review decisions (artifact store; owner writes)
let DB = null, DECISIONS = [], CANWRITE = false;
(async () => {
  try {
    const user = await window.claude?.use?.('user');
    DB = await window.claude?.use?.('db');
    CANWRITE = !!DB && ((user && (await user.isOwner())) ?? false);
    if (DB) DB.collection('decisions').orderBy('at', 'asc').onSnapshot((snap) => { DECISIONS = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => { DB = null; render(); });
  } catch (e) { DB = null; }
  render();
})();
async function save(kind, target, decision, extra = {}) {
  if (!DB || !CANWRITE) { toast(t('cantSave')); return false; }
  try { await DB.collection('decisions').add({ kind, target, decision, ...extra, at: new Date().toISOString() }); toast(t('saved')); return true; }
  catch (e) { toast(t('notSaved') + ' (' + (e.code || 'error') + ')'); return false; }
}
const latest = (kind, target) => DECISIONS.filter((d) => d.kind === kind && d.target === target).pop();
const decText = (d) => `<b>${esc(st(d.decision))}</b>${d.version ? ' · v' + esc(d.version) : ''}${d.changes?.length ? ' · ' + esc(d.changes.map(chip).join('، ')) : ''}${d.word ? ' · «' + esc(d.word) + '»' : ''}${d.note ? ' — ' + esc(d.note) : ''}`;
const savedNote = (d) => d ? `<div class="saved">${t('savedD')}: ${decText(d)} <span class="tiny muted">· ${t('notApplied')}</span></div>` : '';
const saveState = () => !DB ? `<span class="tiny muted">${t('cantSave')}</span>` : !CANWRITE ? `<span class="tiny muted">${t('readOnly')}</span>` : '';

// ---------------------------------------------------------------- media: fetched once, played from memory (works without range requests)
const BLOBS = {};
async function blobUrl(src, onprog) {
  if (BLOBS[src]) return BLOBS[src];
  const r = await fetch(src); if (!r.ok) throw new Error('HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0; const reader = r.body?.getReader?.();
  let blob;
  if (reader && total && onprog) { const parts = []; let got = 0; for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; onprog(got, total); } blob = new Blob(parts, { type: r.headers.get('content-type') || 'video/mp4' }); }
  else blob = await r.blob();
  return (BLOBS[src] = URL.createObjectURL(blob));
}
let FILM = null, STOP_AT = null;
async function filmReady() {
  const v = $('#film'); if (!v) return null;
  if (FILM) return v;
  const stt = $('#filmstate');
  const src = v.canPlayType('video/mp4; codecs="avc1.4d401f, mp4a.40.2"') ? D.film.src : D.film.webm;   // iPhone: MP4
  try { v.src = await blobUrl(src, (g, n) => (stt.textContent = t('loading', (g / 1e6).toFixed(1), (n / 1e6).toFixed(1)))); } catch (e) { v.src = src; }
  await new Promise((ok) => { if (v.readyState >= 1) ok(); else v.addEventListener('loadedmetadata', ok, { once: true }); });
  stt.textContent = t('loaded'); FILM = v; return v;
}
async function playRange(a, b) { const v = await filmReady(); if (!v) return; STOP_AT = b; v.currentTime = a; try { await v.play(); } catch (e) { toast(t('tapPlay')); } }
document.addEventListener('timeupdate', (e) => { const v = e.target; if (v.id === 'film' && STOP_AT != null && v.currentTime >= STOP_AT) { v.pause(); STOP_AT = null; } }, true);
const AUD = new Audio(); let AUD_STOP = null, AUD_TAKE = null;
AUD.addEventListener('timeupdate', () => { if (AUD_STOP != null && AUD.currentTime >= AUD_STOP) { AUD.pause(); AUD_STOP = null; } hiWord(); });
async function playTake(take, from = 0, to = null) {
  try { const u = await blobUrl(take.audio); if (AUD.dataset.src !== u) { AUD.src = u; AUD.dataset.src = u; } } catch (e) { toast(t('audioErr')); return; }
  AUD_TAKE = take; AUD_STOP = to; AUD.currentTime = from; try { await AUD.play(); } catch (e) { toast(t('audioErr')); }
}
function hiWord() { if (!AUD_TAKE) return; const x = AUD.currentTime; $$(`[data-w="${AUD_TAKE.id}"]`).forEach((b) => { const w = AUD_TAKE.words[+b.dataset.i]; b.classList.toggle('on', !AUD.paused && x >= w.s && x < w.e); }); }
AUD.addEventListener('pause', hiWord);

// ---------------------------------------------------------------- screens
const scenePill = (s) => s.unreviewed ? `<span class="pill p-warn">${t('unrev')}</span>${s.placeholder ? `<span class="pill p-bad">${t('placeholder')}</span>` : ''}` : `<span class="pill p-ok">${t('approvedV', s.approved.version)}</span>`;
function film() {
  const h = D.hook, sel = h.options.find((o) => o.id === h.selected);

  <section class="card"><div class="row between"><h2>${t('hook')} · ${esc(sel.id)}</h2><button data-scene-play="h">${t('playHook')}</button></div>
    ${ar(sel.spoken)}<p class="small"><b>${t('onScreen')}:</b> <span class="ar" style="display:inline">${esc(sel.on_screen)}</span></p>
    <div class="thumbs">${sel.frames.map((f, i) => `<img src="${esc(f)}" alt="${esc(sel.id)} ${i + 1}" data-zoom loading="lazy">`).join('')}</div>
    <details><summary>${t('why')}</summary><p class="small" dir="ltr">${esc(h.reasons)}</p></details>
    <details><summary>${t('others')}</summary><div class="stack">${h.options.filter((o) => o.id !== sel.id).map((o) => `<div class="stack" style="gap:4px"><b class="small mono">${esc(o.id)}</b>${ar(o.spoken)}<div class="thumbs">${o.frames.slice(0, 2).map((f) => `<img src="${esc(f)}" alt="${esc(o.id)}" data-zoom loading="lazy">`).join('')}</div></div>`).join('')}</div></details>
    <div class="row"><button class="save" data-hook-dec="keep_hook">${t('keepHook')}</button><button class="save" data-hook-dec="reconsider_hook">${t('reHook')}</button></div>${savedNote(latest('hook', 'hook'))}</section>`;
}
function scenes() {
  return `<section class="card"><h2>${t('scenesTitle', D.scenes.filter((s) => s.unreviewed).length)}</h2>${saveState()}</section>
  ${D.scenes.map((s) => {
    const vers = s.versions.length ? s.versions : [{ v: 1, status: 'default', stills: s.frames.map((f) => f.src), changes: {} }];
    return `<section class="card ${s.unreviewed ? 'flagged' : ''}" id="sc-${s.id}">
      <div class="row between"><div class="row"><span class="sid">${s.id}</span>${scenePill(s)}</div><span class="tiny muted">${tc(s.start)}–${tc(s.end)} · ${esc(tech(s.technique))}</span></div>
      ${ar(s.line)}
      <div class="frames">${s.frames.map((f) => `<img src="${esc(f.src)}" alt="${s.id} ${f.t}" data-zoom loading="lazy">`).join('')}</div>
      <div class="row"><button data-scene-play="${s.id}">${t('playScene')}</button></div>
      ${vers.length > 1 ? `<div class="thumbs">${vers.map((x) => `<figure><img src="${esc(x.stills[0])}" alt="${s.id} v${x.v}" data-zoom loading="lazy"><figcaption>v${x.v} ${x.status ? '· ' + esc(st(x.status)) : ''}</figcaption></figure>`).join('')}</div>` : ''}
      <div class="row">${vers.map((x) => `<button class="save" data-sc-approve="${s.id}" data-v="${x.v}">${t('approveV', x.v)}</button>`).join('')}</div>
      <details><summary>${t('reqChanges')}</summary><div class="stack">
        <div class="row">${s.chips.map((c) => `<button class="chip" data-chip="${s.id}" data-c="${c}" aria-pressed="false">${esc(chip(c))}</button>`).join('')}</div>
        <textarea id="note-${s.id}" rows="2" placeholder="${t('modPh')}"></textarea>
        <div class="row"><button class="save" data-sc-mod="${s.id}">${t('send')}</button></div></div></details>
      ${savedNote(latest('scene', s.id))}</section>`; }).join('')}`;
}
let PICK = {};
function voice() {
  return `<section class="card"><h2>${t('voiceTitle')}</h2>${saveState()}</section>
  ${D.voice.map((l) => `<section class="card" id="vo-${l.line}"><div class="row between"><span class="sid">${l.line}</span><span class="pill ${l.status === 'approved' ? 'p-ok' : 'p-warn'}">${esc(st(l.status))}</span></div>
    ${l.takes.map((tk, k) => `<div class="stack" style="gap:6px"><div class="row between"><span class="small"><b>${l.takes.length > 1 ? (k ? t('after') : t('before')) : t('take')}</b> <span class="mono">${tk.seconds.toFixed(1)}s</span></span><button data-play="${tk.id}">${t('play')}</button></div>
      <div class="words">${tk.words.map((w, i) => `<button data-w="${tk.id}" data-i="${i}">${esc(w.w)}</button>`).join('')}</div>
      <details><summary>${t('heard')}</summary><p class="ar small">${esc(tk.heard)}</p></details></div>`).join('')}
    <textarea id="vnote-${l.line}" rows="1" placeholder="${t('vnotePh')}"></textarea>
    <div class="row"><button class="save" data-v-ok="${l.line}">${t('soundsRight')}</button><button class="save" data-v-flag="${l.line}">${t('flag')}</button><span class="tiny muted" id="pick-${l.line}">${PICK[l.line] ? t('picked', esc(PICK[l.line].w)) : t('noPick')}</span></div>
    ${savedNote(latest('voice', l.line))}</section>`).join('')}`;
}
function artTab() {
  return D.gallery.map((g) => `<section class="card"><div class="row between"><h3><span class="sid">${g.scene}</span></h3>${g.approved ? `<span class="pill p-ok">${esc(tech(D.scenes.find((s) => s.id === g.scene)?.technique || ''))} · v${g.approved.version}</span>` : `<span class="pill p-warn">${t('artNone')}</span>`}</div>
    ${g.concepts.map((c) => `<div class="stack" style="gap:6px"><div class="row"><b class="small">${esc(tech(c.technique))}</b>${c.support !== 'rendered' ? `<span class="pill p-bad">${t('blocked')}</span>` : ''}${c.selected ? `<span class="pill p-info">${t('selected')}</span>` : ''}</div>
      ${c.versions.some((x) => x.stills.length) ? `<div class="thumbs">${c.versions.filter((x) => x.stills.length).map((x) => `<figure><img src="${esc(x.stills[0])}" alt="${esc(c.id)} v${x.v}" data-zoom loading="lazy"><figcaption>v${x.v}${x.status ? ' · ' + esc(st(x.status)) : ''}</figcaption></figure>`).join('')}</div>` : ''}</div>`).join('')}</section>`).join('');
}
function inbox() {
  const mine = DECISIONS.slice().reverse();
  return `<section class="card"><h2>${t('mine')} (${mine.length})</h2>${saveState()}
    ${mine.length ? mine.map((d) => `<div class="saved">${esc((LANG === 'ar' ? KIND.ar[d.kind] : d.kind) || d.kind)} <span class="mono">${esc(d.target)}</span> · ${decText(d)}</div>`).join('') : `<p class="small muted">${t('noneYet')}</p>`}</section>
  <section class="card"><h2>${t('open')}</h2>
    ${D.inbox.flatMap((g) => g.items).map((i) => `<p class="small"><span class="pill ${i.wait ? 'p-info' : 'p-warn'}">${i.wait ? t('waiting') : t('toDecide')}</span> ${esc(inboxText(i.what))}</p>`).join('')}
    <p class="small"><span class="pill p-warn">${t('unrevScenes')}</span> ${D.scenes.filter((s) => s.unreviewed).map((s) => `<a href="#scenes" data-goto="sc-${s.id}" class="mono">${s.id}</a>`).join(' · ')}</p></section>`;
}
function history() {
  return `<section class="card"><h2>${t('steps')}</h2><div class="row">${D.steps.map((s) => `<span class="pill ${s.state === 'approved' ? 'p-ok' : 'p-warn'}">${esc((LANG === 'ar' ? STEP.ar[s.id] : null) || s.name)} · ${esc(st(s.state))}</span>`).join('')}</div></section>
  <details class="card"><summary>${t('work')}</summary><div class="tablewrap" dir="ltr"><table>${D.runs.map((r) => `<tr><td>${esc(r.task)}</td><td class="mono">${esc(r.units)}</td><td class="mono">${r.elapsed_s != null ? Math.round(r.elapsed_s) + 's' : ''}</td><td>${esc(r.state)}</td></tr>`).join('')}</table></div></details>
  <details class="card"><summary>${t('hist', D.history.length)} · <span class="tiny">${t('histNote')}</span></summary><div class="tablewrap" dir="ltr"><table>${D.history.slice().reverse().map((h) => `<tr><td class="mono tiny">${esc(h.at.slice(5, 16).replace('T', ' '))}</td><td class="small">${esc(h.summary)}</td></tr>`).join('')}</table></div></details>`;
}
function fixes() {
  return `<section class="card"><h2>${t('planTitle')}</h2></section>
  ${PLAN[LANG].map(([n, sev, ti, why, how]) => `<section class="card"><div class="row"><span class="prio">P${n}</span><span class="pill ${n <= '2' ? 'p-bad' : n === '7' ? 'p-info' : 'p-warn'}">${esc(sev)}</span><h3>${esc(ti)}</h3></div>
    <details><summary>${t('what')} · ${t('how')}</summary><div class="stack" style="gap:6px"><p class="small">${esc(why)}</p><p class="small"><b>${t('how')}:</b> ${esc(how)}</p></div></details></section>`).join('')}`;
}
function about() {
  return `<section class="card"><h2>${t('access')}</h2>
    <div class="legend"><span class="pill p-info">${t('viewOnly')}</span><span>${t('viewOnlyD')}</span><span class="pill p-warn">● ${t('saves')}</span><span>${t('savesD')}</span><span class="pill p-bad">${t('never')}</span><span>${t('neverD')}</span></div>
    <p class="tiny muted">${t('snapshot')} · <span class="mono">${esc(D.project.snapshot.slice(0, 16).replace('T', ' '))}</span> · <span class="mono">95a8646</span></p></section>`;
}
const SCREENS = { film, scenes, voice, art: artTab, inbox, history, fixes, about };
const KEYS = Object.keys(SCREENS);
let CUR = (location.hash || '#film').slice(1); if (!SCREENS[CUR]) CUR = 'film';
function render() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr'; document.body.classList.toggle('rtl', LANG === 'ar');
  $('#title').textContent = t('title'); $('#lang').textContent = t('lang'); $('#lock').textContent = t('lock');
  const keep = window.scrollY, notes = {}; $$('textarea').forEach((x) => (notes[x.id] = x.value));
  const chips = $$('[data-chip][aria-pressed="true"]').map((b) => b.dataset.chip + '|' + b.dataset.c);
  const opened = $$('details[open]').map((d) => d.querySelector('summary')?.textContent);
  $('#tabs').innerHTML = KEYS.map((k, i) => `<a href="#${k}" ${k === CUR ? 'aria-current="page"' : ''}>${t('tabs')[i]}</a>`).join('');
  const oldVid = CUR === 'film' ? $('#film') : null, oldState = $('#filmstate')?.textContent;
  $('#main').innerHTML = `<div class="screen">${SCREENS[CUR]()}</div>`;
  if (oldVid) { $('#film').replaceWith(oldVid); if (FILM && oldState) $('#filmstate').textContent = t('loaded'); } else FILM = null;
  Object.entries(notes).forEach(([k, v]) => { const x = document.getElementById(k); if (x) x.value = v; });
  chips.forEach((c) => { const [s, k] = c.split('|'); const b = $(`[data-chip="${s}"][data-c="${k}"]`); if (b) b.setAttribute('aria-pressed', 'true'); });
  $$('details').forEach((d) => { if (opened.includes(d.querySelector('summary')?.textContent)) d.open = true; });
  if (!CANWRITE) $$('button.save').forEach((b) => (b.disabled = true));
  window.scrollTo(0, keep);
}
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (SCREENS[k]) { CUR = k; render(); window.scrollTo(0, 0); } });
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('button, img[data-zoom], a[data-goto], #lightbox'); if (!el) return;
  if (el.id === 'lightbox') { el.hidden = true; return; }
  if (el.id === 'lang') { LANG = LANG === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('lang', LANG); } catch (e) {} render(); return; }
  if (el.matches('img[data-zoom]')) { $('#lbimg').src = el.src; $('#lbimg').alt = el.alt; $('#lightbox').hidden = false; return; }
  if (el.dataset.goto) { ev.preventDefault(); CUR = 'scenes'; location.hash = '#scenes'; render(); document.getElementById(el.dataset.goto)?.scrollIntoView(); return; }
  const d = el.dataset;
  if (el.id === 'loadfilm') { const v = await filmReady(); if (v) { STOP_AT = null; try { await v.play(); } catch (e) {} } return; }
  if (d.scenePlay) { const s = D.scenes.find((x) => x.id === d.scenePlay); if (CUR !== 'film') { CUR = 'film'; location.hash = '#film'; render(); } $('#film').scrollIntoView({ block: 'center' }); playRange(s.start, s.end); return; }
  if (d.play) { playTake(D.voice.flatMap((l) => l.takes).find((x) => x.id === d.play)); return; }
  if (d.w) { const l = D.voice.find((x) => x.takes.some((k) => k.id === d.w)); const tk = l.takes.find((k) => k.id === d.w); const w = tk.words[+d.i];
    PICK[l.line] = { take: tk.id, i: +d.i, w: w.w }; $$('.words button.pick').forEach((b) => b.classList.remove('pick')); el.classList.add('pick');
    $('#pick-' + l.line).textContent = t('picked', w.w); playTake(tk, Math.max(0, w.s - 0.05), w.e + 0.08); return; }
  if (d.chip) { el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
  if (d.filmDec) { if (await save('film', D.film.id, d.filmDec, { note: $('#filmnote').value.trim() })) $('#filmnote').value = ''; return; }
  if (d.hookDec) { await save('hook', 'hook', d.hookDec, { hook: D.hook.selected }); return; }
  if (d.scApprove) { await save('scene', d.scApprove, 'approve_version', { version: +d.v }); return; }
  if (d.scMod) { const ch = $$(`[data-chip="${d.scMod}"][aria-pressed="true"]`).map((b) => b.dataset.c); const note = $('#note-' + d.scMod).value.trim();
    if (!ch.length && !note) { toast(t('pickFirst')); return; }
    if (await save('scene', d.scMod, 'request_changes', { changes: ch, note })) { $('#note-' + d.scMod).value = ''; $$(`[data-chip="${d.scMod}"]`).forEach((b) => b.setAttribute('aria-pressed', 'false')); } return; }
  if (d.vOk) { await save('voice', d.vOk, 'sounds_right', { note: $('#vnote-' + d.vOk).value.trim() }); return; }
  if (d.vFlag) { const p = PICK[d.vFlag]; if (!p) { toast(t('noPick')); return; }
    if (await save('voice', d.vFlag, 'flag_word', { word: p.w, word_index: p.i, take: p.take, note: $('#vnote-' + d.vFlag).value.trim() })) { $('#vnote-' + d.vFlag).value = ''; delete PICK[d.vFlag]; } return; }
});
render();
</script>
